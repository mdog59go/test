<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 籃球挑戰賽 - 一甲國小</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #000000;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Custom crosshair & aiming circle */
        .crosshair-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .aim-circle {
            width: 90px;
            height: 90px;
            border: 3px dashed rgba(239, 68, 68, 0.85);
            border-radius: 50%;
            animation: pulse-aim 2s infinite;
        }
        .crosshair-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
        }
        @keyframes pulse-aim {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-black text-white select-none">

    <!-- Start Modal -->
    <div id="start-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="inline-flex p-4 bg-orange-600/20 rounded-2xl text-orange-500 mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">3D 籃球挑戰賽</h1>
            <p class="text-slate-400 text-sm">歡迎來到沉浸式 3D 籃球場！請輸入您的名字以開始挑戰。</p>
            
            <div class="space-y-2 text-left">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">玩家姓名</label>
                <input id="player-name" type="text" value="一甲國小練習生" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-orange-500 text-white font-medium text-lg">
            </div>

            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-white font-bold rounded-2xl shadow-lg shadow-orange-600/30 transition transform active:scale-95 text-lg cursor-pointer">
                開始遊戲 (Start Game)
            </button>
        </div>
    </div>

    <!-- HUD Overlay -->
    <div id="hud" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between p-6 z-10">
        <!-- Top HUD -->
        <div class="flex justify-between items-start">
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700/60 px-5 py-3 rounded-2xl shadow-lg flex items-center space-x-4">
                <div>
                    <div class="text-xs text-slate-400 font-medium">玩家</div>
                    <div id="hud-name" class="text-lg font-bold text-orange-400">一甲國小練習生</div>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">總得分</div>
                    <div id="hud-score" class="text-2xl font-black text-amber-300">0</div>
                </div>
            </div>

            <div class="bg-slate-900/80 backdrop-blur border border-slate-700/60 px-5 py-3 rounded-2xl shadow-lg flex items-center space-x-6">
                <div>
                    <div class="text-xs text-slate-400 font-medium">剩餘時間</div>
                    <div id="hud-timer" class="text-2xl font-black text-red-400">03:00</div>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">剩餘球數</div>
                    <div id="hud-balls" class="text-2xl font-black text-blue-400">30 / 30</div>
                </div>
            </div>
        </div>

        <!-- Center Aiming Crosshair -->
        <div class="crosshair-container">
            <div class="aim-circle"></div>
            <div class="crosshair-dot"></div>
        </div>

        <!-- Bottom Instructions -->
        <div class="text-center pb-4">
            <div id="hud-instruction" class="inline-block bg-slate-900/80 backdrop-blur border border-slate-700/60 px-6 py-2.5 rounded-full text-sm text-slate-300 shadow-lg">
                💡 瞄準地面球體自動慢跑撿球 | 瞄準籃框按【空白鍵】或【手機向上甩動】輕鬆投籃！
            </div>
        </div>
    </div>

    <!-- Settlement Modal -->
    <div id="settlement-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="inline-flex p-4 bg-amber-500/20 rounded-2xl text-amber-400 mb-2 animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
            </div>
            <h2 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-400">挑戰結算</h2>
            
            <div class="bg-slate-800/80 rounded-2xl p-6 space-y-4 border border-slate-700/50">
                <div>
                    <div class="text-xs text-slate-400 uppercase tracking-wider">玩家姓名</div>
                    <div id="final-name" class="text-xl font-bold text-white mt-1">一甲國小練習生</div>
                </div>
                <div class="h-px bg-slate-700"></div>
                <div>
                    <div class="text-xs text-slate-400 uppercase tracking-wider">最終總得分</div>
                    <div id="final-score" class="text-4xl font-black text-amber-300 mt-1">0 分</div>
                </div>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-white font-bold rounded-2xl shadow-lg shadow-orange-600/30 transition transform active:scale-95 text-lg cursor-pointer">
                重新開始 (Play Again)
            </button>
        </div>
    </div>

    <script>
        // Game State Variables
        let gameStarted = false;
        let gameEnded = false;
        let playerName = "一甲國小練習生";
        let score = 0;
        let ballsRemaining = 30;
        let timeLeft = 180; // 3 minutes countdown
        let timerInterval = null;

        let scene, camera, renderer;
        let groundBalls = []; // 30 scattered basketballs on ground
        let isHolding = false;
        let heldBallMesh = null;
        let flyingBall = null; // currently thrown projectile
        let playerPos = new THREE.Vector3(0, 0, 0); // player position on court

        let cameraRotation = { yaw: 0, pitch: 0 };
        let gyroEnabled = false;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        let hoops = [];
        let backboards = [];

        // Camera mode: 'PLAYER' or 'FOLLOW_BALL'
        let cameraMode = 'PLAYER';

        // Textures
        let basketballTexture, courtTexture;

        // Initialize Procedural Textures
        function initTextures() {
            // Basketball texture with grooves
            const canvasBB = document.createElement('canvas');
            canvasBB.width = 512;
            canvasBB.height = 256;
            const ctxBB = canvasBB.getContext('2d');
            ctxBB.fillStyle = '#d9531e';
            ctxBB.fillRect(0, 0, 512, 256);
            ctxBB.strokeStyle = '#111111';
            ctxBB.lineWidth = 6;
            ctxBB.beginPath();
            ctxBB.moveTo(0, 128);
            ctxBB.lineTo(512, 128);
            ctxBB.stroke();
            ctxBB.beginPath();
            ctxBB.arc(128, 128, 110, -Math.PI/2, Math.PI/2);
            ctxBB.stroke();
            ctxBB.beginPath();
            ctxBB.arc(384, 128, 110, Math.PI/2, -Math.PI/2);
            ctxBB.stroke();
            basketballTexture = new THREE.CanvasTexture(canvasBB);

            // Court texture (10m x 12m deep blue `#030f26`)
            const canvasCourt = document.createElement('canvas');
            canvasCourt.width = 1024;
            canvasCourt.height = 1228;
            const ctxC = canvasCourt.getContext('2d');
            ctxC.fillStyle = '#030f26';
            ctxC.fillRect(0, 0, 1024, 1228);

            ctxC.strokeStyle = '#ffffff';
            ctxC.lineWidth = 8;
            const margin = 60;
            ctxC.strokeRect(margin, margin, 1024 - 2*margin, 1228 - 2*margin);

            // Center line & circle
            ctxC.beginPath();
            ctxC.moveTo(margin, 1228/2);
            ctxC.lineTo(1024 - margin, 1228/2);
            ctxC.stroke();
            ctxC.beginPath();
            ctxC.arc(1024/2, 1228/2, 120, 0, Math.PI * 2);
            ctxC.stroke();

            // Key areas (Paint) at both ends
            ctxC.strokeRect(1024/2 - 180, margin, 360, 300);
            ctxC.beginPath();
            ctxC.arc(1024/2, margin + 300, 120, 0, Math.PI, false);
            ctxC.stroke();

            ctxC.strokeRect(1024/2 - 180, 1228 - margin - 300, 360, 300);
            ctxC.beginPath();
            ctxC.arc(1024/2, 1228 - margin - 300, 120, Math.PI, 0, false);
            ctxC.stroke();

            // 3-point arcs (radius 5m)
            const pxPerMeter = (1024 - 120) / 10;
            const r3pt = 5 * pxPerMeter;
            ctxC.beginPath();
            ctxC.arc(1024/2, margin, r3pt, 0, Math.PI, false);
            ctxC.stroke();
            ctxC.beginPath();
            ctxC.arc(1024/2, 1228 - margin, r3pt, Math.PI, Math.PI * 2, false);
            ctxC.stroke();

            courtTexture = new THREE.CanvasTexture(canvasCourt);
        }

        function initGameScene() {
            initTextures();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(10, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Surrounding Deep Green Grass (50m x 50m)
            const grassGeo = new THREE.PlaneGeometry(50, 50);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e, roughness: 0.9 });
            const grassMesh = new THREE.Mesh(grassGeo, grassMat);
            grassMesh.rotation.x = -Math.PI / 2;
            grassMesh.position.y = -0.02;
            grassMesh.receiveShadow = true;
            scene.add(grassMesh);

            // Basketball Court (10m x 12m)
            const courtGeo = new THREE.PlaneGeometry(10, 12);
            const courtMat = new THREE.MeshStandardMaterial({ map: courtTexture, roughness: 0.65 });
            const courtMesh = new THREE.Mesh(courtGeo, courtMat);
            courtMesh.rotation.x = -Math.PI / 2;
            courtMesh.receiveShadow = true;
            scene.add(courtMesh);

            // Build Basketball Hoops & Backboards (Z = -5.8 and Z = 5.8, height 2.5m)
            createHoop(0, 2.5, -5.8, 0);
            createHoop(0, 2.5, 5.8, Math.PI);

            // Spawn 30 Basketballs Randomly on Court
            spawnGroundBalls();

            // Setup Input Listeners
            setupListeners();

            // Window resize handler
            window.addEventListener('resize', onWindowResize);
        }

        function createHoop(x, y, z, rotationY) {
            const hoopGroup = new THREE.Group();
            hoopGroup.position.set(x, y, z);
            hoopGroup.rotation.y = rotationY;

            // Basketball Pole
            const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.5, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, -1.25, 0.35);
            pole.castShadow = true;
            hoopGroup.add(pole);

            // Backboard (Opaque white with vivid red border and red center ring)
            const bbGeo = new THREE.BoxGeometry(1.8, 1.2, 0.08);
            const bbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const backboard = new THREE.Mesh(bbGeo, bbMat);
            backboard.position.set(0, 0, 0.15);
            backboard.castShadow = true;
            backboard.receiveShadow = true;
            hoopGroup.add(backboard);
            backboards.push(backboard);

            // Red border on backboard
            const borderGeo = new THREE.BoxGeometry(1.85, 1.25, 0.09);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.set(0, 0, 0.15);
            hoopGroup.add(border);

            // Red center target circle on backboard
            const ringShapeGeo = new THREE.RingGeometry(0.15, 0.18, 32);
            const ringShapeMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
            const ringShape = new THREE.Mesh(ringShapeGeo, ringShapeMat);
            ringShape.position.set(0, -0.2, 0.2);
            hoopGroup.add(ringShape);

            // Metal Rim (Orange-red)
            const rimGeo = new THREE.TorusGeometry(0.3, 0.03, 16, 32);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xe65c00, roughness: 0.3 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(0, -0.35, 0.55);
            rim.castShadow = true;
            hoopGroup.add(rim);

            // White Net
            const netGeo = new THREE.ConeGeometry(0.3, 0.5, 16, 8, true);
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.6 });
            const net = new THREE.Mesh(netGeo, netMat);
            net.position.set(0, -0.65, 0.55);
            hoopGroup.add(net);

            // Halo light for magnetic attraction guidance indication
            const haloLight = new THREE.PointLight(0xf59e0b, 2.0, 5);
            haloLight.position.set(0, 0, 0.5);
            hoopGroup.add(haloLight);

            scene.add(hoopGroup);
            hoops.push({
                group: hoopGroup,
                rimPosition: new THREE.Vector3(x, y - 0.35, z + (rotationY === 0 ? 0.55 : -0.55)),
                halo: haloLight
            });
        }

        function spawnGroundBalls() {
            const ballGeo = new THREE.SphereGeometry(0.18, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ map: basketballTexture, roughness: 0.6 });

            for (let i = 0; i < 30; i++) {
                const ballMesh = new THREE.Mesh(ballGeo, ballMat);
                // Random position inside court: X from -4.5 to 4.5, Z from -5.5 to 5.5
                const rx = (Math.random() - 0.5) * 9;
                const rz = (Math.random() - 0.5) * 11;
                ballMesh.position.set(rx, 0.18, rz);
                ballMesh.castShadow = true;
                scene.add(ballMesh);
                groundBalls.push(ballMesh);
            }
        }

        function setupListeners() {
            // PC Mouse Drag Control
            window.addEventListener('mousedown', (e) => {
                if (gameEnded || !gameStarted || cameraMode !== 'PLAYER') return;
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging || gameEnded || !gameStarted || cameraMode !== 'PLAYER') return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                // Left-right mirror correction: rightward movement moves view right naturally
                cameraRotation.yaw -= deltaX * 0.004;
                cameraRotation.pitch -= deltaY * 0.004;
                cameraRotation.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraRotation.pitch));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Keyboard Spacebar to shoot on PC
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && gameStarted && !gameEnded && isHolding && cameraMode === 'PLAYER') {
                    e.preventDefault();
                    triggerShoot();
                }
            });

            // Mobile Tap to shoot if holding ball
            window.addEventListener('click', () => {
                if (gameStarted && !gameEnded && isHolding && cameraMode === 'PLAYER' && gyroEnabled) {
                    triggerShoot();
                }
            });
        }

        let initialAlpha = null;
        function handleOrientation(event) {
            if (!gyroEnabled || gameEnded || !gameStarted || cameraMode !== 'PLAYER') return;
            if (initialAlpha === null && event.alpha !== null) {
                initialAlpha = event.alpha;
            }
            let alpha = event.alpha - (initialAlpha || 0);
            let beta = event.beta || 0;

            // Map device orientation with left-right mirror correction
            cameraRotation.yaw = -THREE.MathUtils.degToRad(alpha);
            cameraRotation.pitch = THREE.MathUtils.degToRad(beta - 90);
            cameraRotation.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraRotation.pitch));
        }

        function handleMotion(event) {
            if (!gyroEnabled || gameEnded || !gameStarted || !isHolding || cameraMode !== 'PLAYER') return;
            // Quick upward tilt / flick detection
            if (event.rotationRate && Math.abs(event.rotationRate.beta) > 260) {
                triggerShoot();
            }
        }

        function triggerShoot() {
            if (!isHolding) return;
            isHolding = false;
            if (heldBallMesh) {
                scene.remove(heldBallMesh);
                heldBallMesh = null;
            }

            // Determine active hoop (closest hoop)
            let activeHoop = hoops[0];
            let minDist = camera.position.distanceTo(hoops[0].rimPosition);
            for (let i = 1; i < hoops.length; i++) {
                const d = camera.position.distanceTo(hoops[i].rimPosition);
                if (d < minDist) {
                    minDist = d;
                    activeHoop = hoops[i];
                }
            }

            // Scoring determination: > 5m = 3 points, <= 5m = 2 points
            const shootDistance = camera.position.distanceTo(activeHoop.rimPosition);
            const pointsValue = shootDistance > 5.0 ? 3 : 2;

            // Spawn flying projectile ball
            const ballGeo = new THREE.SphereGeometry(0.18, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ map: basketballTexture, roughness: 0.6 });
            flyingBall = {
                mesh: new THREE.Mesh(ballGeo, ballMat),
                velocity: new THREE.Vector3(),
                points: pointsValue,
                targetHoop: activeHoop,
                hasScored: false
            };
            flyingBall.mesh.position.copy(camera.position);
            flyingBall.mesh.castShadow = true;
            scene.add(flyingBall.mesh);

            // Initial velocity vector from camera direction + upward boost
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            flyingBall.velocity.copy(dir).multiplyScalar(13.5).add(new THREE.Vector3(0, 4.8, 0));

            // Switch camera to direct follow mode
            cameraMode = 'FOLLOW_BALL';
        }

        // Start Button Click Event
        document.getElementById('start-btn').addEventListener('click', async () => {
            playerName = document.getElementById('player-name').value.trim() || "一甲國小練習生";
            document.getElementById('hud-name').innerText = playerName;
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            // Request Gyroscope permissions on iOS / mobile devices
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        window.addEventListener('devicemotion', handleMotion);
                        gyroEnabled = true;
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                gyroEnabled = true;
            }

            gameStarted = true;
            startTimer();
        });

        function startTimer() {
            timerInterval = setInterval(() => {
                if (gameEnded) return;
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('hud-timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeLeft <= 0 || ballsRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameEnded = true;
            clearInterval(timerInterval);
            document.getElementById('final-name').innerText = playerName;
            document.getElementById('final-score').innerText = `${score} 分`;
            document.getElementById('settlement-modal').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        }

        document.getElementById('restart-btn').addEventListener('click', () => {
            location.reload();
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if (gameStarted && !gameEnded) {
                // Update hoops halo lighting intensity based on player proximity
                hoops.forEach((h, idx) => {
                    if (idx === 0 && camera.position.z < 0 || idx === 1 && camera.position.z >= 0) {
                        h.halo.intensity = 3.5;
                    } else {
                        h.halo.intensity = 0.6;
                    }
                });

                if (cameraMode === 'PLAYER') {
                    // Apply camera rotation
                    const euler = new THREE.Euler(cameraRotation.pitch, cameraRotation.yaw, 0, 'YXZ');
                    camera.quaternion.setFromEuler(euler);

                    // Auto-retrieval / approaching logic when not holding a ball
                    if (!isHolding && groundBalls.length > 0) {
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);

                        let closestBall = null;
                        let minAngle = 0.35;

                        groundBalls.forEach(ball => {
                            const dirToBall = new THREE.Vector3().subVectors(ball.position, camera.position).normalize();
                            const angle = camDir.angleTo(dirToBall);
                            if (angle < minAngle) {
                                minAngle = angle;
                                closestBall = ball;
                            }
                        });

                        if (closestBall) {
                            // Jog towards the ball
                            const moveDir = new THREE.Vector3().subVectors(closestBall.position, camera.position);
                            moveDir.y = 0;
                            moveDir.normalize();
                            playerPos.add(moveDir.multiplyScalar(3.5 * dt));
                            camera.position.x = playerPos.x;
                            camera.position.z = playerPos.z;

                            // Check collection distance
                            if (camera.position.distanceTo(closestBall.position) < 1.0) {
                                scene.remove(closestBall);
                                groundBalls = groundBalls.filter(b => b !== closestBall);
                                isHolding = true;

                                // Create held ball mesh (50% translucent, rotating)
                                const ballGeo = new THREE.SphereGeometry(0.18, 32, 32);
                                const ballMat = new THREE.MeshStandardMaterial({ map: basketballTexture, transparent: true, opacity: 0.5, roughness: 0.6 });
                                heldBallMesh = new THREE.Mesh(ballGeo, ballMat);
                                scene.add(heldBallMesh);
                            }
                        }
                    }

                    // Update held ball position & rotation
                    if (isHolding && heldBallMesh) {
                        const forward = new THREE.Vector3();
                        camera.getWorldDirection(forward);
                        const heldPos = camera.position.clone().add(forward.multiplyScalar(1.0)).add(new THREE.Vector3(0, -0.3, 0));
                        heldBallMesh.position.copy(heldPos);
                        heldBallMesh.rotation.y += dt * 2.5;
                    }

                } else if (cameraMode === 'FOLLOW_BALL' && flyingBall) {
                    // Parabolic physics update
                    flyingBall.velocity.y -= 9.8 * dt;
                    flyingBall.mesh.position.addScaledVector(flyingBall.velocity, dt);

                    // Magnetic Goal Guidance towards active hoop rim center
                    const rimPos = flyingBall.targetHoop.rimPosition;
                    const distToRim = flyingBall.mesh.position.distanceTo(rimPos);
                    if (distToRim < 6.0) {
                        const steerDir = new THREE.Vector3().subVectors(rimPos, flyingBall.mesh.position).normalize();
                        flyingBall.velocity.add(steerDir.multiplyScalar(24 * dt));
                    }

                    // Smooth camera follow mode
                    const ballPos = flyingBall.mesh.position;
                    const camTargetPos = ballPos.clone().add(new THREE.Vector3(0, 1.2, -2.6));
                    camera.position.lerp(camTargetPos, 0.12);
                    camera.lookAt(ballPos);

                    // Scoring check
                    if (!flyingBall.hasScored && distToRim < 0.48 && flyingBall.velocity.y < 0) {
                        flyingBall.hasScored = true;
                        score += flyingBall.points;
                        document.getElementById('hud-score').innerText = score;

                        // Flash backboard golden yellow on score
                        flyingBall.targetHoop.group.children.forEach(child => {
                            if (child.material && child.geometry.type === 'BoxGeometry' && child.geometry.parameters.width === 1.8) {
                                child.material.color.setHex(0xf59e0b);
                                setTimeout(() => { child.material.color.setHex(0xffffff); }, 450);
                            }
                        });
                    }

                    // Ground landing or out of bounds check
                    if (flyingBall.mesh.position.y <= 0.18 || flyingBall.mesh.position.length() > 25) {
                        scene.remove(flyingBall.mesh);
                        flyingBall = null;
                        ballsRemaining--;
                        document.getElementById('hud-balls').innerText = `${ballsRemaining} / 30`;

                        if (ballsRemaining <= 0) {
                            endGame();
                        } else {
                            // Return camera smoothly back to player
                            cameraMode = 'PLAYER';
                            camera.position.set(playerPos.x, 1.6, playerPos.z);
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Initialize scene on window load
        window.onload = function() {
            initGameScene();
            animate();
        };
    </script>
</body>
</html>
