<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iPad 平板投籃遊戲</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.pill{background:#07111edb;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:14px;backdrop-filter:blur(6px)}
#aim{position:fixed;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%);border:2px solid #ff3838;border-radius:50%;box-shadow:0 0 10px #f22a, inset 0 0 8px #f22a;pointer-events:none}
#aim:before,#aim:after{content:"";position:absolute;background:#ff3838aa}#aim:before{height:1px;left:0;right:0;top:50%}#aim:after{width:1px;top:0;bottom:0;left:50%}
#help{position:fixed;bottom:calc(env(safe-area-inset-bottom,8px) + 10px);left:50%;transform:translateX(-50%);width:min(94%,650px);text-align:center;background:#06101bd9;border:1px solid #ffffff25;border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.5;pointer-events:none}
#start,#result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;padding:20px;z-index:5}
.panel{width:min(92vw,420px);background:#101b2b;border:1px solid #ffffff30;border-radius:20px;padding:24px;box-shadow:0 20px 80px #0009;text-align:center}
.panel h1{font-size:24px;margin:0 0 8px}.panel p{color:#d4dfec;font-size:14px;line-height:1.6}
input{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid #ffffff45;background:#050b13;color:white;margin:8px 0 14px}
button{font:inherit;font-weight:700;border:0;border-radius:11px;background:#ff7a1a;color:#111;padding:12px 16px;cursor:pointer;width:100%;touch-action:manipulation}
button.secondary{margin-top:8px;background:#24354a;color:white}
#shoot{position:fixed;right:18px;bottom:100px;width:92px;height:92px;border-radius:50%;background:#ff7a1aee;border:4px solid #fff9;box-shadow:0 0 22px #ff7a1a66;font-size:16px;font-weight:900;display:none;z-index:3}
#result{display:none;z-index:8}.bigscore{font-size:48px;font-weight:900;color:#ffc45e;margin:8px}
#notice{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:#07111edd;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
@media (orientation:portrait){#aim{width:66px;height:66px}#help{font-size:12px}#shoot{width:82px;height:82px;bottom:112px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill" id="player">🏀 一甲國小練習生</div><div class="pill">得分 <b id="score">0</b>　球數 <b id="balls">30</b>　時間 <b id="time">3:00</b></div></div>
<div id="aim"></div>
<div id="notice"></div>
<div id="help">移動裝置：按「啟用陀螺儀」並轉動 iPad 瞄準。對準籃球後會自動靠近拾球；找到籃框後抬高視角投籃。<br>電腦：滑鼠移動轉視角，點擊或按空白鍵投籃；WASD 移動。也可使用右下方投籃鈕。</div>
<button id="shoot">投籃</button>
<div id="start"><div class="panel"><h1>🏀 iPad 平板投籃遊戲</h1><p>3 分鐘、最多 30 球。請輸入姓名後開始。iPad 請允許動作感測權限；若未支援，仍可用觸控操作。</p><input id="name" value="一甲國小練習生" maxlength="24" aria-label="學生姓名"><button id="begin">開始遊戲／啟用陀螺儀</button><button class="secondary" id="keyboard">鍵盤／滑鼠模式</button><p style="font-size:12px">建議以 Safari 開啟並使用 HTTPS 網址，陀螺儀權限才較容易正常運作。</p></div></div>
<div id="result"><div class="panel"><h1>遊戲結束</h1><p id="resultname"></p><div class="bigscore" id="finalscore">0 分</div><p id="resultdetail"></p><button id="again">再玩一次</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000); scene.fog=new THREE.Fog(0x000000,35,90);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8d8ff,0x18321b,2.0));
const keyLight=new THREE.DirectionalLight(0xffffff,2.4);keyLight.position.set(-5,15,7);keyLight.castShadow=true;scene.add(keyLight);
const fill=new THREE.PointLight(0x8dbbff,35,45);fill.position.set(0,8,0);scene.add(fill);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grassMat=mat(0x073a20), courtMat=mat(0x082e5a), lineMat=mat(0xffffff), poleMat=mat(0x9ca8b6,.35,.65), rimMat=mat(0xff392f,.3,.25), boardMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35,metalness:.05,emissive:0x111111}), ballMat=new THREE.MeshStandardMaterial({color:0xd96518,roughness:.84});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const court=new THREE.Mesh(new THREE.PlaneGeometry(10,12),courtMat);court.rotation.x=-Math.PI/2;court.position.y=0;court.receiveShadow=true;scene.add(court);
function line(points,color=0xffffff,r=.025){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(20,points.length*4),r,6,false),mat(color,.8));mesh.position.y=.025;scene.add(mesh);return mesh}
function seg(a,b,r=.025){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);const m=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff}));scene.add(m);return m}
// court boundary
seg([-5,.03,-6],[5,.03,-6]);seg([5,.03,-6],[5,.03,6]);seg([5,.03,6],[-5,.03,6]);seg([-5,.03,6],[-5,.03,-6]);
// Center line and circle
seg([-5,.03,0],[5,.03,0]);line(Array.from({length:65},(_,i)=>[1.5*Math.cos(i/64*Math.PI*2),.03,1.5*Math.sin(i/64*Math.PI*2)]),0xffffff,.022);
// Hoop ends: boards on short ends, face toward court
const hoops=[];
function makeHoop(z,dir){
 const group=new THREE.Group();group.position.set(0,0,z);scene.add(group);
 // support pole behind board
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.075,.11,3.25,12),poleMat);pole.position.set(0,1.62,dir*.95);pole.castShadow=true;group.add(pole);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(.11,.11,1.2),poleMat);arm.position.set(0,3.0,dir*.42);group.add(arm);
 const board=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.05,.09),boardMat);board.position.set(0,3.15,0);board.castShadow=true;group.add(board);
 // red outer board border as tubes
 function boardRect(w,h,zoff){const pts=[[-w/2,-h/2,zoff],[w/2,-h/2,zoff],[w/2,h/2,zoff],[-w/2,h/2,zoff],[-w/2,-h/2,zoff]].map(([x,y,z])=>[x,y+3.15,z]);const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),40,.025,6,false);const mesh=new THREE.Mesh(geo,rimMat);group.add(mesh)}
 boardRect(1.76,1.01,-.052);
 // target rectangle on backboard
 const targetPts=[[-.3,2.95,0],[.3,2.95,0],[.3,3.38,0],[-.3,3.38,0],[-.3,2.95,0]].map(p=>[p[0],p[1],p[2]]);
 const targetGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(targetPts.map(p=>new THREE.Vector3(...p))),30,.018,6,false);const target=new THREE.Mesh(targetGeo,rimMat);group.add(target);
 // rim horizontal ring, toward court from board
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.23,.025,10,36),rimMat);ring.rotation.x=Math.PI/2;ring.position.set(0,2.75,-dir*.28);ring.castShadow=true;group.add(ring);
 // rim back braces
 const brace=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.5,8),poleMat);brace.rotation.x=Math.PI/2;brace.position.set(0,2.95,-dir*.17);group.add(brace);
 // net approximated with fine white hanging cords
 for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const b=new THREE.Vector3(.2*Math.cos(a),2.48,-dir*.28+.2*Math.sin(a));const top=new THREE.Vector3(.23*Math.cos(a),2.75,-dir*.28+.23*Math.sin(a));const cord=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,b.distanceTo(top),5),mat(0xe9edf4));cord.position.copy(b).add(top).multiplyScalar(.5);cord.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),top.clone().sub(b).normalize());group.add(cord)}
 hoops.push({group,z,dir,board,ring});
 // court paint key/paint area near hoop, 4.0m wide, 2.5m deep
 const near=z-dir*1.25, far=z-dir*4.1;
 seg([-2,.035,near],[2,.035,near]);seg([-2,.035,near],[-2,.035,far]);seg([2,.035,near],[2,.035,far]);
 line(Array.from({length:33},(_,i)=>[2*Math.cos(Math.PI*i/32),.04,far+dir*.0+1.0*Math.sin(Math.PI*i/32)]));
 // free throw semicircle
 line(Array.from({length:41},(_,i)=>[1.8*Math.cos(Math.PI*i/40),.04,far-dir*.0+1.8*Math.sin(Math.PI*i/40)]));
 // 5m 3-point arc, clipped visually by end line
 line(Array.from({length:101},(_,i)=>[5*Math.cos(Math.PI*i/100),.04,z-dir*1.0+5*Math.sin(Math.PI*i/100)]));
}
makeHoop(-6,1);makeHoop(6,-1);

// Ball texture canvas for pebbled basketball appearance
function makeBallMaterial(){
 const c=document.createElement('canvas');c.width=512;c.height=512;const ctx=c.getContext('2d');
 ctx.fillStyle='#d86a1e';ctx.fillRect(0,0,512,512);
 for(let i=0;i<8500;i++){const x=Math.random()*512,y=Math.random()*512;ctx.fillStyle=Math.random()>.5?'rgba(45,20,8,.15)':'rgba(255,190,90,.12)';ctx.beginPath();ctx.arc(x,y,Math.random()*1.5+.3,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle='#21160f';ctx.lineWidth=11;
 ctx.beginPath();ctx.moveTo(0,256);ctx.bezierCurveTo(130,190,380,320,512,256);ctx.stroke();
 ctx.beginPath();ctx.moveTo(256,0);ctx.bezierCurveTo(190,130,320,380,256,512);ctx.stroke();
 ctx.beginPath();ctx.ellipse(256,256,125,256,0,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.ellipse(256,256,256,125,0,0,Math.PI*2);ctx.stroke();
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
 return new THREE.MeshStandardMaterial({map:tex,roughness:.8});
}
const basketballMat=makeBallMaterial();
const ballGeo=new THREE.SphereGeometry(.12,24,18);
const balls=[];let held=null;
function rand(a,b){return a+Math.random()*(b-a)}
function spawnBalls(){for(const b of balls)scene.remove(b.mesh);balls.length=0;for(let i=0;i<30;i++){const z=rand(-5.4,5.4),x=rand(-4.4,4.4);const mesh=new THREE.Mesh(ballGeo,basketballMat);mesh.position.set(x,.13,z);mesh.castShadow=true;scene.add(mesh);balls.push({mesh,active:true})}}
spawnBalls();

// Player eye camera, movement and aiming
const player={x:0,z:4.8,yaw:Math.PI,pitch:0};
let mode='gyro', running=false, ended=false, score=0, remaining=30, timeLeft=180, last=performance.now(), lastShot=0, projectile=null, tracking=false;
let deviceReady=false, pointerLocked=false, mouseDown=false, keys={};
const scoreEl=document.getElementById('score'),ballsEl=document.getElementById('balls'),timeEl=document.getElementById('time'),notice=document.getElementById('notice');
function say(s){notice.textContent=s;notice.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>notice.style.opacity=0,1400)}
function updateHUD(){scoreEl.textContent=score;ballsEl.textContent=remaining;timeEl.textContent=`${Math.floor(timeLeft/60)}:${String(Math.max(0,Math.ceil(timeLeft%60))).padStart(2,'0')}`}
function endGame(){if(ended)return;ended=true;running=false;document.getElementById('resultname').textContent=document.getElementById('name').value||'一甲國小練習生';document.getElementById('finalscore').textContent=score+' 分';document.getElementById('resultdetail').textContent=`使用球數：${30-remaining}／30　剩餘時間：${Math.max(0,Math.ceil(timeLeft))} 秒`;document.getElementById('result').style.display='flex';document.getElementById('shoot').style.display='none'}
function reset(){score=0;remaining=30;timeLeft=180;ended=false;running=true;player.x=0;player.z=4.8;player.yaw=Math.PI;player.pitch=0;held=null;projectile=null;tracking=false;spawnBalls();updateHUD();document.getElementById('player').textContent='🏀 '+(document.getElementById('name').value||'一甲國小練習生');document.getElementById('start').style.display='none';document.getElementById('result').style.display='none';document.getElementById('shoot').style.display='block';last=performance.now()}
async function enableGyro(){
 mode='gyro';
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const res=await DeviceOrientationEvent.requestPermission();if(res!=='granted')throw new Error('permission')}
  window.addEventListener('deviceorientation',onOrientation,true);deviceReady=true;say('陀螺儀已啟用');
 }catch(e){mode='mouse';say('未取得陀螺儀權限，改用滑鼠／觸控');}
 reset();
}
function onOrientation(e){
 if(!running||mode!=='gyro'||e.alpha==null)return;
 // Relative deltas: map device yaw/pitch to intuitive full-range camera controls.
 if(onOrientation.prev==null){onOrientation.prev={a:e.alpha,b:e.beta,g:e.gamma};return}
 const p=onOrientation.prev;let da=e.alpha-p.a; if(da>180)da-=360;if(da< -180)da+=360;
 let db=e.beta-p.b; if(db>180)db-=360;if(db< -180)db+=360;
 player.yaw-=da*Math.PI/180;player.pitch=THREE.MathUtils.clamp(player.pitch-db*Math.PI/180,-1.25,1.25);
 onOrientation.prev={a:e.alpha,b:e.beta,g:e.gamma};
}
document.getElementById('begin').addEventListener('click',enableGyro);
document.getElementById('keyboard').addEventListener('click',()=>{mode='mouse';reset();say('滑鼠／鍵盤模式')});
document.getElementById('again').addEventListener('click',()=>{document.getElementById('start').style.display='flex';document.getElementById('result').style.display='none'});
document.getElementById('shoot').addEventListener('click',shoot);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();shoot()}});
window.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(mode==='mouse'&&running&&!pointerLocked){renderer.domElement.requestPointerLock?.()}});
document.addEventListener('pointerlockchange',()=>pointerLocked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(mode==='mouse'&&running&&pointerLocked){player.yaw-=e.movementX*.0025;player.pitch=THREE.MathUtils.clamp(player.pitch-e.movementY*.0025,-1.4,1.4)}});
renderer.domElement.addEventListener('touchstart',e=>{if(mode==='mouse'&&running){mouseDown=true;lastTouchX=e.touches[0].clientX;lastTouchY=e.touches[0].clientY}},{passive:true});
let lastTouchX=0,lastTouchY=0;
renderer.domElement.addEventListener('touchmove',e=>{if(mode==='mouse'&&running&&e.touches.length){const t=e.touches[0];player.yaw-=(t.clientX-lastTouchX)*.006;player.pitch=THREE.MathUtils.clamp(player.pitch-(t.clientY-lastTouchY)*.006,-1.4,1.4);lastTouchX=t.clientX;lastTouchY=t.clientY}},{passive:true});
renderer.domElement.addEventListener('touchend',()=>mouseDown=false);
function forward(){return new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),-Math.cos(player.yaw)*Math.cos(player.pitch)).normalize()}
function shoot(){
 if(!running||projectile||!held||performance.now()-lastShot<600)return;
 lastShot=performance.now();const dir=forward();const start=new THREE.Vector3(camera.position.x,camera.position.y-.12,camera.position.z).add(dir.clone().multiplyScalar(.35));
 const mesh=held.mesh;mesh.material=basketballMat;mesh.scale.setScalar(1);mesh.position.copy(start);held.active=false;held=null;
 projectile={mesh,vel:dir.multiplyScalar(10.8).add(new THREE.Vector3(0,3.2,0)),life:0,scored:false};tracking=true;remaining--;updateHUD();say('投出！');
}
function hoopScore(pos){for(const h of hoops){const rimWorld=new THREE.Vector3(0,2.75,h.z-h.dir*.28);if(pos.distanceTo(rimWorld)<.31&&projectile&&projectile.vel.y<0&&!projectile.scored){projectile.scored=true;score++;updateHUD();h.board.material.emissive.setHex(0xffc400);h.board.material.emissiveIntensity=2;setTimeout(()=>{h.board.material.emissive.setHex(0x111111);h.board.material.emissiveIntensity=1},350);say('進球！+1');return true}}return false}
function movePlayer(dt){
 if(mode!=='mouse'||!running||projectile)return;
 const f=forward(),right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
 let dx=0,dz=0;if(keys.KeyW||keys.ArrowUp){dx+=f.x;dz+=f.z}if(keys.KeyS||keys.ArrowDown){dx-=f.x;dz-=f.z}if(keys.KeyA||keys.ArrowLeft){dx-=right.x;dz-=right.z}if(keys.KeyD||keys.ArrowRight){dx+=right.x;dz+=right.z}
 player.x=THREE.MathUtils.clamp(player.x+dx*3*dt,-4.65,4.65);player.z=THREE.MathUtils.clamp(player.z+dz*3*dt,-5.65,5.65);
}
function update(dt){
 if(!running)return;
 timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHUD();endGame();return}updateHUD();
 movePlayer(dt);
 const dir=forward();
 // automatic approach to nearest ball that is within reticle cone
 if(!projectile&&!held){
  let best=null,bestDot=.965;
  const eye=new THREE.Vector3(player.x,1.65,player.z);
  for(const b of balls){if(!b.active)continue;const to=b.mesh.position.clone().sub(eye);const d=to.length();const dot=dir.dot(to.normalize());if(dot>bestDot&&d<9){bestDot=dot;best=b}}
  if(best){const target=best.mesh.position.clone();target.y=1.25;const move=target.sub(eye);move.y=0;const d=move.length();if(d>.5){player.x+=move.x/d*Math.min(1.6*dt,d-.45);player.z+=move.z/d*Math.min(1.6*dt,d-.45)}else{held=best;held.mesh.material=basketballMat.clone();held.mesh.material.transparent=true;held.mesh.material.opacity=.5;held.mesh.position.set(0,0,0);say('拾球完成，瞄準籃框投出')}}
 }
 if(held){held.mesh.position.copy(camera.position).add(dir.clone().multiplyScalar(1.25));held.mesh.position.y-=.22;held.mesh.rotation.x+=dt*1.5;held.mesh.rotation.y+=dt*2.2;}
 if(projectile){
  const p=projectile;p.life+=dt;p.vel.y-=9.8*dt;p.mesh.position.addScaledVector(p.vel,dt);p.mesh.rotation.x+=dt*8;p.mesh.rotation.z+=dt*5;
  hoopScore(p.mesh.position);
  // Follow behind ball, level horizon
  const follow= p.mesh.position.clone().add(new THREE.Vector3(-p.vel.x*.16,1.0,-p.vel.z*.16));camera.position.lerp(follow,.15);camera.lookAt(p.mesh.position.clone().add(new THREE.Vector3(0,.2,0)));
  if(p.mesh.position.y<=.12||p.life>4.5){scene.remove(p.mesh);projectile=null;tracking=false;if(remaining<=0||timeLeft<=0){endGame()}else{player.x=THREE.MathUtils.clamp(p.mesh.position.x,-4.5,4.5);player.z=THREE.MathUtils.clamp(p.mesh.position.z,-5.5,5.5);say('準備撿下一球')}}
 }
 // camera is player POV except while ball is followed
 if(!tracking){camera.position.set(player.x,1.65,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;camera.rotation.z=0}
 // keep held ball visible in camera space (mesh position is world-space)
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(running)update(dt);else if(!tracking){camera.position.set(player.x,1.65,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}renderer.render(scene,camera)}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body></html>
