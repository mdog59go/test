<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 籃球投籃特訓營</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden; touch-action: none; }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border: 3px solid rgba(239, 68, 68, 0.85);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: transform 0.1s ease;
        }
        .crosshair::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: rgba(239, 68, 68, 0.95);
            border-radius: 50%;
        }
    </style>
</head>
<body class="relative w-screen h-screen select-none overflow-hidden bg-black">

    <!-- 三維畫布容器 -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

    <!-- 畫面中央瞄準紅圈 UI -->
    <div id="crosshair" class="crosshair hidden"></div>

    <!-- 頂部即時計分與資訊 UI -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none hidden z-10">
        <div class="bg-black/60 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg">
            <span class="text-xs text-slate-400 block">玩家</span>
            <span id="hud-name" class="font-bold text-lg text-amber-400">一甲國小練習生</span>
        </div>
        <div class="flex gap-3">
            <div class="bg-black/60 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                <span class="text-xs text-slate-400 block">總得分</span>
                <span id="hud-score" class="font-bold text-xl text-emerald-400">0</span>
            </div>
            <div class="bg-black/60 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                剩餘球數: <span id="hud-balls" class="font-bold text-cyan-400">30</span>/30
            </div>
            <div class="bg-black/60 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                時間: <span id="hud-time" class="font-bold text-rose-400">03:00</span>
            </div>
        </div>
    </div>

    <!-- 提示訊息橫幅 -->
    <div id="message-banner" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-900/80 backdrop-blur-md text-white px-6 py-3 rounded-full border border-white/20 text-sm shadow-xl hidden z-10 transition-opacity duration-300">
        尋找地面上的籃球，將紅圈對準即可自動靠近撿球！
    </div>

    <!-- 1. 開場姓名輸入 Modal -->
    <div id="name-modal" class="absolute inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <h1 class="text-3xl font-bold text-white tracking-wide">🏀 3D 籃球投籃特訓營</h1>
                <p class="text-slate-400 text-sm">請輸入您的姓名以開始挑戰</p>
            </div>
            <div>
                <input type="text" id="player-name-input" value="一甲國小練習生" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-amber-500 text-center text-lg font-semibold" placeholder="輸入姓名...">
            </div>
            <button id="start-name-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                確認進入遊戲
            </button>
        </div>
    </div>

    <!-- 2. 行動裝置感測器授權 Modal / 按鈕 -->
    <div id="permission-modal" class="absolute inset-0 bg-black/90 flex items-center justify-center z-40 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <div class="text-5xl mb-2">📱</div>
                <h2 class="text-2xl font-bold text-white">啟用陀螺儀控制</h2>
                <p class="text-slate-400 text-sm">行動裝置需要您的授權以啟用 360 度視角與甩動投籃功能。</p>
            </div>
            <button id="request-perm-btn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                開始遊戲與授權
            </button>
        </div>
    </div>

    <!-- 3. 遊戲結算畫面 Modal -->
    <div id="gameover-modal" class="absolute inset-0 bg-black/90 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <div class="text-5xl mb-2">🏆</div>
                <h2 class="text-3xl font-bold text-white">訓練結算報告</h2>
                <p class="text-slate-400 text-sm">表現優異！以下是您的訓練成果</p>
            </div>
            <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/50 space-y-3">
                <div class="flex justify-between text-slate-300">
                    <span>練習生姓名:</span>
                    <span id="final-name" class="font-bold text-amber-400">--</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>最終總得分:</span>
                    <span id="final-score" class="font-bold text-2xl text-emerald-400">0</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>投進球數:</span>
                    <span id="final-balls-scored" class="font-bold text-cyan-400">0 / 30</span>
                </div>
            </div>
            <button id="restart-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                重新開始訓練
            </button>
        </div>
    </div>

    <script>
        // --- 遊戲全域變數 ---
        let scene, camera, renderer;
        let playerName = "一甲國小練習生";
        let score = 0;
        let ballsRemaining = 30;
        let ballsScoredCount = 0;
        let timeLeft = 180; // 3分鐘
        let gameActive = false;
        let timerInterval = null;

        // 控制狀態
        let isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let controlsMode = isMobile ? 'gyro' : 'mouse';
        let isHoldingBall = false;
        let heldBallMesh = null;
        let ballsOnCourt = [];
        let flyingBall = null; // 當前投出的球物件

        // 視角控制變數 (滑鼠/觸控)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let gyroQuaternion = new THREE.Quaternion();
        let screenOrientation = 0;

        // 自動靠近與撿球變數
        let targetApproachBall = null;
        let isApproaching = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initUIEvents();
        });

        function initUIEvents() {
            const startNameBtn = document.getElementById('start-name-btn');
            const nameModal = document.getElementById('name-modal');
            const permissionModal = document.getElementById('permission-modal');
            const requestPermBtn = document.getElementById('request-perm-btn');
            const restartBtn = document.getElementById('restart-btn');
            const gameOverModal = document.getElementById('gameover-modal');

            startNameBtn.addEventListener('click', () => {
                const inputVal = document.getElementById('player-name-input').value.trim();
                if (inputVal) playerName = inputVal;
                document.getElementById('hud-name').textContent = playerName;
                nameModal.classList.add('hidden');

                if (isMobile) {
                    permissionModal.classList.remove('hidden');
                } else {
                    startGameSession();
                }
            });

            requestPermBtn.addEventListener('click', async () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const responseOrientation = await DeviceOrientationEvent.requestPermission();
                        const responseMotion = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'
                            ? await DeviceMotionEvent.requestPermission()
                            : 'granted';
                        
                        if (responseOrientation === 'granted' || responseMotion === 'granted') {
                            permissionModal.classList.add('hidden');
                            startGameSession();
                        } else {
                            alert('需要感測器權限才能進行陀螺儀遊戲！');
                            permissionModal.classList.add('hidden');
                            startGameSession();
                        }
                    } catch (e) {
                        console.error(e);
                        permissionModal.classList.add('hidden');
                        startGameSession();
                    }
                } else {
                    permissionModal.classList.add('hidden');
                    startGameSession();
                }
            });

            restartBtn.addEventListener('click', () => {
                gameOverModal.classList.add('hidden');
                resetGame();
            });
        }

        function startGameSession() {
            gameActive = true;
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            document.getElementById('message-banner').classList.remove('hidden');

            initThreeJS();
            initControls();
            startTimer();
            animate();
        }

        function startTimer() {
            timeLeft = 180;
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0 || ballsRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('hud-time').textContent = `${mins}:${secs}`;
        }

        function updateHUD() {
            document.getElementById('hud-score').textContent = score;
            document.getElementById('hud-balls').textContent = ballsRemaining;
        }

        // --- Three.js 3D 場景建構 ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5); // 初始視角位置 (站在半場中央偏後)

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 燈光設定
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
            dirLight.position.set(0, 15, 0);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5, 30);
            pointLight.position.set(0, 8, 0);
            scene.add(pointLight);

            createEnvironment();
            createHoops();
            spawnBalls();

            window.addEventListener('resize', onWindowResize);
        }

        // 建立球場與背景環境
        function createEnvironment() {
            // 1. 深綠色草地外圍 (40m x 40m)
            const grassGeo = new THREE.PlaneGeometry(40, 40);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x13381a, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.receiveShadow = true;
            scene.add(grass);

            // 2. 矩形球場 10m x 12m，極深藍色 `#030f26`
            const courtWidth = 10;
            const courtLength = 12;
            
            // 透過 Canvas 繪製專業球場線條紋理
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1228;
            const ctx = canvas.getContext('2d');

            // 底色: 極深藍 `#030f26`
            ctx.fillStyle = '#030f26';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 白色邊線與標線
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 10;

            // 邊線
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

            // 中場線
            ctx.beginPath();
            ctx.moveTo(50, canvas.height / 2);
            ctx.lineTo(canvas.width - 50, canvas.height / 2);
            ctx.stroke();

            // 中場圓圈
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 120, 0, Math.PI * 2);
            ctx.stroke();

            // 禁區與罰球區 (上下兩端)
            // 上端禁區
            ctx.strokeRect(canvas.width / 2 - 180, 50, 360, 300);
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 350, 180, 0, Math.PI, false);
            ctx.stroke();

            // 下端禁區
            ctx.strokeRect(canvas.width / 2 - 180, canvas.height - 350, 360, 300);
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 350, 180, Math.PI, Math.PI * 2, false);
            ctx.stroke();

            // 三分線 (半徑 5 公尺，以籃框為圓心轉換像素，假設球場長度12m對應1228px，5m約對應511px)
            const threePtRadius = 510;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 50, threePtRadius, 0.15 * Math.PI, 0.85 * Math.PI, false);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 50, threePtRadius, 1.15 * Math.PI, 1.85 * Math.PI, false);
            ctx.stroke();

            const courtTexture = new THREE.CanvasTexture(canvas);
            const courtGeo = new THREE.PlaneGeometry(courtWidth, courtLength);
            const courtMat = new THREE.MeshStandardMaterial({ map: courtTexture, roughness: 0.6 });
            const court = new THREE.Mesh(courtGeo, courtMat);
            court.rotation.x = -Math.PI / 2;
            court.position.y = 0.01;
            court.receiveShadow = true;
            scene.add(court);
        }

        // 建立籃框與籃板 (前後兩端)
        let hoops = [];
        function createHoops() {
            // 球場長度 12m (-6 到 6)
            createSingleHoop(0, 2.5, -5.9, 0);   // 北端籃框
            createSingleHoop(0, 2.5, 5.9, Math.PI); // 南端籃框
        }

        function createSingleHoop(x, y, z, rotationY) {
            const hoopGroup = new THREE.Group();
            hoopGroup.position.set(x, 0, z);
            hoopGroup.rotation.y = rotationY;

            // 1. 籃球柱
            const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.5, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, 1.25, -0.4);
            pole.castShadow = true;
            hoopGroup.add(pole);

            // 2. 籃板 (高度離地 2.5m 底部，尺寸 1.5m x 1.0m)
            const boardCanvas = document.createElement('canvas');
            boardCanvas.width = 512;
            boardCanvas.height = 340;
            const bCtx = boardCanvas.getContext('2d');
            bCtx.fillStyle = '#ffffff';
            bCtx.fillRect(0, 0, 512, 340);
            // 紅色外框
            bCtx.strokeStyle = '#ef4444';
            bCtx.lineWidth = 16;
            bCtx.strokeRect(10, 10, 492, 320);
            // 中心紅色方框與圓圈
            bCtx.strokeRect(180, 180, 152, 110);
            bCtx.beginPath();
            bCtx.arc(256, 235, 30, 0, Math.PI * 2);
            bCtx.stroke();

            const boardTexture = new THREE.CanvasTexture(boardCanvas);
            const boardGeo = new THREE.BoxGeometry(1.5, 1.0, 0.08);
            const boardMat = new THREE.MeshStandardMaterial({ map: boardTexture, roughness: 0.4 });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, 2.7, -0.2);
            board.castShadow = true;
            board.receiveShadow = true;
            hoopGroup.add(board);

            // 3. 金屬橘紅色籃圈 (半徑 0.23m)
            const rimGeo = new THREE.TorusGeometry(0.23, 0.02, 16, 32);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4500, metalness: 0.6, roughness: 0.3 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(0, 2.38, 0.25);
            rim.castShadow = true;
            hoopGroup.add(rim);

            // 4. 白色籃網 (半透明網狀效果)
            const netGeo = new THREE.ConeGeometry(0.23, 0.35, 16, 4, true);
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.7 });
            const net = new THREE.Mesh(netGeo, netMat);
            net.position.set(0, 2.18, 0.25);
            hoopGroup.add(net);

            // 儲存籃框中心世界座標供進球判定用
            const hoopCenterWorld = new THREE.Vector3(x, 2.38, z + 0.25);
            hoops.push({
                group: hoopGroup,
                center: hoopCenterWorld,
                boardMesh: board,
                zPos: z
            });

            scene.add(hoopGroup);
        }

        // 產生 3D 籃球 (半場內隨機散布 30 顆)
        function spawnBalls() {
            // 建立籃球紋理 (橘紅色帶黑色溝紋)
            const ballCanvas = document.createElement('canvas');
            ballCanvas.width = 512;
            ballCanvas.height = 256;
            const bCtx = ballCanvas.getContext('2d');
            bCtx.fillStyle = '#ff5722';
            bCtx.fillRect(0, 0, 512, 256);
            bCtx.strokeStyle = '#1e1e1e';
            bCtx.lineWidth = 12;
            // 畫球的黑溝紋
            bCtx.beginPath();
            bCtx.moveTo(0, 128); bCtx.lineTo(512, 128);
            bCtx.moveTo(256, 0); bCtx.lineTo(256, 256);
            bCtx.stroke();
            // 弧形溝紋
            bCtx.beginPath();
            bCtx.arc(128, 128, 100, -Math.PI/2, Math.PI/2);
            bCtx.stroke();
            bCtx.beginPath();
            bCtx.arc(384, 128, 100, Math.PI/2, Math.PI*1.5);
            bCtx.stroke();

            const ballTexture = new THREE.CanvasTexture(ballCanvas);
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ map: ballTexture, roughness: 0.5 });

            const radius = 0.24;
            for (let i = 0; i < 30; i++) {
                const ballMesh = new THREE.Mesh(ballGeo, ballMat);
                
                // 在半場 8 公尺界內隨機散布 (x: -4.5 到 4.5, z: -4.5 到 4.5)
                const rx = (Math.random() - 0.5) * 8.5;
                const rz = (Math.random() - 0.5) * 8.5;
                ballMesh.position.set(rx, radius, rz);
                ballMesh.castShadow = true;

                scene.add(ballMesh);
                ballsOnCourt.push({
                    mesh: ballMesh,
                    initialPos: new THREE.Vector3(rx, radius, rz),
                    id: i
                });
            }
        }

        // --- 視角與控制系統 ---
        function initControls() {
            if (controlsMode === 'gyro') {
                window.addEventListener('deviceorientation', handleDeviceOrientation, true);
                window.addEventListener('devicemotion', handleDeviceMotion, true);
            } else {
                // PC 滑鼠拖曳控制
                const dom = renderer.domElement;
                dom.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    cameraEuler.y -= deltaX * 0.003;
                    cameraEuler.x -= deltaY * 0.003;
                    // 限制俯仰角
                    cameraEuler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraEuler.x));

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('mouseup', () => { isDragging = false; });

                // PC 鍵盤空白鍵投籃
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        triggerShoot();
                    }
                });
            }
        }

        // 陀螺儀轉向控制 (確保左右鏡向直覺修正)
        function handleDeviceOrientation(event) {
            if (!gameActive) return;
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            // 建立歐拉角並進行左右鏡向修正
            const zee = new THREE.Vector3(0, 0, 1);
            const cameraQuaternion = new THREE.Quaternion();
            const euler = new THREE.Euler();

            euler.set(beta, alpha, -gamma, 'YXZ');
            cameraQuaternion.setFromEuler(euler);
            
            // 修正為直覺 360 度觀看
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            const m = new THREE.Matrix4().makeRotationZ(-orient);
            cameraQuaternion.applyMatrix4(m);

            camera.quaternion.slerp(cameraQuaternion, 0.2);
        }

        // 靈敏投籃觸發 (陀螺儀動態加速度/角速度檢測)
        let lastMotionTime = 0;
        function handleDeviceMotion(event) {
            if (!gameActive || !isHoldingBall) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            const now = Date.now();
            if (now - lastMotionTime < 500) return; // 冷却時間

            // 檢測向上快速甩動/仰起 (Y軸或Z軸加速度劇烈變化)
            if (acc.y > 14 || acc.z > 16) {
                lastMotionTime = now;
                triggerShoot();
            }
        }

        // --- 核心遊戲迴圈與邏輯 ---
        let clock = new THREE.Clock();

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            // 若非陀螺儀模式，將滑鼠 Euler 角度套用至相機
            if (controlsMode === 'mouse') {
                camera.quaternion.setFromEuler(cameraEuler);
            }

            // 1. 自動靠近與撿球機制
            updateAutoPickup(dt);

            // 2. 飛行中的球物理與導向更新
            updateFlyingBall(dt);

            // 3. 持球狀態下球體自轉與位置鎖定
            if (isHoldingBall && heldBallMesh) {
                heldBallMesh.rotation.y += dt * 2;
            }

            renderer.render(scene, camera);
        }

        // 自動靠近地面籃球與撿球判定
        function updateAutoPickup(dt) {
            if (isHoldingBall || flyingBall) {
                document.getElementById('message-banner').classList.add('hidden');
                return;
            }

            // 取得相機視線正前方向量
            const rayDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            let closestBall = null;
            let minAngle = 0.35; // 視線對準容許角度 (~20度)

            ballsOnCourt.forEach(ballObj => {
                const ballPos = ballObj.mesh.position;
                const toBall = new THREE.Vector3().subVectors(ballPos, camera.position);
                const dist = toBall.length();
                toBall.normalize();

                const angle = rayDir.angleTo(toBall);
                if (angle < minAngle && dist < 12) {
                    minAngle = angle;
                    closestBall = ballObj;
                }
            });

            if (closestBall) {
                document.getElementById('message-banner').classList.remove('hidden');
                document.getElementById('message-banner').textContent = `正在靠近籃球... 距離: ${closestBall.mesh.position.distanceTo(camera.position).toFixed(1)}m`;

                // 相機以慢跑速度 (例如 3.5 m/s) 自動向該球靠近
                const targetPos = closestBall.mesh.position.clone();
                targetPos.y = camera.position.y; // 保持視角高度
                camera.position.lerp(targetPos, dt * 2.5);

                // 當球距離相機夠近 (佔滿紅圈或距離 < 1.2m)，完成撿球
                if (camera.position.distanceTo(closestBall.mesh.position) < 1.4) {
                    pickupBall(closestBall);
                }
            } else {
                document.getElementById('message-banner').classList.add('hidden');
            }
        }

        // 撿起籃球
        function pickupBall(ballObj) {
            scene.remove(ballObj.mesh);
            // 從場上陣列移除
            ballsOnCourt = ballsOnCourt.filter(b => b.id !== ballObj.id);

            isHoldingBall = true;
            document.getElementById('message-banner').classList.remove('hidden');
            document.getElementById('message-banner').textContent = '已持球！請對準籃框並向上甩動（或按空白鍵）投籃！';

            // 建立持球 Mesh (50% 半透明，置於畫面正中央紅圈重疊處)
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = ballObj.mesh.material.clone();
            ballMat.transparent = true;
            ballMat.opacity = 0.5;

            heldBallMesh = new THREE.Mesh(ballGeo, ballMat);
            scene.add(heldBallMesh);
        }

        // 觸發投籃
        function triggerShoot() {
            if (!isHoldingBall || flyingBall) return;

            isHoldingBall = false;
            scene.remove(heldBallMesh);
            heldBallMesh = null;

            // 取得目前相機位置與視線方向
            const shootPos = camera.position.clone();
            const shootDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            // 建立 100% 不透明的飛行球
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xff5722, roughness: 0.5 });
            const ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.position.copy(shootPos).add(shootDir.clone().multiplyScalar(0.8));
            ballMesh.castShadow = true;
            scene.add(ballMesh);

            // 尋找最近的籃框作為進球目標
            let nearestHoop = hoops[0];
            let minDist = 999;
            hoops.forEach(h => {
                const d = ballMesh.position.distanceTo(h.center);
                if (d < minDist) {
                    minDist = d;
                    nearestHoop = h;
                }
            });

            // 給予初速度向量 (結合前方與向上向量，拋物線初速)
            const initialVelocity = shootDir.clone().multiplyScalar(11).add(new THREE.Vector3(0, 5.5, 0));

            flyingBall = {
                mesh: ballMesh,
                velocity: initialVelocity,
                targetHoop: nearestHoop,
                shotOrigin: shootPos.clone(),
                hasScored: false
            };

            document.getElementById('message-banner').textContent = '球已投出！正在追蹤飛行軌跡...';
        }

        // 飛行球物理、磁吸導向與碰撞更新
        function updateFlyingBall(dt) {
            if (!flyingBall) return;

            const ball = flyingBall.mesh;
            const vel = flyingBall.velocity;

            // 重力加速度
            vel.y -= 9.8 * dt;
            ball.position.addScaledVector(vel, dt);
            ball.rotation.x += dt * 5;

            // 全程磁吸進球輔助 (輕微引力導向籃框中心，確保高進球率)
            const hoopCenter = flyingBall.targetHoop.center;
            const toHoop = new THREE.Vector3().subVectors(hoopCenter, ball.position);
            const distToHoop = toHoop.length();

            if (distToHoop < 6.0 && vel.y < 2) {
                toHoop.normalize();
                vel.addScaledVector(toHoop, dt * 12.0); // 磁吸導向修正
            }

            // 動態鏡頭跟隨：平滑切換至球體後方水平跟隨模式
            const followOffset = new THREE.Vector3(0, 0.8, 1.8);
            const targetCamPos = ball.position.clone().add(followOffset);
            camera.position.lerp(targetCamPos, dt * 8);
            camera.lookAt(ball.position);

            // 碰撞檢測：籃板碰撞反彈
            const board = flyingBall.targetHoop.boardMesh;
            const boardWorldPos = new THREE.Vector3();
            board.getWorldPosition(boardWorldPos);

            if (Math.abs(ball.position.z - boardWorldPos.z) < 0.3 && 
                Math.abs(ball.position.x - boardWorldPos.x) < 0.8 && 
                Math.abs(ball.position.y - boardWorldPos.y) < 0.6) {
                // 彈性反彈
                vel.z *= -0.5;
                vel.x *= 0.7;
            }

            // 進球判定：當球通過籃圈平面附近
            if (!flyingBall.hasScored && 
                Math.abs(ball.position.x - hoopCenter.x) < 0.30 && 
                Math.abs(ball.position.z - hoopCenter.z) < 0.30 && 
                Math.abs(ball.position.y - hoopCenter.y) < 0.2) {
                
                flyingBall.hasScored = true;
                ballsScoredCount++;

                // 計算投籃距離判定分數 (三分線半徑 5m)
                const distFromOrigin = flyingBall.shotOrigin.distanceTo(hoopCenter);
                const points = distFromOrigin > 5.0 ? 3 : 2;
                score += points;
                updateHUD();

                // 籃板金黃光亮閃爍一次
                flashBoard(flyingBall.targetHoop);
                document.getElementById('message-banner').textContent = `🎉 進球得分！ +${points} 分 (${points === 3 ? '三分外線得分！' : '禁區內得分！'})`;
            }

            // 落地判定：球接觸地面 (y <= 0.24) 或超出邊界即銷毀
            if (ball.position.y <= 0.24 || ball.position.y < -1) {
                scene.remove(ball);
                flyingBall = null;
                ballsRemaining--;
                updateHUD();

                // 視角平滑重置回玩家預設站位
                resetCameraView();

                // 檢查遊戲結束
                if (ballsRemaining <= 0) {
                    endGame();
                }
            }
        }

        // 籃板金黃光亮閃爍效果
        function flashBoard(hoop) {
            const board = hoop.boardMesh;
            const origColor = board.material.color.clone();
            board.material.color.set(0xffd700); // 金黃色
            board.material.emissive.set(0xffa500);
            setTimeout(() => {
                board.material.color.copy(origColor);
                board.material.emissive.set(0x000000);
            }, 400);
        }

        // 視角平滑重置回預設位置
        function resetCameraView() {
            camera.position.set(0, 1.6, 5);
            cameraEuler.set(0, 0, 0);
            if (controlsMode === 'mouse') {
                camera.quaternion.setFromEuler(cameraEuler);
            }
        }

        function endGame() {
            gameActive = false;
            if (timerInterval) clearInterval(timerInterval);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('crosshair').classList.add('hidden');
            document.getElementById('message-banner').classList.add('hidden');

            document.getElementById('final-name').textContent = playerName;
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-balls-scored').textContent = `${ballsScoredCount} / 30`;

            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            ballsRemaining = 30;
            ballsScoredCount = 0;
            updateHUD();

            // 清除現存場上球
            ballsOnCourt.forEach(b => scene.remove(b.mesh));
            ballsOnCourt = [];
            if (flyingBall) {
                scene.remove(flyingBall.mesh);
                flyingBall = null;
            }
            if (heldBallMesh) {
                scene.remove(heldBallMesh);
                heldBallMesh = null;
            }
            isHoldingBall = false;

            // 重新生成球與啟動
            spawnBalls();
            resetCameraView();
            startGameSession();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
