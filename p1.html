<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3D 籃球</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;
  }
  #c{display:block;width:100%;height:100%;}

  .overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding:20px;
  }
  .overlay.hidden{display:none;}

  .panel{
    background:linear-gradient(160deg,#0e1c33 0%,#030f26 100%);
    border:1px solid rgba(120,180,255,.22);
    border-radius:20px;
    padding:30px 34px;
    text-align:center;color:#fff;
    box-shadow:0 24px 70px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);
    max-width:92vw;
  }
  .panel h1{
    font-size:21px;font-weight:700;letter-spacing:3px;margin-bottom:6px;
    background:linear-gradient(90deg,#7fb6ff,#ff8a3d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .panel .sub{font-size:12px;color:#7f92b0;letter-spacing:1px;margin-bottom:20px;}
  .panel label{display:block;font-size:12px;color:#8fa3c0;letter-spacing:1px;margin-bottom:8px;text-align:left;}

  input[type=text]{
    width:280px;max-width:74vw;
    padding:13px 16px;font-size:16px;
    border-radius:12px;
    border:1px solid rgba(140,190,255,.25);
    background:rgba(255,255,255,.06);
    color:#fff;outline:none;text-align:center;
    letter-spacing:1px;
    transition:border-color .2s,background .2s;
  }
  input[type=text]:focus{border-color:#5aa0ff;background:rgba(90,160,255,.1);}

  .btn{
    margin-top:20px;
    padding:14px 44px;
    font-size:16px;font-weight:700;letter-spacing:2px;
    border:none;border-radius:12px;
    background:linear-gradient(135deg,#ff9147,#ff5e2b);
    color:#fff;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,94,43,.35);
    transition:transform .12s,box-shadow .12s;
  }
  .btn:active{transform:scale(.96);box-shadow:0 4px 14px rgba(255,94,43,.4);}

  #startScreen .btn{
    padding:22px 68px;
    font-size:20px;letter-spacing:4px;border-radius:16px;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 24px rgba(255,94,43,.35);}
    50%{box-shadow:0 8px 44px rgba(255,94,43,.75);}
  }
  #startScreen .tip{
    margin-top:22px;font-size:12px;color:#7f92b0;letter-spacing:1px;line-height:1.9;
  }

  /* HUD */
  #hud{
    position:fixed;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));
    z-index:6;pointer-events:none;color:#fff;
    opacity:0;transition:opacity .6s;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  #hud.on{opacity:1;}
  #hud .name{font-size:12px;letter-spacing:2px;color:#9db6d8;margin-bottom:2px;}
  #hud .scoreRow{display:flex;align-items:baseline;gap:6px;}
  #hud .scoreNum{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#8fb9ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #hud .scoreUnit{font-size:12px;letter-spacing:2px;color:#8fa3c0;}

  /* 準心 */
  #crosshair{
    position:fixed;left:50%;top:50%;width:22px;height:22px;
    margin:-11px 0 0 -11px;z-index:5;pointer-events:none;
    opacity:0;transition:opacity .6s;
  }
  #crosshair.on{opacity:1;}
  #crosshair::before,#crosshair::after{
    content:'';position:absolute;background:rgba(255,255,255,.55);
    box-shadow:0 0 6px rgba(120,180,255,.8);
  }
  #crosshair::before{left:50%;top:0;width:1.5px;height:100%;margin-left:-.75px;}
  #crosshair::after{top:50%;left:0;height:1.5px;width:100%;margin-top:-.75px;}
  #crosshair i{
    position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:rgba(255,140,60,.85);
    box-shadow:0 0 10px rgba(255,140,60,.9);
  }

  /* 得分提示 */
  #flash{
    position:fixed;left:50%;top:26%;transform:translateX(-50%) scale(.7);
    z-index:7;pointer-events:none;opacity:0;
    font-size:44px;font-weight:900;letter-spacing:4px;
    color:#ffb347;text-shadow:0 0 24px rgba(255,150,50,.9),0 4px 18px rgba(0,0,0,.9);
    transition:opacity .25s,transform .25s;
  }
  #flash.show{opacity:1;transform:translateX(-50%) scale(1);}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="crosshair"><i></i></div>

<div id="hud">
  <div class="name" id="hudName">一甲國小練習生</div>
  <div class="scoreRow"><span class="scoreNum" id="scoreNum">0</span><span class="scoreUnit">分</span></div>
</div>

<div id="flash">+2</div>

<!-- 姓名輸入 -->
<div class="overlay" id="nameScreen">
  <div class="panel">
    <h1>3D 籃球</h1>
    <div class="sub">BASKETBALL · NIGHT COURT</div>
    <label>玩家姓名</label>
    <input type="text" id="nameInput" value="一甲國小練習生" maxlength="16" autocomplete="off" spellcheck="false">
    <button class="btn" id="nameOk">確定</button>
  </div>
</div>

<!-- 行動裝置授權 -->
<div class="overlay hidden" id="startScreen">
  <div class="panel">
    <h1>準備開始</h1>
    <div class="sub">請允許裝置感測器權限</div>
    <button class="btn" id="startBtn">開始遊戲</button>
    <div class="tip">授權後請以「轉動裝置」控制視角<br>輕點螢幕即可投籃</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   常數
   ============================================================ */
const COURT_W = 10;              // 球場寬 (X)
const COURT_L = 12;              // 球場長 (Z)
const RIM_Y   = 3.05;            // 籃框高度
const RIM_R   = 0.225;           // 籃框半徑
const BALL_R  = 0.12;            // 球半徑
const BB_W    = 1.8;             // 籃板寬
const BB_H    = 1.05;            // 籃板高
const BB_Z    = 4.8;             // 籃板面距離中線 (z = ±4.8)
const RIM_Z   = 4.425;           // 籃框中心距離中線 (z = ±4.425)
const SHOT_SPEED = 8.2;          // 投籃初速
const SHOT_LIFT  = 0.5;          // 投籃上揚修正
const GRAVITY    = 9.8;

/* ============================================================
   全域
   ============================================================ */
let renderer, scene, camera;
let ballMesh;
let gameStarted = false;
let playerName = '一甲國小練習生';
let score = 0;

const hoops = [
  { side: -1, rimZ: -RIM_Z },
  { side:  1, rimZ:  RIM_Z }
];

const ballState = {
  mode: 'held',                       // held | flying
  vel: new THREE.Vector3(),
  prevPos: new THREE.Vector3(),
  timer: 0,
  scored: false
};

/* 陀螺儀 */
let usingGyro = false;
let gyroInit = false;
const _qDev    = new THREE.Quaternion();
const _qDev0Inv= new THREE.Quaternion();
const _qRel    = new THREE.Quaternion();
const _qCam0   = new THREE.Quaternion();
const _euler   = new THREE.Euler();
const _q0      = new THREE.Quaternion();
const _q1      = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const _zee     = new THREE.Vector3(0, 0, 1);

/* PC 滑鼠 */
let isDragging = false;
let lastMx = 0, lastMy = 0;
let yaw = 0, pitch = 0;

/* ============================================================
   偵測裝置
   ============================================================ */
const isTouchDevice = (() => {
  const ua = navigator.userAgent;
  const mobileUA = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
  const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  return mobileUA || iPadOS || (navigator.maxTouchPoints > 1 && 'ontouchstart' in window);
})();

/* ============================================================
   初始化
   ============================================================ */
function init() {
  const canvas = document.getElementById('c');

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, 0.012);

  camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 400);
  camera.position.set(0, 1.7, 0);
  camera.quaternion.identity();
  _qCam0.copy(camera.quaternion);

  buildLights();
  buildStars();
  buildCourt();
  buildHoop(-1);
  buildHoop(1);
  buildBall();

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  bindInput();
  onResize();
}

/* ============================================================
   尺寸 / 比例
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w === 0 || h === 0) return;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);

  camera.aspect = w / h;

  // 直向時稍微加大 FOV，避免視野過窄
  const baseFov = 72;
  if (camera.aspect < 0.8) {
    camera.fov = baseFov * 1.18;
  } else if (camera.aspect < 1.1) {
    camera.fov = baseFov * 1.08;
  } else {
    camera.fov = baseFov;
  }
  camera.updateProjectionMatrix();
}

/* ============================================================
   燈光
   ============================================================ */
function buildLights() {
  scene.add(new THREE.AmbientLight(0x7d93b8, 2.2));

  const d1 = new THREE.DirectionalLight(0xffffff, 2.4);
  d1.position.set(9, 22, 8);
  scene.add(d1);

  const d2 = new THREE.DirectionalLight(0x6f8fff, 1.0);
  d2.position.set(-10, 14, -12);
  scene.add(d2);

  const d3 = new THREE.DirectionalLight(0xffd0a0, 0.7);
  d3.position.set(0, 8, 20);
  scene.add(d3);
}

/* ============================================================
   星空
   ============================================================ */
function buildStars() {
  const N = 900;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 130 + Math.random() * 110;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.92);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) + 6;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff, size: 1.1, sizeAttenuation: true,
    transparent: true, opacity: 0.85, depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
}

/* ============================================================
   球場
   ============================================================ */
function buildCourt() {
  // 外圍深綠色草地
  const grass = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160),
    new THREE.MeshStandardMaterial({ color: 0x0a2a12, roughness: 1, metalness: 0 })
  );
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = -0.03;
  scene.add(grass);

  // 球場本體（極深藍）
  const tex = makeCourtTexture();
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.82, metalness: 0.06
  });
  const court = new THREE.Mesh(new THREE.PlaneGeometry(COURT_W, COURT_L), mat);
  court.rotation.x = -Math.PI / 2;
  court.position.y = 0;
  scene.add(court);
}

/* ---------- 球場線條 Canvas 紋理 ---------- */
function makeCourtTexture() {
  const PPM = 100;                                    // 每公尺像素
  const W = COURT_W * PPM, H = COURT_L * PPM;         // 1000 x 1200
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  // 底色：極深藍
  g.fillStyle = '#030f26';
  g.fillRect(0, 0, W, H);

  // 中央微光暈，增加立體感
  const grad = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * 0.75);
  grad.addColorStop(0, 'rgba(30,70,140,0.30)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  g.strokeStyle = '#ffffff';
  g.lineWidth = 5;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  const X = x => (x + COURT_W / 2) * PPM;   // 世界 x → px
  const Z = z => (z + COURT_L / 2) * PPM;   // 世界 z → px

  // 邊線
  g.strokeRect(3, 3, W - 6, H - 6);

  // 中線
  g.beginPath();
  g.moveTo(0, H / 2);
  g.lineTo(W, H / 2);
  g.stroke();

  // 中圈
  g.beginPath();
  g.arc(W / 2, H / 2, 1.8 * PPM, 0, Math.PI * 2);
  g.stroke();

  // 兩端
  [-1, 1].forEach(side => {
    const baseZ = side * (COURT_L / 2);       // 底線
    const rimZ  = side * RIM_Z;               // 籃框投影
    const ftZ   = baseZ - side * 5.8;         // 罰球線

    // --- 禁區（梯形改矩形，寬 4.9m）---
    const laneHalf = 2.45 * PPM;
    const yA = Z(baseZ), yB = Z(ftZ);
    g.beginPath();
    g.rect(W / 2 - laneHalf, Math.min(yA, yB), laneHalf * 2, Math.abs(yB - yA));
    g.stroke();

    // --- 罰球圈 ---
    g.beginPath();
    g.arc(W / 2, Z(ftZ), 1.8 * PPM, 0, Math.PI * 2);
    g.stroke();

    // --- 三分線（半徑 5m，圓心＝籃框投影點）---
    g.beginPath();
    if (side === -1) {
      g.arc(W / 2, Z(rimZ), 5 * PPM, 0, Math.PI, false);
    } else {
      g.arc(W / 2, Z(rimZ), 5 * PPM, Math.PI, Math.PI * 2, false);
    }
    g.stroke();

    // --- 禁區內淺色填滿 ---
    g.save();
    g.fillStyle = 'rgba(255,255,255,0.035)';
    g.fillRect(W / 2 - laneHalf, Math.min(yA, yB), laneHalf * 2, Math.abs(yB - yA));
    g.restore();

    // --- 合理衝撞區（半圓）---
    g.beginPath();
    if (side === -1) {
      g.arc(W / 2, Z(rimZ), 1.25 * PPM, 0, Math.PI, false);
    } else {
      g.arc(W / 2, Z(rimZ), 1.25 * PPM, Math.PI, Math.PI * 2, false);
    }
    g.stroke();
  });

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

/* ============================================================
   籃框 / 籃板
   ============================================================ */
function buildHoop(side) {
  const grp = new THREE.Group();
  const bbZ  = side * BB_Z;
  const rimZ = side * RIM_Z;

  /* --- 籃板（不透明純白）--- */
  const bbMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.32, metalness: 0.03,
    emissive: 0x111a2a, emissiveIntensity: 0.6
  });
  const bb = new THREE.Mesh(new THREE.BoxGeometry(BB_W, BB_H, 0.06), bbMat);
  bb.position.set(0, 2.9 + BB_H / 2, bbZ + side * 0.03);
  grp.add(bb);

  /* --- 籃板紅色內框 --- */
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xff5a1f });
  const frameW = 0.59, frameH = 0.45, lw = 0.045;
  const frameCx = 0;
  const frameCy = 3.05 + frameH / 2 + 0.02;
  const faceZ = bbZ + side * 0.002;

  const mkBar = (w, h) => new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.012), lineMat);
  const barTop = mkBar(frameW + lw, lw);
  barTop.position.set(frameCx, frameCy + frameH / 2, faceZ);
  const barBot = mkBar(frameW + lw, lw);
  barBot.position.set(frameCx, frameCy - frameH / 2, faceZ);
  const barL = mkBar(lw, frameH);
  barL.position.set(frameCx - frameW / 2, frameCy, faceZ);
  const barR = mkBar(lw, frameH);
  barR.position.set(frameCx + frameW / 2, frameCy, faceZ);
  grp.add(barTop, barBot, barL, barR);

  /* --- 籃框 --- */
  const rimMat = new THREE.MeshStandardMaterial({
    color: 0xff6a1a, roughness: 0.42, metalness: 0.75,
    emissive: 0x3a1200, emissiveIntensity: 0.8
  });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(RIM_R, 0.017, 10, 44), rimMat);
  rim.rotation.x = Math.PI / 2;
  rim.position.set(0, RIM_Y, rimZ);
  grp.add(rim);

  /* --- 連接臂 --- */
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.055, 0.24), rimMat);
  arm.position.set(0, RIM_Y - 0.03, side * (BB_Z + RIM_Z) / 2 - side * 0.02);
  arm.position.z = side * ((BB_Z + (RIM_Z + RIM_R)) / 2);
  arm.scale.z = Math.abs(BB_Z - (RIM_Z + RIM_R)) / 0.24;
  grp.add(arm);

  /* --- 籃網 --- */
  const netMat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false
  });
  const N = 14, netBotY = RIM_Y - 0.42, netBotR = 0.135;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a  = (i / N) * Math.PI * 2;
    const a3 = ((i + 0.5) / N) * Math.PI * 2;
    const tx = Math.cos(a) * RIM_R, tz = Math.sin(a) * RIM_R;
    const bx = Math.cos(a) * netBotR, bz = Math.sin(a) * netBotR;

    // 縱線
    pts.push(new THREE.Vector3(tx, RIM_Y, rimZ + tz));
    pts.push(new THREE.Vector3(bx, netBotY, rimZ + bz));

    // 交叉中段
    pts.push(new THREE.Vector3(tx, RIM_Y, rimZ + tz));
    pts.push(new THREE.Vector3(Math.cos(a3) * 0.185, RIM_Y - 0.21, rimZ + Math.sin(a3) * 0.185));
  }
  // 底部圓環
  for (let i = 0; i < N; i++) {
    const a1 = (i / N) * Math.PI * 2;
    const a2 = ((i + 1) / N) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a1) * netBotR, netBotY, rimZ + Math.sin(a1) * netBotR));
    pts.push(new THREE.Vector3(Math.cos(a2) * netBotR, netBotY, rimZ + Math.sin(a2) * netBotR));
  }
  const netGeo = new THREE.BufferGeometry().setFromPoints(pts);
  grp.add(new THREE.LineSegments(netGeo, netMat));

  /* --- 支柱 --- */
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a2740, roughness: 0.55, metalness: 0.55 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 3.6, 14), poleMat);
  pole.position.set(0, 1.8, side * (BB_Z + 1.9));
  grp.add(pole);

  const armLen = 1.9;
  const support = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, armLen), poleMat);
  support.position.set(0, 3.32, side * (BB_Z + 1.9 / 2));
  grp.add(support);

  const brace = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 1.1), poleMat);
  brace.position.set(0, 3.0, side * (BB_Z + 1.15));
  brace.rotation.x = side * 0.55;
  grp.add(brace);

  scene.add(grp);
  return grp;
}

/* ============================================================
   球
   ============================================================ */
function buildBall() {
  const tex = makeBallTexture();
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.78, metalness: 0.04,
    emissive: 0x2a1004, emissiveIntensity: 0.5
  });
  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 24), mat);
  ballMesh.position.set(0, 1.45, -0.6);
  scene.add(ballMesh);
}

function makeBallTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#c85c26';
  g.fillRect(0, 0, 512, 256);

  // 皮革噪點
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * 0.09})`;
    g.fillRect(Math.random() * 512, Math.random() * 256, 2, 2);
  }

  g.strokeStyle = '#170a03';
  g.lineWidth = 7;
  g.lineCap = 'round';

  g.beginPath(); g.moveTo(256, 0); g.lineTo(256, 256); g.stroke();
  g.beginPath(); g.moveTo(0, 128); g.lineTo(512, 128); g.stroke();
  g.beginPath(); g.arc(-70, 128, 140, -Math.PI / 2, Math.PI / 2); g.stroke();
  g.beginPath(); g.arc(582, 128, 140, Math.PI / 2, Math.PI * 1.5); g.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

/* ============================================================
   輸入綁定
   ============================================================ */
function bindInput() {
  const canvas = renderer.domElement;

  /* ---------- PC：滑鼠拖曳 ---------- */
  canvas.addEventListener('mousedown', e => {
    if (usingGyro) return;
    if (e.button !== 0) return;
    isDragging = true;
    lastMx = e.clientX; lastMy = e.clientY;
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging || usingGyro) return;
    const dx = e.clientX - lastMx;
    const dy = e.clientY - lastMy;
    lastMx = e.clientX; lastMy = e.clientY;

    yaw   -= dx * 0.0035;
    pitch -= dy * 0.0035;
    pitch = Math.max(-Math.PI / 2 + 0.02, Math.min(Math.PI / 2 - 0.02, pitch));

    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  });

  window.addEventListener('mouseup', () => { isDragging = false; });
  window.addEventListener('blur', () => { isDragging = false; });

  /* ---------- PC：空白鍵投籃 ---------- */
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      shoot();
    }
  });

  /* ---------- 行動裝置：輕點投籃 ---------- */
  let touchStartInfo = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { touchStartInfo = null; return; }
    touchStartInfo = {
      x: e.touches[0].clientX,
      y: e.touches[0].clientY,
      t: performance.now()
    };
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (!touchStartInfo) return;
    const ct = e.changedTouches[0];
    const dt = performance.now() - touchStartInfo.t;
    const dx = ct.clientX - touchStartInfo.x;
    const dy = ct.clientY - touchStartInfo.y;
    const dist = Math.hypot(dx, dy);

    // 短按且幾乎沒有位移 → 視為投籃
    if (dt < 350 && dist < 32) {
      shoot();
    }
    touchStartInfo = null;
  }, { passive: true });

  canvas.addEventListener('touchcancel', () => { touchStartInfo = null; }, { passive: true });

  /* ---------- 裝置方向 ---------- */
  window.addEventListener('deviceorientation', handleOrientation, true);
}

/* ============================================================
   陀螺儀 → 相機
   ============================================================ */
function getScreenOrientationAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  if (typeof window.orientation === 'number') {
    return window.orientation;
  }
  return 0;
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;

  const alpha = THREE.MathUtils.degToRad(e.alpha);
  const beta  = THREE.MathUtils.degToRad(e.beta);
  const gamma = THREE.MathUtils.degToRad(e.gamma);
  const orient = THREE.MathUtils.degToRad(getScreenOrientationAngle());

  // 標準 DeviceOrientation → 四元數
  _euler.set(beta, alpha, -gamma, 'YXZ');
  _qDev.setFromEuler(_euler);
  _qDev.multiply(_q1);
  _q0.setFromAxisAngle(_zee, -orient);
  _qDev.multiply(_q0);

  if (!gyroInit) {
    gyroInit = true;
    usingGyro = true;
    _qDev0Inv.copy(_qDev).invert();     // 記錄起始姿態（相對基準）
    _qCam0.copy(camera.quaternion);     // 記錄當時的相機朝向
    return;
  }

  // 相對旋轉：Qrel = Qdev(t) * Qdev(0)^-1
  _qRel.copy(_qDev).multiply(_qDev0Inv);

  // 相機 = Qrel * Qcam0
  camera.quaternion.copy(_qRel).multiply(_qCam0);
}

/* ============================================================
   投籃
   ============================================================ */
function shoot() {
  if (!gameStarted || ballState.mode !== 'held') return;

  // 由相機前方取得方向（世界座標）
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

  // 上揚修正（世界座標的「上」）
  dir.y += SHOT_LIFT;
  dir.normalize();

  // 從持球位置出手
  ballState.vel.copy(dir).multiplyScalar(SHOT_SPEED);
  ballState.mode = 'flying';
  ballState.timer = 0;
  ballState.scored = false;
  ballState.prevPos.copy(ballMesh.position);
}

/* ============================================================
   更新球
   ============================================================ */
function updateBall(dt) {
  if (ballState.mode === 'held') {
    // 持球跟隨相機（前方偏下）
    const off = new THREE.Vector3(0, -0.22, -0.6).applyQuaternion(camera.quaternion);
    ballMesh.position.copy(camera.position).add(off);
    ballMesh.rotation.y += dt * 0.6;
    ballMesh.rotation.x += dt * 0.25;
    return;
  }

  /* ----- 飛行中 ----- */
  ballState.timer += dt;
  ballState.prevPos.copy(ballMesh.position);

  // 重力
  ballState.vel.y -= GRAVITY * dt;
  ballMesh.position.addScaledVector(ballState.vel, dt);

  // 自轉
  ballMesh.rotation.x += ballState.vel.z * dt * 2.4;
  ballMesh.rotation.z -= ballState.vel.x * dt * 2.4;

  // 進球判定
  checkScore();

  // 籃板反彈
  for (const h of hoops) {
    const bbFaceZ = h.side * BB_Z;
    const p = ballMesh.position;
    const inX = Math.abs(p.x) < BB_W / 2 + BALL_R * 0.4;
    const inY = p.y > 2.9 - BALL_R && p.y < 2.9 + BB_H + BALL_R;

    if (inX && inY) {
      // 球在籃板內側（靠球場那一面）
      if (h.side === -1 && p.z > bbFaceZ && p.z < bbFaceZ + BALL_R + 0.06 && ballState.vel.z < 0) {
        ballMesh.position.z = bbFaceZ + BALL_R + 0.06;
        ballState.vel.z *= -0.45;
        ballState.vel.x *= 0.7;
        ballState.vel.y *= 0.7;
      } else if (h.side === 1 && p.z < bbFaceZ && p.z > bbFaceZ - BALL_R - 0.06 && ballState.vel.z > 0) {
        ballMesh.position.z = bbFaceZ - BALL_R - 0.06;
        ballState.vel.z *= -0.45;
        ballState.vel.x *= 0.7;
        ballState.vel.y *= 0.7;
      }
    }
  }

  // 籃框反彈（外圈）
  for (const h of hoops) {
    const dx = ballMesh.position.x - 0;
    const dz = ballMesh.position.z - h.rimZ;
    const dy = ballMesh.position.y - RIM_Y;
    const dHoriz = Math.sqrt(dx * dx + dz * dz);

    if (Math.abs(dy) < BALL_R && Math.abs(dHoriz - RIM_R) < BALL_R) {
      // 撞到框
      const nx = dx / (dHoriz || 1);
      const nz = dz / (dHoriz || 1);
      const push = RIM_R + (dHoriz > RIM_R ? BALL_R : -BALL_R) - dHoriz;
      ballMesh.position.x += nx * push;
      ballMesh.position.z += nz * push;

      const vn = ballState.vel.x * nx + ballState.vel.z * nz;
      if ((dHoriz > RIM_R && vn < 0) || (dHoriz < RIM_R && vn > 0)) {
        ballState.vel.x -= 1.5 * vn * nx;
        ballState.vel.z -= 1.5 * vn * nz;
        ballState.vel.y *= 0.75;
      }
    }
  }

  // 地板反彈
  if (ballMesh.position.y < BALL_R) {
    ballMesh.position.y = BALL_R;
    if (Math.abs(ballState.vel.y) > 0.8) {
      ballState.vel.y *= -0.52;
      ballState.vel.x *= 0.78;
      ballState.vel.z *= 0.78;
    } else {
      ballState.vel.y = 0;
      ballState.vel.x *= 0.93;
      ballState.vel.z *= 0.93;
    }
  }

  // 出界 / 重置
  const rest = ballState.timer > 1.0 &&
               ballMesh.position.y <= BALL_R + 0.02 &&
               ballState.vel.lengthSq() < 1.2;

  if (ballState.timer > 6 || rest || Math.abs(ballMesh.position.x) > 26 || Math.abs(ballMesh.position.z) > 26) {
    resetBall();
  }
}

/* ============================================================
   進球判定
   ============================================================ */
function checkScore() {
  if (ballState.scored) return;

  const p = ballMesh.position;
  const pp = ballState.prevPos;

  // 由上往下穿越籃框水平面
  if (!(pp.y > RIM_Y && p.y <= RIM_Y)) return;

  const t = (pp.y - RIM_Y) / (pp.y - p.y);
  const ix = pp.x + (p.x - pp.x) * t;
  const iz = pp.z + (p.z - pp.z) * t;

  for (const h of hoops) {
    const dx = ix - 0;
    const dz = iz - h.rimZ;
    const dist = Math.sqrt(dx * dx + dz * dz);

    if (dist < RIM_R + 0.06) {          // 稍微寬容的判定
      score += 2;
      ballState.scored = true;
      onScore();
      return;
    }
  }
}

function onScore() {
  document.getElementById('scoreNum').textContent = score;

  const flash = document.getElementById('flash');
  flash.textContent = '+2';
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 620);
}

function resetBall() {
  ballState.mode = 'held';
  ballState.vel.set(0, 0, 0);
  ballState.timer = 0;
  ballState.scored = false;
}

/* ============================================================
   主迴圈
   ============================================================ */
let lastT = 0;

function animate(t) {
  requestAnimationFrame(animate);

  if (lastT === 0) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (gameStarted) {
    updateBall(dt);
  }

  renderer.render(scene, camera);
}

/* ============================================================
   流程控制
   ============================================================ */
function startGame() {
  if (gameStarted) return;
  gameStarted = true;

  document.getElementById('hudName').textContent = playerName;
  document.getElementById('hud').classList.add('on');
  document.getElementById('crosshair').classList.add('on');

  lastT = 0;
  requestAnimationFrame(animate);
}

async function requestSensorPermission() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (err) {
    console.warn('DeviceOrientation permission:', err);
  }

  try {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      await DeviceMotionEvent.requestPermission();
    }
  } catch (err) {
    console.warn('DeviceMotion permission:', err);
  }
}

/* ---------- DOM 事件 ---------- */
function setupUI() {
  const nameScreen = document.getElementById('nameScreen');
  const startScreen = document.getElementById('startScreen');
  const nameInput  = document.getElementById('nameInput');
  const nameOk     = document.getElementById('nameOk');
  const startBtn   = document.getElementById('startBtn');

  const submitName = () => {
    const v = nameInput.value.trim();
    playerName = v.length ? v : '一甲國小練習生';
    nameInput.blur();
    nameScreen.classList.add('hidden');

    if (isTouchDevice) {
      startScreen.classList.remove('hidden');
    } else {
      startGame();
    }
  };

  nameOk.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitName(); }
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '啟動中…';
    await requestSensorPermission();
    startScreen.classList.add('hidden');
    startGame();
  });
}

/* ============================================================
   啟動
   ============================================================ */
init();
setupUI();

/* 保險：若 3 秒內陀螺儀沒有任何事件（PC 或無感測器），
   仍然允許以滑鼠操作，usingGyro 保持 false。 */
setTimeout(() => {
  if (!gyroInit) usingGyro = false;
}, 3000);

</script>
