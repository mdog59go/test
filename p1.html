<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D 籃球練習場</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000;z-index:4}
  #status{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));padding:10px 13px;border-radius:14px;background:#0008;backdrop-filter:blur(7px);font-weight:800;line-height:1.55}
  #message{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(18px,4vw,30px);font-weight:900;text-align:center;opacity:0;transition:opacity .2s;color:#ffe36e}
  #reticle{position:absolute;left:50%;top:50%;width:clamp(92px,16vw,140px);height:clamp(92px,16vw,140px);transform:translate(-50%,-50%);border:7px solid #ff2020;border-radius:50%;box-shadow:0 0 8px #fff,0 0 24px #f00,inset 0 0 18px #f006}
  #reticle:before,#reticle:after{content:"";position:absolute;background:#ff3030;left:50%;top:50%;transform:translate(-50%,-50%)}#reticle:before{width:25%;height:4px}#reticle:after{width:4px;height:25%}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,#10264dcc,#000f);z-index:10}
  .panel{width:min(92vw,520px);padding:26px;border:1px solid #ffffff38;border-radius:24px;background:#071126ee;box-shadow:0 20px 70px #000;color:#fff;text-align:center}
  h1{margin:0 0 10px;font-size:clamp(28px,7vw,48px)}p{line-height:1.6;color:#d9e6ff}label{display:block;text-align:left;margin:18px 0 8px;font-weight:800}input{width:100%;padding:14px 16px;border-radius:13px;border:2px solid #6186c7;background:#020817;color:#fff;font-size:18px;outline:none}input:focus{border-color:#fff}
  button{margin-top:18px;width:100%;padding:15px 20px;border:0;border-radius:15px;background:linear-gradient(135deg,#ff5b25,#df1515);color:white;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 8px 30px #f303}button:focus-visible{outline:4px solid #fff;outline-offset:3px}.hide{display:none!important}
  #summaryScore{font-size:56px;font-weight:1000;color:#ffd54a;margin:8px}
  #rotateTip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:13px;background:#0008;padding:8px 12px;border-radius:999px;white-space:nowrap}
</style>
</head>
<body>
<div id="hud" class="hide"><div id="status"></div><div id="message"></div><div id="reticle"></div><div id="rotateTip"></div></div>
<div id="nameModal" class="overlay"><div class="panel"><h1>🏀 3D 籃球練習</h1><p>對準地上的球即可自動靠近。持球後瞄準籃框，行動裝置快速向上仰起或甩動；電腦按空白鍵投籃。</p><label for="playerName">玩家姓名</label><input id="playerName" value="一甲國小練習生" maxlength="30" autocomplete="name"><button id="continueBtn" type="button">繼續</button></div></div>
<div id="startModal" class="overlay hide"><div class="panel"><h1>準備好了嗎？</h1><p id="permissionText">點擊後將要求動作與方向感測器權限，並立即開始 3 分鐘挑戰。</p><button id="startBtn" type="button">開始遊戲</button></div></div>
<div id="endModal" class="overlay hide"><div class="panel"><h1>挑戰完成！</h1><p id="summaryName"></p><div id="summaryScore">0</div><p>最終總得分</p><button id="restartBtn" type="button">重新開始</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
'use strict';
const THREE=window.THREE;
const MOBILE=/iPad|iPhone|iPod|Android|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(navigator.userAgent));
const $=s=>document.querySelector(s); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let renderer,scene,camera,clock,playerName='一甲國小練習生',gameStarted=false,gameOver=false;
let yaw=0,pitch=-0.14,lastPointer=null,gyroEnabled=false,gyroReady=false,screenAngle=0;
let initialQuat=null,deviceQuat=new THREE.Quaternion(),viewQuat=new THREE.Quaternion();
let orientationBeta=null,lastBeta=null,lastMotionShot=0,upImpulse=0;
let balls=[],heldBall=null,flight=null,score=0,shotCount=0,timeLeft=180,targetBall=null;
const PLAYER_EYE=1.65,BALL_R=.12,COURT_W=10,COURT_L=12,RIM_Y=3.05;
const playerPos=new THREE.Vector3(0,PLAYER_EYE,0), raycaster=new THREE.Raycaster(), centerNDC=new THREE.Vector2(0,0);
const hoops=[], colliders=[];

function init3D(){
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
 scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.012);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,120);camera.position.copy(playerPos);clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0x6388ff,0x06200b,1.6));const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(7,12,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
 buildWorld();addEvents();animate();
}
function mat(c,rough=.65,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function mesh(g,m,p,cast=true,receive=true){const o=new THREE.Mesh(g,m);o.position.copy(p);o.castShadow=cast;o.receiveShadow=receive;scene.add(o);return o}
function line(points,color=0xffffff,width=1){const g=new THREE.BufferGeometry().setFromPoints(points);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,linewidth:width}));l.position.y=.012;scene.add(l);return l}
function rectLine(x1,z1,x2,z2){line([new THREE.Vector3(x1,0,z1),new THREE.Vector3(x2,0,z1),new THREE.Vector3(x2,0,z2),new THREE.Vector3(x1,0,z2),new THREE.Vector3(x1,0,z1)])}
function arc(cx,cz,r,a0,a1){const p=[];for(let i=0;i<=64;i++){const a=a0+(a1-a0)*i/64;p.push(new THREE.Vector3(cx+r*Math.cos(a),0,cz+r*Math.sin(a)))}line(p)}
function buildWorld(){
 mesh(new THREE.PlaneGeometry(60,60),mat(0x123d20,1),new THREE.Vector3(0,-.025,0),false,true).rotation.x=-Math.PI/2;
 mesh(new THREE.PlaneGeometry(COURT_W,COURT_L),mat(0x030f26,.82),new THREE.Vector3(),false,true).rotation.x=-Math.PI/2;
 rectLine(-5,-6,5,6);line([new THREE.Vector3(-5,0,0),new THREE.Vector3(5,0,0)]);arc(0,0,1.8,0,Math.PI*2);
 for(const end of [-1,1]){const z=end*6;const inward=-end;const laneZ=z+inward*3.6;rectLine(-2,z,2,laneZ);arc(0,laneZ,1.8,end>0?0:Math.PI,end>0?Math.PI:Math.PI*2);const hoopZ=z+inward*.85;arc(0,hoopZ,5,end>0?0:Math.PI,end>0?Math.PI:Math.PI*2);buildHoop(end);}
}
function buildHoop(end){
 const z=end*5.72, inward=-end, boardZ=z+inward*.2, rimZ=boardZ+inward*.48;
 const boardMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x000000,roughness:.45});
 const board=mesh(new THREE.BoxGeometry(1.8,1.05,.09),boardMat,new THREE.Vector3(0,3.55,boardZ));
 colliders.push({type:'box',obj:board,half:new THREE.Vector3(.9,.525,.045),bounce:.72});
 const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.86,1.11,.105)),new THREE.LineBasicMaterial({color:0xff2518}));frame.position.copy(board.position);scene.add(frame);
 const target=new THREE.Mesh(new THREE.TorusGeometry(.24,.025,10,32),new THREE.MeshBasicMaterial({color:0xff1717}));target.position.set(0,3.5,boardZ+inward*.06);target.rotation.x=Math.PI/2;scene.add(target);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(.23,.025,12,48),mat(0xff3b16,.28,.65));rim.position.set(0,RIM_Y,rimZ);rim.rotation.x=Math.PI/2;rim.castShadow=true;scene.add(rim);
 const poleZ=z+end*.55;const pole=mesh(new THREE.CylinderGeometry(.1,.14,3.2,18),mat(0xbb351e,.35,.7),new THREE.Vector3(0,1.6,poleZ));colliders.push({type:'cylinder',obj:pole,radius:.16,y0:0,y1:3.2,bounce:.55});
 const arm=mesh(new THREE.BoxGeometry(.16,.16,Math.abs(poleZ-boardZ)),mat(0xbb351e,.35,.7),new THREE.Vector3(0,3.45,(poleZ+boardZ)/2));colliders.push({type:'box',obj:arm,half:new THREE.Vector3(.08,.08,Math.abs(poleZ-boardZ)/2),bounce:.55});
 const netMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.78});for(let i=0;i<12;i++){const a=i/12*Math.PI*2,b=(i+.5)/12*Math.PI*2;const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(.23*Math.cos(a),RIM_Y-.02,rimZ+.23*Math.sin(a)),new THREE.Vector3(.13*Math.cos(b),RIM_Y-.48,rimZ+.13*Math.sin(b))]);const l=new THREE.Line(g,netMat);scene.add(l)}
 hoops.push({center:new THREE.Vector3(0,RIM_Y,rimZ),board,flash:0,end});
}
function ballMaterial(){return new THREE.MeshStandardMaterial({color:0xf47b20,roughness:.72,metalness:.03})}
function createBall(pos){
 const root=new THREE.Group();root.position.copy(pos);const sphere=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,28,20),ballMaterial());sphere.castShadow=true;sphere.receiveShadow=true;root.add(sphere);
 const groove=new THREE.LineBasicMaterial({color:0x080808});const circles=[[0,0,0],[Math.PI/2,0,0],[0,Math.PI/2,0]];for(const r of circles){const pts=[];for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*BALL_R*1.006,Math.sin(a)*BALL_R*1.006,0))}const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),groove);l.rotation.set(...r);root.add(l)}
 scene.add(root);const b={obj:root,active:true,held:false};balls.push(b);return b;
}
function spawnBalls(){balls.forEach(b=>scene.remove(b.obj));balls=[];for(let i=0;i<30;i++){let x,z,tries=0;do{x=(Math.random()*2-1)*4.6;z=(Math.random()*2-1)*5.1;tries++}while((Math.hypot(x-playerPos.x,z-playerPos.z)<1.5||balls.some(b=>b.obj.position.distanceTo(new THREE.Vector3(x,BALL_R,z))<.35))&&tries<80);createBall(new THREE.Vector3(x,BALL_R,z));}}
function addEvents(){
 addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
 renderer.domElement.addEventListener('pointerdown',e=>{if(!MOBILE&&gameStarted){lastPointer={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)}});
 renderer.domElement.addEventListener('pointermove',e=>{if(lastPointer&&!MOBILE&&gameStarted&&!flight){yaw-=(e.clientX-lastPointer.x)*.004;pitch-=(e.clientY-lastPointer.y)*.004;pitch=clamp(pitch,-Math.PI/2+.02,Math.PI/2-.02);lastPointer={x:e.clientX,y:e.clientY}}});
 addEventListener('pointerup',()=>lastPointer=null);addEventListener('keydown',e=>{if(e.code==='Space'&&gameStarted&&!MOBILE){e.preventDefault();shoot()}});
}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();screenAngle=(screen.orientation&&screen.orientation.angle||window.orientation||0)*Math.PI/180}
function eulerDevice(alpha,beta,gamma){const e=new THREE.Euler(beta*Math.PI/180,alpha*Math.PI/180,-gamma*Math.PI/180,'YXZ'),q=new THREE.Quaternion().setFromEuler(e),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-screenAngle);return q.multiply(q1).multiply(q0)}
function onOrientation(e){if(e.alpha==null)return;deviceQuat.copy(eulerDevice(e.alpha,e.beta||0,e.gamma||0));orientationBeta=e.beta;if(!initialQuat){initialQuat=deviceQuat.clone().invert();gyroReady=true}viewQuat.copy(initialQuat).multiply(deviceQuat);if(heldBall&&!flight&&lastBeta!=null){let d=(e.beta-lastBeta+540)%360-180;if(d>2.2)upImpulse+=d}lastBeta=e.beta}
function onMotion(e){if(!heldBall||flight)return;const r=e.rotationRate||{},a=e.acceleration||e.accelerationIncludingGravity||{};const energy=Math.abs(r.alpha||0)+Math.abs(r.beta||0)+Math.abs(r.gamma||0)+2*Math.max(0,-(a.y||0));if(energy>75)shoot();}
async function enableSensors(){
 let ok=true;try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')ok=(await DeviceOrientationEvent.requestPermission())==='granted';if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')ok=((await DeviceMotionEvent.requestPermission())==='granted')&&ok}catch(e){ok=false}
 if(ok){addEventListener('deviceorientation',onOrientation,true);addEventListener('devicemotion',onMotion,true);gyroEnabled=true}else{$('#permissionText').textContent='感測器權限未開啟，將使用觸控拖曳瞄準；點一下畫面投籃。';gyroEnabled=false;renderer.domElement.addEventListener('pointerup',()=>{if(heldBall&&!flight)shoot()});}
}
function startGame(){gameStarted=true;gameOver=false;score=0;shotCount=0;timeLeft=180;heldBall=null;flight=null;targetBall=null;playerPos.set(0,PLAYER_EYE,0);yaw=0;pitch=-.15;spawnBalls();$('#hud').classList.remove('hide');$('#rotateTip').textContent=MOBILE?(gyroEnabled?'轉動裝置瞄準，快速向上仰起投籃':'拖曳瞄準，點一下投籃'):'滑鼠拖曳瞄準，空白鍵投籃';clock.start();}
function cameraForward(){return new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize()}
function updateView(){if(flight)return;if(gyroEnabled&&gyroReady)camera.quaternion.copy(viewQuat);else camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));camera.position.copy(playerPos)}
function pickupLogic(dt){
 if(heldBall){heldBall.obj.position.copy(camera.position).add(cameraForward().multiplyScalar(.72));heldBall.obj.quaternion.copy(camera.quaternion);heldBall.obj.rotateY(dt*.8);if(upImpulse>2.2)shoot();upImpulse*=Math.pow(.1,dt);return}
 raycaster.setFromCamera(centerNDC,camera);const live=balls.filter(b=>b.active).map(b=>b.obj);const hit=raycaster.intersectObjects(live,true)[0];targetBall=hit?balls.find(b=>b.obj===hit.object.parent||b.obj===hit.object):null;
 if(targetBall){const p=targetBall.obj.position.clone(),flat=p.clone().sub(playerPos);flat.y=0;const dist=flat.length();if(dist>.62){playerPos.add(flat.normalize().multiplyScalar(Math.min(dist-.62,1.25*dt)));playerPos.x=clamp(playerPos.x,-4.85,4.85);playerPos.z=clamp(playerPos.z,-5.85,5.85)}const ndc=p.clone().project(camera),pxRadius=(BALL_R/Math.max(.12,p.distanceTo(camera.position)))*(innerHeight/(2*Math.tan(camera.fov*Math.PI/360))),reticlePx=Math.min(140,Math.max(92,.16*innerWidth))/2;if(pxRadius>=reticlePx*.95||dist<.7)pickup(targetBall)}
}
function pickup(b){heldBall=b;b.held=true;b.obj.traverse(o=>{if(o.material){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.5;o.material.depthWrite=false}});flashMessage('撿到球！瞄準籃框並投籃')}
function nearestHoop(pos){return hoops.reduce((a,h)=>h.center.distanceTo(pos)<a.center.distanceTo(pos)?h:a,hoops[0])}
function shoot(){if(!heldBall||flight||performance.now()-lastMotionShot<450)return;lastMotionShot=performance.now();const b=heldBall;heldBall=null;b.held=false;b.obj.traverse(o=>{if(o.material){o.material.transparent=false;o.material.opacity=1;o.material.depthWrite=true}});const target=nearestHoop(camera.position),fwd=cameraForward();const dist=target.center.distanceTo(camera.position);const speed=clamp(7.2+dist*.35,8,12.2);let velocity=fwd.multiplyScalar(speed);velocity.y=Math.max(4.8,velocity.y+5.6);flight={ball:b,velocity,target,start:b.obj.position.clone(),scored:false,lastY:b.obj.position.y,age:0};shotCount++;}
function updateFlight(dt){if(!flight)return;const f=flight,b=f.ball.obj;f.age+=dt;const to=f.target.center.clone().sub(b.position),horizontal=new THREE.Vector3(to.x,0,to.z);const magnetic=clamp(2.7+horizontal.length()*.2,2.7,5.2);f.velocity.add(horizontal.normalize().multiplyScalar(magnetic*dt));f.velocity.y+=clamp((f.target.center.y+.14-b.position.y)*.65,-.9,1.35)*dt;f.velocity.y-=9.81*dt;b.position.addScaledVector(f.velocity,dt);b.rotateX(f.velocity.length()*dt*2.2);b.rotateZ(dt*4);
 collide(f);
 const c=f.target.center;if(!f.scored&&f.lastY>c.y&&b.position.y<=c.y&&Math.hypot(b.position.x-c.x,b.position.z-c.z)<.21&&f.velocity.y<0){f.scored=true;const d=Math.hypot(f.start.x-c.x,f.start.z-c.z);const pts=d>5?3:2;score+=pts;f.target.flash=.35;flashMessage('進球！+'+pts+' 分')}
 f.lastY=b.position.y;
 const behind=f.velocity.clone().normalize().multiplyScalar(-.72);behind.y=.18;const desired=b.position.clone().add(behind);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(b.position.clone().add(f.velocity.clone().normalize().multiplyScalar(.8)));
 if(b.position.y<=BALL_R&&f.velocity.y<0||f.age>8){b.active=false;scene.remove(b);flight=null;targetBall=null;if(shotCount>=30)endGame();}
}
function collide(f){const p=f.ball.obj.position,v=f.velocity;for(const c of colliders){if(c.type==='box'){const q=p.clone().sub(c.obj.position),h=c.half;if(Math.abs(q.x)<h.x+BALL_R&&Math.abs(q.y)<h.y+BALL_R&&Math.abs(q.z)<h.z+BALL_R){const dx=h.x+BALL_R-Math.abs(q.x),dy=h.y+BALL_R-Math.abs(q.y),dz=h.z+BALL_R-Math.abs(q.z);let n;if(dx<dy&&dx<dz)n=new THREE.Vector3(Math.sign(q.x)||1,0,0);else if(dy<dz)n=new THREE.Vector3(0,Math.sign(q.y)||1,0);else n=new THREE.Vector3(0,0,Math.sign(q.z)||1);p.addScaledVector(n,Math.min(dx,dy,dz)+.003);if(v.dot(n)<0)v.reflect(n).multiplyScalar(c.bounce)}}else{if(p.y>c.y0&&p.y<c.y1){const d=new THREE.Vector2(p.x-c.obj.position.x,p.z-c.obj.position.z);if(d.length()<c.radius+BALL_R){d.normalize();const n=new THREE.Vector3(d.x,0,d.y);p.addScaledVector(n,c.radius+BALL_R-d.length()+.004);if(v.dot(n)<0)v.reflect(n).multiplyScalar(c.bounce)}}}}
}
function updateFlash(dt){for(const h of hoops){if(h.flash>0){h.flash-=dt;h.board.material.emissive.setHex(h.flash>0?0xffb300:0x000000);h.board.material.emissiveIntensity=h.flash>0?3:0}}}
function updateHud(){const s=Math.max(0,Math.ceil(timeLeft)),m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');$('#status').innerHTML=`玩家：${escapeHtml(playerName)}<br>得分：${score}　已投：${shotCount}/30<br>時間：${m}:${ss}`}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
let msgTimer;function flashMessage(t){const el=$('#message');el.textContent=t;el.style.opacity=1;clearTimeout(msgTimer);msgTimer=setTimeout(()=>el.style.opacity=0,1300)}
function endGame(){if(gameOver)return;gameOver=true;gameStarted=false;$('#summaryName').textContent='玩家：'+playerName;$('#summaryScore').textContent=score;$('#endModal').classList.remove('hide')}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);if(gameStarted&&!gameOver){if(!flight){updateView();pickupLogic(dt)}else updateFlight(dt);updateFlash(dt);timeLeft-=dt;if(timeLeft<=0)endGame();updateHud()}renderer.render(scene,camera)}
$('#continueBtn').addEventListener('click',()=>{playerName=$('#playerName').value.trim()||'一甲國小練習生';$('#nameModal').classList.add('hide');$('#startModal').classList.remove('hide');if(!renderer)init3D()});
$('#startBtn').addEventListener('click',async()=>{if(MOBILE)await enableSensors();$('#startModal').classList.add('hide');startGame()});
$('#restartBtn').addEventListener('click',()=>{location.reload()});
</script>
</body>
</html>
