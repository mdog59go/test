<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 籃球投籃特訓營 - 陀螺儀修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden; touch-action: none; }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 4px solid rgba(239, 68, 68, 0.9);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transition: border-color 0.2s ease, transform 0.1s ease;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            z-index: 20;
        }
        .crosshair::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: rgba(239, 68, 68, 0.95);
            border-radius: 50%;
        }
    </style>
</head>
<body class="relative w-screen h-screen select-none overflow-hidden bg-black">

    <!-- 三維畫布容器 -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

    <!-- 畫面中央瞄準紅圈 UI -->
    <div id="crosshair" class="crosshair hidden"></div>

    <!-- 頂部即時計分與資訊 UI -->
    <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none hidden z-10">
        <div class="bg-black/70 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg">
            <span class="text-xs text-slate-400 block">玩家</span>
            <span id="hud-name" class="font-bold text-lg text-amber-400">一甲國小練習生</span>
        </div>
        <div class="flex gap-3">
            <div class="bg-black/70 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                <span class="text-xs text-slate-400 block">總得分</span>
                <span id="hud-score" class="font-bold text-xl text-emerald-400">0</span>
            </div>
            <div class="bg-black/70 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                剩餘球數: <span id="hud-balls" class="font-bold text-cyan-400">30</span>/30
            </div>
            <div class="bg-black/70 backdrop-blur-md text-white px-4 py-2 rounded-xl border border-white/10 shadow-lg text-center">
                時間: <span id="hud-time" class="font-bold text-rose-400">03:00</span>
            </div>
        </div>
    </div>

    <!-- 提示訊息橫幅 -->
    <div id="message-banner" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full border border-white/20 text-sm shadow-xl hidden z-10 transition-opacity duration-300 text-center max-w-sm sm:max-w-md">
        尋找地面上的籃球，將紅圈對準即可自動靠近撿球！
    </div>

    <!-- 1. 開場姓名輸入 Modal -->
    <div id="name-modal" class="absolute inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <h1 class="text-3xl font-bold text-white tracking-wide">🏀 3D 籃球投籃特訓營</h1>
                <p class="text-slate-400 text-sm">請輸入您的姓名以開始挑戰</p>
            </div>
            <div>
                <input type="text" id="player-name-input" value="一甲國小練習生" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-amber-500 text-center text-lg font-semibold" placeholder="輸入姓名...">
            </div>
            <button id="start-name-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                確認進入遊戲
            </button>
        </div>
    </div>

    <!-- 2. 行動裝置感測器授權 Modal -->
    <div id="permission-modal" class="absolute inset-0 bg-black/95 flex items-center justify-center z-40 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <div class="text-5xl mb-2">📱</div>
                <h2 class="text-2xl font-bold text-white">啟用陀螺儀與體感控制</h2>
                <p class="text-slate-400 text-sm">請點擊下方按鈕授權 DeviceOrientation 與 Motion 權限。遊戲開始時請將裝置正面面向畫面上方作為基準。</p>
            </div>
            <button id="request-perm-btn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                授權並開始遊戲
            </button>
        </div>
    </div>

    <!-- 3. 遊戲結算畫面 Modal -->
    <div id="gameover-modal" class="absolute inset-0 bg-black/95 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="space-y-2">
                <div class="text-5xl mb-2">🏆</div>
                <h2 class="text-3xl font-bold text-white">訓練結算報告</h2>
                <p class="text-slate-400 text-sm">表現優異！以下是您的訓練成果</p>
            </div>
            <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/50 space-y-3">
                <div class="flex justify-between text-slate-300">
                    <span>練習生姓名:</span>
                    <span id="final-name" class="font-bold text-amber-400">--</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>最終總得分:</span>
                    <span id="final-score" class="font-bold text-2xl text-emerald-400">0</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>投進球數:</span>
                    <span id="final-balls-scored" class="font-bold text-cyan-400">0 / 30</span>
                </div>
            </div>
            <button id="restart-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg">
                重新開始訓練
            </button>
        </div>
    </div>

    <script>
        // --- 全域狀態變數 ---
        let scene, camera, renderer;
        let playerName = "一甲國小練習生";
        let score = 0;
        let ballsRemaining = 30;
        let ballsScoredCount = 0;
        let timeLeft = 180;
        let gameActive = false;
        let timerInterval = null;

        // 裝置與控制狀態
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        let controlsMode = isMobile ? 'gyro' : 'mouse';
        let isHoldingBall = false;
        let heldBallMesh = null;
        let ballsOnCourt = [];
        let flyingBall = null;

        // 滑鼠控制
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        // 陀螺儀強化架構變數
        let gyroCalibrated = false;
        let baseAlpha = 0;
        let baseBeta = 0;
        let lastBeta = null;
        let lastMotionTime = 0;
        const ZEE = new THREE.Vector3(0, 0, 1);
        const Q0 = new THREE.Quaternion();
        const EulerOrder = 'YXZ';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initUIEvents();
        });

        function initUIEvents() {
            const startNameBtn = document.getElementById('start-name-btn');
            const nameModal = document.getElementById('name-modal');
            const permissionModal = document.getElementById('permission-modal');
            const requestPermBtn = document.getElementById('request-perm-btn');
            const restartBtn = document.getElementById('restart-btn');
            const gameOverModal = document.getElementById('gameover-modal');

            startNameBtn.addEventListener('click', () => {
                const inputVal = document.getElementById('player-name-input').value.trim();
                if (inputVal) playerName = inputVal;
                document.getElementById('hud-name').textContent = playerName;
                nameModal.classList.add('hidden');

                if (isMobile) {
                    permissionModal.classList.remove('hidden');
                } else {
                    startGameSession();
                }
            });

            requestPermBtn.addEventListener('click', async () => {
                let orientationGranted = false;
                let motionGranted = false;

                // 1. DeviceOrientation 授權
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const state = await DeviceOrientationEvent.requestPermission();
                        orientationGranted = (state === 'granted');
                    } catch (e) { console.error('DeviceOrientation permission error:', e); }
                } else {
                    orientationGranted = true;
                }

                // 2. DeviceMotion 授權
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const state = await DeviceMotionEvent.requestPermission();
                        motionGranted = (state === 'granted');
                    } catch (e) { console.error('DeviceMotion permission error:', e); }
                } else {
                    motionGranted = true;
                }

                permissionModal.classList.add('hidden');
                startGameSession();
            });

            restartBtn.addEventListener('click', () => {
                gameOverModal.classList.add('hidden');
                resetGame();
            });
        }

        function startGameSession() {
            gameActive = true;
            gyroCalibrated = false; // 重置校準標記

            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            document.getElementById('message-banner').classList.remove('hidden');

            initThreeJS();
            initControls();
            startTimer();
            animate();
        }

        function startTimer() {
            timeLeft = 180;
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0 || ballsRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('hud-time').textContent = `${mins}:${secs}`;
        }

        function updateHUD() {
            document.getElementById('hud-score').textContent = score;
            document.getElementById('hud-balls').textContent = ballsRemaining;
        }

        // --- Three.js 3D 場景繪製 ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 光源 setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.85);
            dirLight.position.set(0, 15, 0);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createEnvironment();
            createHoops();
            spawnBalls();

            window.addEventListener('resize', onWindowResize);
        }

        // 深藍色球場與草地外圍
        function createEnvironment() {
            // 綠草地外圍
            const grassGeo = new THREE.PlaneGeometry(40, 40);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x13381a, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.receiveShadow = true;
            scene.add(grass);

            // 10m x 12m 極深藍色球場 (`#030f26`)
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1228;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#030f26';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 10;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

            // 中場線與圓圈
            ctx.beginPath();
            ctx.moveTo(50, canvas.height / 2);
            ctx.lineTo(canvas.width - 50, canvas.height / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 120, 0, Math.PI * 2);
            ctx.stroke();

            // 兩端禁區
            ctx.strokeRect(canvas.width / 2 - 180, 50, 360, 300);
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 350, 180, 0, Math.PI, false);
            ctx.stroke();

            ctx.strokeRect(canvas.width / 2 - 180, canvas.height - 350, 360, 300);
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 350, 180, Math.PI, Math.PI * 2, false);
            ctx.stroke();

            // 5m 三分線 (轉換為畫布像素約 510px)
            const threePtRadius = 510;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 50, threePtRadius, 0.15 * Math.PI, 0.85 * Math.PI, false);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 50, threePtRadius, 1.15 * Math.PI, 1.85 * Math.PI, false);
            ctx.stroke();

            const courtTexture = new THREE.CanvasTexture(canvas);
            const courtGeo = new THREE.PlaneGeometry(10, 12);
            const courtMat = new THREE.MeshStandardMaterial({ map: courtTexture, roughness: 0.5 });
            const court = new THREE.Mesh(courtGeo, courtMat);
            court.rotation.x = -Math.PI / 2;
            court.position.y = 0.01;
            court.receiveShadow = true;
            scene.add(court);
        }

        // 籃框與籃板建構 (2.5m 離地高度)
        let hoops = [];
        function createHoops() {
            hoops = [];
            createSingleHoop(0, 2.5, -5.9, 0);
            createSingleHoop(0, 2.5, 5.9, Math.PI);
        }

        function createSingleHoop(x, y, z, rotationY) {
            const hoopGroup = new THREE.Group();
            hoopGroup.position.set(x, 0, z);
            hoopGroup.rotation.y = rotationY;

            // 柱子
            const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.5, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, 1.25, -0.4);
            hoopGroup.add(pole);

            // 籃板
            const boardCanvas = document.createElement('canvas');
            boardCanvas.width = 512;
            boardCanvas.height = 340;
            const bCtx = boardCanvas.getContext('2d');
            bCtx.fillStyle = '#ffffff';
            bCtx.fillRect(0, 0, 512, 340);
            bCtx.strokeStyle = '#ef4444';
            bCtx.lineWidth = 16;
            bCtx.strokeRect(10, 10, 492, 320);
            bCtx.strokeRect(180, 180, 152, 110);
            bCtx.beginPath();
            bCtx.arc(256, 235, 30, 0, Math.PI * 2);
            bCtx.stroke();

            const boardTexture = new THREE.CanvasTexture(boardCanvas);
            const boardGeo = new THREE.BoxGeometry(1.5, 1.0, 0.08);
            const boardMat = new THREE.MeshStandardMaterial({ map: boardTexture, roughness: 0.3 });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, 2.7, -0.2);
            board.castShadow = true;
            hoopGroup.add(board);

            // 橘紅籃圈
            const rimGeo = new THREE.TorusGeometry(0.23, 0.02, 16, 32);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4500, metalness: 0.7 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(0, 2.38, 0.25);
            hoopGroup.add(rim);

            // 白色籃網
            const netGeo = new THREE.ConeGeometry(0.23, 0.35, 16, 4, true);
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.7 });
            const net = new THREE.Mesh(netGeo, netMat);
            net.position.set(0, 2.18, 0.25);
            hoopGroup.add(net);

            const hoopCenterWorld = new THREE.Vector3(x, 2.38, z + 0.25);
            hoops.push({ group: hoopGroup, center: hoopCenterWorld, boardMesh: board });

            scene.add(hoopGroup);
        }

        // 產生 30 顆籃球
        function spawnBalls() {
            ballsOnCourt = [];
            const ballCanvas = document.createElement('canvas');
            ballCanvas.width = 512;
            ballCanvas.height = 256;
            const bCtx = ballCanvas.getContext('2d');
            bCtx.fillStyle = '#ff5722';
            bCtx.fillRect(0, 0, 512, 256);
            bCtx.strokeStyle = '#1a1a1a';
            bCtx.lineWidth = 12;
            bCtx.beginPath();
            bCtx.moveTo(0, 128); bCtx.lineTo(512, 128);
            bCtx.moveTo(256, 0); bCtx.lineTo(256, 256);
            bCtx.stroke();

            const ballTexture = new THREE.CanvasTexture(ballCanvas);
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ map: ballTexture, roughness: 0.5 });

            for (let i = 0; i < 30; i++) {
                const ballMesh = new THREE.Mesh(ballGeo, ballMat);
                const rx = (Math.random() - 0.5) * 8.5;
                const rz = (Math.random() - 0.5) * 8.5;
                ballMesh.position.set(rx, 0.24, rz);
                ballMesh.castShadow = true;
                scene.add(ballMesh);

                ballsOnCourt.push({ mesh: ballMesh, id: i });
            }
        }

        // --- 視角與操控核心 (陀螺儀修復與 PC 滑鼠) ---
        function initControls() {
            if (controlsMode === 'gyro') {
                // 優先監聽 deviceorientation與 deviceorientationabsolute
                window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
                window.addEventListener('deviceorientation', handleDeviceOrientation, true);
                window.addEventListener('devicemotion', handleDeviceMotion, true);
            } else {
                // PC 滑鼠拖曳模式
                const dom = renderer.domElement;
                dom.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    cameraEuler.y -= deltaX * 0.0035;
                    cameraEuler.x -= deltaY * 0.0035;
                    cameraEuler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraEuler.x));

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('mouseup', () => { isDragging = false; });

                // 空白鍵投籃
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        triggerShoot();
                    }
                });
            }
        }

        // 100% 正確的陀螺儀 360 度姿態轉換與校準
        function handleDeviceOrientation(event) {
            if (!gameActive) return;

            let alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            let beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            let gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            // 首次讀取姿態校準 Zero-Offset
            if (!gyroCalibrated) {
                baseAlpha = alpha;
                baseBeta = beta;
                gyroCalibrated = true;
            }

            // 校準相對角度
            alpha -= baseAlpha;

            // 建構正統的三維旋轉四元數
            const euler = new THREE.Euler();
            euler.set(beta, alpha, -gamma, 'YXZ');

            const gyroQ = new THREE.Quaternion();
            gyroQ.setFromEuler(euler);

            // 螢幕轉向補償 (Landscape / Portrait)
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            const screenQ = new THREE.Quaternion();
            screenQ.setFromAxisAngle(ZEE, -orient);

            gyroQ.multiply(screenQ);

            // 修正為正面直覺 360 度檢視
            const fixQ = new THREE.Quaternion();
            fixQ.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
            gyroQ.multiply(fixQ);

            // 平滑插值套用至相機
            camera.quaternion.slerp(gyroQ, 0.25);

            // 記錄 beta 變化率供甩動輔助判定
            if (lastBeta !== null && isHoldingBall) {
                const betaDelta = (event.beta - lastBeta);
                if (betaDelta > 12) { // 快速向上仰起動作
                    triggerShoot();
                }
            }
            lastBeta = event.beta;
        }

        // 雙重閾值靈敏甩動/投籃感測
        function handleDeviceMotion(event) {
            if (!gameActive || !isHoldingBall) return;
            const now = Date.now();
            if (now - lastMotionTime < 450) return; // 冷卻時間

            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc) return;

            // 計算合加速度向量強度
            const accMag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);

            // 計算角速度強度 (若裝置支援)
            const rot = event.rotationRate;
            const rotMag = rot ? Math.sqrt((rot.alpha || 0) ** 2 + (rot.beta || 0) ** 2 + (rot.gamma || 0) ** 2) : 0;

            // 快速向上甩動觸發條件 (加速度突波 > 16.0 或 角速度突波 > 150)
            if (accMag > 16.0 || rotMag > 150) {
                lastMotionTime = now;
                triggerShoot();
            }
        }

        // --- 核心遊戲動態迴圈 ---
        const clock = new THREE.Clock();

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            // 若為 PC 滑鼠控制
            if (controlsMode === 'mouse') {
                camera.quaternion.setFromEuler(cameraEuler);
            }

            // 1. 自動靠近與撿球
            updateAutoPickup(dt);

            // 2. 飛行中的球物理與磁吸導向
            updateFlyingBall(dt);

            // 3. 持球狀態下球體轉動
            if (isHoldingBall && heldBallMesh) {
                heldBallMesh.rotation.y += dt * 2.5;
            }

            renderer.render(scene, camera);
        }

        // 自動靠近與撿球判定
        function updateAutoPickup(dt) {
            if (isHoldingBall || flyingBall) {
                document.getElementById('message-banner').classList.add('hidden');
                return;
            }

            const rayDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            let closestBall = null;
            let minAngle = 0.38; // ~22 度瞄準寬容容許值

            ballsOnCourt.forEach(ballObj => {
                const ballPos = ballObj.mesh.position;
                const toBall = new THREE.Vector3().subVectors(ballPos, camera.position);
                const dist = toBall.length();
                toBall.normalize();

                const angle = rayDir.angleTo(toBall);
                if (angle < minAngle && dist < 12) {
                    minAngle = angle;
                    closestBall = ballObj;
                }
            });

            if (closestBall) {
                document.getElementById('message-banner').classList.remove('hidden');
                document.getElementById('message-banner').textContent = `正在靠近籃球... 距離: ${closestBall.mesh.position.distanceTo(camera.position).toFixed(1)}m`;

                const targetPos = closestBall.mesh.position.clone();
                targetPos.y = camera.position.y;
                camera.position.lerp(targetPos, dt * 2.8);

                // 當球距離足夠近時撿起
                if (camera.position.distanceTo(closestBall.mesh.position) < 1.45) {
                    pickupBall(closestBall);
                }
            } else {
                document.getElementById('message-banner').classList.add('hidden');
            }
        }

        // 撿起籃球與畫面正中央對齊
        function pickupBall(ballObj) {
            scene.remove(ballObj.mesh);
            ballsOnCourt = ballsOnCourt.filter(b => b.id !== ballObj.id);

            isHoldingBall = true;
            document.getElementById('message-banner').classList.remove('hidden');
            document.getElementById('message-banner').textContent = '已持球！對準籃框並向上甩動手機（或按空白鍵）投籃！';

            // 建立 50% 半透明的持球 Mesh
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = ballObj.mesh.material.clone();
            ballMat.transparent = true;
            ballMat.opacity = 0.5;

            heldBallMesh = new THREE.Mesh(ballGeo, ballMat);

            // 將持球直接 attach 至 camera 的子空間，精準對齊畫面正中央與紅圈 (X=0, Y=-0.05, Z=-0.75)
            heldBallMesh.position.set(0, -0.05, -0.75);
            camera.add(heldBallMesh);
        }

        function triggerShoot() {
            if (!isHoldingBall || flyingBall) return;

            isHoldingBall = false;
            if (heldBallMesh) {
                // 投籃時自相機節點中移除並轉換至世界座標
                camera.remove(heldBallMesh);
                heldBallMesh = null;
            }

            const shootPos = camera.position.clone();
            const shootDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xff5722, roughness: 0.5 });
            const ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.position.copy(shootPos).add(shootDir.clone().multiplyScalar(0.8));
            ballMesh.castShadow = true;
            scene.add(ballMesh);

            let nearestHoop = hoops[0];
            let minDist = 999;
            hoops.forEach(h => {
                const d = ballMesh.position.distanceTo(h.center);
                if (d < minDist) {
                    minDist = d;
                    nearestHoop = h;
                }
            });

            // 給予拋物線初速度
            const initialVelocity = shootDir.clone().multiplyScalar(11.5).add(new THREE.Vector3(0, 5.8, 0));

            flyingBall = {
                mesh: ballMesh,
                velocity: initialVelocity,
                targetHoop: nearestHoop,
                shotOrigin: shootPos.clone(),
                hasScored: false
            };

            document.getElementById('message-banner').textContent = '球已投出！正在追蹤飛行軌跡...';
        }

        function updateFlyingBall(dt) {
            if (!flyingBall) return;

            const ball = flyingBall.mesh;
            const vel = flyingBall.velocity;

            // 重力
            vel.y -= 9.8 * dt;
            ball.position.addScaledVector(vel, dt);
            ball.rotation.x += dt * 6;

            // 微弱全程磁吸修正
            const hoopCenter = flyingBall.targetHoop.center;
            const toHoop = new THREE.Vector3().subVectors(hoopCenter, ball.position);
            const distToHoop = toHoop.length();

            if (distToHoop < 5.8 && vel.y < 2.5) {
                toHoop.normalize();
                vel.addScaledVector(toHoop, dt * 11.0);
            }

            // 動態鏡頭跟隨球體正後方
            const followOffset = new THREE.Vector3(0, 0.75, 1.7);
            const targetCamPos = ball.position.clone().add(followOffset);
            camera.position.lerp(targetCamPos, dt * 8);
            camera.lookAt(ball.position);

            // 籃板反彈碰撞
            const boardWorldPos = new THREE.Vector3();
            flyingBall.targetHoop.boardMesh.getWorldPosition(boardWorldPos);

            if (Math.abs(ball.position.z - boardWorldPos.z) < 0.28 && 
                Math.abs(ball.position.x - boardWorldPos.x) < 0.82 && 
                Math.abs(ball.position.y - boardWorldPos.y) < 0.6) {
                vel.z *= -0.55;
                vel.x *= 0.75;
            }

            // 進球判定
            if (!flyingBall.hasScored && 
                Math.abs(ball.position.x - hoopCenter.x) < 0.32 && 
                Math.abs(ball.position.z - hoopCenter.z) < 0.32 && 
                Math.abs(ball.position.y - hoopCenter.y) < 0.22) {
                
                flyingBall.hasScored = true;
                ballsScoredCount++;

                const distFromOrigin = flyingBall.shotOrigin.distanceTo(hoopCenter);
                const points = distFromOrigin > 5.0 ? 3 : 2;
                score += points;
                updateHUD();

                flashBoard(flyingBall.targetHoop);
                document.getElementById('message-banner').textContent = `🎉 進球得分！ +${points} 分 (${points === 3 ? '三分外線！' : '兩分禁區！'})`;
            }

            // 落地銷毀與視角重置
            if (ball.position.y <= 0.24 || ball.position.y < -1) {
                scene.remove(ball);
                flyingBall = null;
                ballsRemaining--;
                updateHUD();

                resetCameraView();

                if (ballsRemaining <= 0) {
                    endGame();
                }
            }
        }

        // 籃板金黃閃爍效果
        function flashBoard(hoop) {
            const board = hoop.boardMesh;
            const origColor = board.material.color.clone();
            board.material.color.set(0xffd700);
            setTimeout(() => {
                board.material.color.copy(origColor);
            }, 400);
        }

        // 視角重置
        function resetCameraView() {
            camera.position.set(0, 1.6, 5);
            cameraEuler.set(0, 0, 0);
            if (controlsMode === 'mouse') {
                camera.quaternion.setFromEuler(cameraEuler);
            }
        }

        function endGame() {
            gameActive = false;
            if (timerInterval) clearInterval(timerInterval);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('crosshair').classList.add('hidden');
            document.getElementById('message-banner').classList.add('hidden');

            document.getElementById('final-name').textContent = playerName;
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-balls-scored').textContent = `${ballsScoredCount} / 30`;

            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            ballsRemaining = 30;
            ballsScoredCount = 0;
            updateHUD();

            ballsOnCourt.forEach(b => scene.remove(b.mesh));
            ballsOnCourt = [];
            if (flyingBall) {
                scene.remove(flyingBall.mesh);
                flyingBall = null;
            }
            if (heldBallMesh) {
                camera.remove(heldBallMesh);
                heldBallMesh = null;
            }
            isHoldingBall = false;

            spawnBalls();
            resetCameraView();
            startGameSession();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
