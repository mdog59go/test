<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D 體感籃球大挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 瞄準紅圈 UI */
        #crosshair {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 3.5px solid rgba(255, 50, 50, 0.85);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.2s;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 50, 50, 0.9);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
        }

        #crosshair.holding {
            border-color: rgba(50, 255, 100, 0.9);
            box-shadow: 0 0 20px rgba(50, 255, 100, 0.6), inset 0 0 10px rgba(50, 255, 100, 0.4);
        }

        #crosshair.holding::before, #crosshair.holding::after {
            background-color: rgba(50, 255, 100, 0.9);
        }

        #crosshair.approaching {
            border-color: rgba(255, 165, 0, 0.9);
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* 遊戲抬頭顯示器 (HUD) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .hud-title {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 24px;
            color: #ff9d00;
        }

        /* 提示文字 */
        #status-msg {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        /* 彈出視窗 Modal 通用樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #121824;
            border: 2px solid #ff9d00;
            border-radius: 20px;
            padding: 30px 40px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(255, 157, 0, 0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            margin-bottom: 15px;
            color: #ff9d00;
        }

        .modal-desc {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a2233;
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #ff9d00;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff9d00, #ff5500);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 85, 0, 0.4);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        .score-row span:last-child {
            color: #ff9d00;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 瞄準紅圈 -->
    <div id="crosshair"></div>

    <!-- 抬頭顯示器 (HUD) -->
    <div id="hud">
        <div class="hud-card">
            <div class="hud-title">球員</div>
            <div id="hud-name">一甲國小練習生</div>
        </div>
        <div class="hud-card" style="text-align: center;">
            <div class="hud-title">剩餘時間</div>
            <div id="hud-timer" class="hud-value">03:00</div>
        </div>
        <div class="hud-card" style="text-align: right;">
            <div class="hud-title">總得分 / 球數</div>
            <div><span id="hud-score" class="hud-value">0</span> <span style="font-size: 14px; color: #888;">PTS</span></div>
            <div style="font-size: 12px; color: #aaa; margin-top: 2px;">剩餘球數: <span id="hud-balls" style="color:#fff;">30</span>/30</div>
        </div>
    </div>

    <!-- 底部狀態提示語 -->
    <div id="status-msg">請滑動畫面或移動視角，將瞄準圈對準地上的籃球</div>

    <!-- Modal 1: 姓名輸入 -->
    <div id="modal-name" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">🏀 3D 體感籃球賽</div>
            <div class="modal-desc">請輸入您的挑戰者姓名：</div>
            <input type="text" id="input-player-name" class="modal-input" value="一甲國小練習生" maxlength="12">
            <button id="btn-start-name" class="btn-primary">進入遊戲</button>
        </div>
    </div>

    <!-- Modal 2: iOS 陀螺儀授權 (僅行動裝置顯示) -->
    <div id="modal-auth" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-title">📱 裝置體感授權</div>
            <div class="modal-desc">
                本遊戲支援陀螺儀全視角旋轉與向上甩動投籃。<br>
                點擊下方按鈕以允許感測器運作。
            </div>
            <button id="btn-grant-sensors" class="btn-primary">開始授權並挑戰</button>
        </div>
    </div>

    <!-- Modal 3: 遊戲結算 -->
    <div id="modal-result" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-title">🏆 比賽結束</div>
            <div style="margin: 20px 0;">
                <div class="score-row"><span>挑戰選手：</span><span id="res-name">一甲國小練習生</span></div>
                <div class="score-row"><span>最終總得分：</span><span id="res-score" style="font-size: 24px;">0 分</span></div>
                <div class="score-row"><span>使用球數：</span><span id="res-balls">0 / 30</span></div>
            </div>
            <button id="btn-restart" class="btn-primary">重新挑戰</button>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /**
         * 3D 籃球遊戲 - 全視角無鎖定版本
         */
        
        // 遊戲設定參數
        const CONFIG = {
            courtWidth: 10,
            courtLength: 12,
            rimHeight: 2.5,
            rimZ: -5.5, // 前方主要目標籃框 (Z負方向)
            threePointRadius: 5.0,
            totalBalls: 30,
            gameDuration: 180, // 3分鐘
            jogSpeed: 4.2      // 慢跑靠近球速度
        };

        let gameState = {
            playerName: "一甲國小練習生",
            score: 0,
            ballsLeft: CONFIG.totalBalls,
            timeLeft: CONFIG.gameDuration,
            isGameActive: false,
            isHoldingBall: false,
            isBallInFlight: false,
            timerInterval: null,
            isMobile: false
        };

        // Three.js 核心組件
        let scene, camera, renderer;
        let ballsArray = [];
        let activeBallMesh = null;
        let activeBallPhysics = { vel: new THREE.Vector3(), active: false, is3Point: false, hasScored: false };
        let frontRimMesh, frontBoardMesh, frontRimLight;
        let heldBallDisplayMesh;

        // 視角控制變數 - 無任何限制的 360 度 Pitch / Yaw 歐拉旋轉
        let cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isPointerDown = false;
        let prevPointerPos = { x: 0, y: 0 };
        
        let playerPos = new THREE.Vector3(0, 1.6, 5);
        let targetApproachBall = null;

        // 體感甩動感應變數
        let lastMotionTime = 0;
        let lastBeta = 0;

        // DOM 引用
        const hudName = document.getElementById('hud-name');
        const hudTimer = document.getElementById('hud-timer');
        const hudScore = document.getElementById('hud-score');
        const hudBalls = document.getElementById('hud-balls');
        const statusMsg = document.getElementById('status-msg');
        const crosshair = document.getElementById('crosshair');

        window.addEventListener('load', () => {
            checkMobile();
            initThreeJS();
            setupEventListeners();
        });

        function checkMobile() {
            gameState.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 黑色夜空背景

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.rotation.order = 'YXZ';
            camera.position.copy(playerPos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            createOuterGround();
            createBasketballCourt();
            createHoops();
            createHeldBallDisplay();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 外部綠色草地
        function createOuterGround() {
            const grassGeo = new THREE.PlaneGeometry(80, 80);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x113311, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = -0.01;
            grass.receiveShadow = true;
            scene.add(grass);
        }

        // 10m x 12m 深藍色球場 (#030f26) 與白色標線
        function createBasketballCourt() {
            const courtGroup = new THREE.Group();

            const courtGeo = new THREE.PlaneGeometry(CONFIG.courtWidth, CONFIG.courtLength);
            const courtMat = new THREE.MeshStandardMaterial({ color: 0x030f26, roughness: 0.4, metalness: 0.1 });
            const court = new THREE.Mesh(courtGeo, courtMat);
            court.rotation.x = -Math.PI / 2;
            court.receiveShadow = true;
            courtGroup.add(court);

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1228;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#030f26';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 14;

            // 外圍邊線
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            // 中線
            ctx.beginPath();
            ctx.moveTo(20, canvas.height / 2);
            ctx.lineTo(canvas.width - 20, canvas.height / 2);
            ctx.stroke();

            // 中場圓圈
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 85, 0, Math.PI * 2);
            ctx.stroke();

            // 5m 三分線弧線
            const r3p = (CONFIG.threePointRadius / CONFIG.courtLength) * canvas.height;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 20, r3p, 0, Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height - 20, r3p, Math.PI, Math.PI * 2);
            ctx.stroke();

            // 禁區框線
            const keyW = (3.6 / CONFIG.courtWidth) * canvas.width;
            const keyH = (4.0 / CONFIG.courtLength) * canvas.height;
            ctx.strokeRect((canvas.width - keyW) / 2, 20, keyW, keyH);
            ctx.strokeRect((canvas.width - keyW) / 2, canvas.height - 20 - keyH, keyW, keyH);

            const lineTexture = new THREE.CanvasTexture(canvas);
            const lineMat = new THREE.MeshBasicMaterial({ map: lineTexture, transparent: true });
            const linePlane = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.courtWidth, CONFIG.courtLength), lineMat);
            linePlane.rotation.x = -Math.PI / 2;
            linePlane.position.y = 0.005;
            courtGroup.add(linePlane);

            scene.add(courtGroup);
        }

        // 籃框與籃板設定
        function createHoops() {
            function buildHoop(zPos, isFront) {
                const hoopGroup = new THREE.Group();
                hoopGroup.position.set(0, 0, zPos);
                if (!isFront) hoopGroup.rotation.y = Math.PI;

                const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.5, 16);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
                const pole = new THREE.Mesh(poleGeo, poleMat);
                pole.position.set(0, 1.75, -0.6);
                hoopGroup.add(pole);

                const boardGeo = new THREE.BoxGeometry(1.8, 1.05, 0.05);
                const bCanvas = document.createElement('canvas');
                bCanvas.width = 512;
                bCanvas.height = 300;
                const bCtx = bCanvas.getContext('2d');
                bCtx.fillStyle = '#ffffff';
                bCtx.fillRect(0, 0, 512, 300);
                bCtx.strokeStyle = '#ff2200';
                bCtx.lineWidth = 16;
                bCtx.strokeRect(10, 10, 492, 280);
                bCtx.strokeRect(180, 140, 152, 110);

                const boardTex = new THREE.CanvasTexture(bCanvas);
                const boardMat = new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.3 });
                const board = new THREE.Mesh(boardGeo, boardMat);
                board.position.set(0, 2.7, -0.025);
                hoopGroup.add(board);

                const rimGeo = new THREE.TorusGeometry(0.23, 0.02, 16, 32);
                const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4500, metalness: 0.6, roughness: 0.3 });
                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.x = Math.PI / 2;
                rim.position.set(0, CONFIG.rimHeight, 0.23);
                hoopGroup.add(rim);

                const netGeo = new THREE.CylinderGeometry(0.23, 0.15, 0.4, 12, 1, true);
                const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.7 });
                const net = new THREE.Mesh(netGeo, netMat);
                net.position.set(0, CONFIG.rimHeight - 0.2, 0.23);
                hoopGroup.add(net);

                // 得分金色亮光
                const light = new THREE.PointLight(0xffd700, 0, 6);
                light.position.set(0, CONFIG.rimHeight + 0.3, 0.23);
                hoopGroup.add(light);

                scene.add(hoopGroup);

                if (isFront) {
                    frontRimMesh = rim;
                    frontBoardMesh = board;
                    frontRimLight = light;
                }
            }

            buildHoop(-CONFIG.courtLength / 2, true);
            buildHoop(CONFIG.courtLength / 2, false);
        }

        // 玩家手中的 50% 半透明旋轉球
        function createHeldBallDisplay() {
            const ballGeo = new THREE.SphereGeometry(0.22, 32, 32);
            const ballMat = createBasketballMaterial();
            ballMat.transparent = true;
            ballMat.opacity = 0.5;

            heldBallDisplayMesh = new THREE.Mesh(ballGeo, ballMat);
            heldBallDisplayMesh.visible = false;
            scene.add(heldBallDisplayMesh);
        }

        function createBasketballMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#d9531e';
            ctx.fillRect(0, 0, 512, 256);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 8;

            ctx.beginPath();
            ctx.moveTo(0, 128); ctx.lineTo(512, 128);
            ctx.moveTo(256, 0); ctx.lineTo(256, 256);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(128, 128, 90, 0, Math.PI * 2);
            ctx.arc(384, 128, 90, 0, Math.PI * 2);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6, metalness: 0.1 });
        }

        // 生成 30 顆散落在場地上的籃球
        function spawnFieldBalls() {
            ballsArray.forEach(b => scene.remove(b));
            ballsArray = [];

            const ballGeo = new THREE.SphereGeometry(0.22, 32, 32);
            const ballMat = createBasketballMaterial();

            for (let i = 0; i < CONFIG.totalBalls; i++) {
                const mesh = new THREE.Mesh(ballGeo, ballMat);
                const rx = (Math.random() - 0.5) * (CONFIG.courtWidth - 1.5);
                const rz = (Math.random() - 0.5) * (CONFIG.courtLength * 0.75);
                mesh.position.set(rx, 0.22, rz);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                scene.add(mesh);
                ballsArray.push(mesh);
            }
        }

        // --- 視角旋轉與事件控制（完全解鎖視角限制） ---
        function setupEventListeners() {
            document.getElementById('btn-start-name').addEventListener('click', () => {
                const nameInput = document.getElementById('input-player-name').value.trim();
                if (nameInput) gameState.playerName = nameInput;
                hudName.textContent = gameState.playerName;

                document.getElementById('modal-name').classList.add('hidden');

                if (gameState.isMobile) {
                    document.getElementById('modal-auth').classList.remove('hidden');
                } else {
                    startGame();
                }
            });

            document.getElementById('btn-grant-sensors').addEventListener('click', () => {
                requestDeviceSensors();
            });

            document.getElementById('btn-restart').addEventListener('click', () => {
                document.getElementById('modal-result').classList.add('hidden');
                resetGame();
                startGame();
            });

            // 滑鼠與觸控通用拖拽旋轉視角 (對應直覺方向: 向右拖視角向右)
            const handlePointerDown = (x, y) => {
                if (!gameState.isGameActive) return;
                isPointerDown = true;
                prevPointerPos = { x, y };
            };

            const handlePointerMove = (x, y) => {
                if (!isPointerDown || !gameState.isGameActive) return;
                const deltaX = x - prevPointerPos.x;
                const deltaY = y - prevPointerPos.y;

                // 直覺方向對應：drag right -> yaw decreases (look right)
                cameraEuler.y -= deltaX * 0.004;
                cameraEuler.x -= deltaY * 0.004; 
                // ⭐ 絕對不設置限制角，支援完整自由 360 度旋轉

                prevPointerPos = { x, y };
            };

            const handlePointerEnd = () => { isPointerDown = false; };

            window.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', handlePointerEnd);

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchend', handlePointerEnd);

            // PC 空白鍵投籃
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && gameState.isGameActive && gameState.isHoldingBall && !gameState.isBallInFlight) {
                    e.preventDefault();
                    shootBall(14.5);
                }
            });
        }

        function requestDeviceSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            bindMobileSensors();
                            document.getElementById('modal-auth').classList.add('hidden');
                            startGame();
                        } else {
                            alert('需要授權感測器以進行體感操控。');
                        }
                    })
                    .catch(console.error);
            } else {
                bindMobileSensors();
                document.getElementById('modal-auth').classList.add('hidden');
                startGame();
            }
        }

        function bindMobileSensors() {
            // 陀螺儀轉動視角 (僅在未進行手勢觸控時輔助)
            window.addEventListener('deviceorientation', (e) => {
                if (!gameState.isGameActive || isPointerDown) return;

                const gamma = e.gamma || 0;
                const beta = e.beta || 0;

                // 自由轉動映射 (不鎖定角度)
                cameraEuler.y = THREE.MathUtils.degToRad(-gamma * 1.5);
                cameraEuler.x = THREE.MathUtils.degToRad((beta - 45) * 1.2);
            }, true);

            // 行動裝置向上甩動投籃
            window.addEventListener('devicemotion', (e) => {
                if (!gameState.isGameActive || !gameState.isHoldingBall || gameState.isBallInFlight) return;
                const acc = e.accelerationIncludingGravity;
                if (!acc) return;
                
                const now = Date.now();
                if (now - lastMotionTime > 100) {
                    const accMagnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                    if (accMagnitude > 20) {
                        shootBall(Math.min(24, accMagnitude * 0.75));
                        lastMotionTime = now;
                    }
                }
            }, true);
        }

        function startGame() {
            gameState.isGameActive = true;
            startTimer();
            spawnFieldBalls();
            updateHUD();
        }

        function resetGame() {
            gameState.score = 0;
            gameState.ballsLeft = CONFIG.totalBalls;
            gameState.timeLeft = CONFIG.gameDuration;
            gameState.isHoldingBall = false;
            gameState.isBallInFlight = false;
            playerPos.set(0, 1.6, 5);
            cameraEuler.set(0, 0, 0, 'YXZ');
            targetApproachBall = null;
            if (activeBallMesh) {
                scene.remove(activeBallMesh);
                activeBallMesh = null;
            }
            heldBallDisplayMesh.visible = false;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (!gameState.isGameActive) return;
                gameState.timeLeft--;
                updateHUD();

                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateHUD() {
            const mins = Math.floor(gameState.timeLeft / 60).toString().padStart(2, '0');
            const secs = (gameState.timeLeft % 60).toString().padStart(2, '0');
            hudTimer.textContent = `${mins}:${secs}`;
            hudScore.textContent = gameState.score;
            hudBalls.textContent = gameState.ballsLeft;
        }

        function endGame() {
            gameState.isGameActive = false;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);

            document.getElementById('res-name').textContent = gameState.playerName;
            document.getElementById('res-score').textContent = `${gameState.score} 分`;
            document.getElementById('res-balls').textContent = `${CONFIG.totalBalls - gameState.ballsLeft} / ${CONFIG.totalBalls}`;
            document.getElementById('modal-result').classList.remove('hidden');
        }

        // --- 瞄準紅圈自動慢跑靠近撿球 ---
        function updateBallApproach(delta) {
            if (gameState.isHoldingBall || gameState.isBallInFlight || !gameState.isGameActive) {
                targetApproachBall = null;
                crosshair.classList.remove('approaching');
                return;
            }

            const raycaster = new THREE.Raycaster();
            // 從鏡頭中心發射射線
            raycaster.setFromCamera(new THREE.Vector2(0, 0.2), camera);
            const intersects = raycaster.intersectObjects(ballsArray);

            if (intersects.length > 0) {
                targetApproachBall = intersects[0].object;
                crosshair.classList.add('approaching');
                statusMsg.textContent = "🏃 正在自動慢跑靠近籃球...";
            } else if (!targetApproachBall) {
                crosshair.classList.remove('approaching');
                statusMsg.textContent = "請滑動畫面或移動視角，將瞄準圈對準地上的籃球";
            }

            if (targetApproachBall) {
                if (!ballsArray.includes(targetApproachBall)) {
                    targetApproachBall = null;
                    return;
                }

                const ballPos = targetApproachBall.position;
                const playerXZ = new THREE.Vector3(playerPos.x, 0, playerPos.z);
                const ballXZ = new THREE.Vector3(ballPos.x, 0, ballPos.z);
                const dist = playerXZ.distanceTo(ballXZ);

                if (dist < 0.6) {
                    const picked = targetApproachBall;
                    targetApproachBall = null;
                    crosshair.classList.remove('approaching');
                    pickupBall(picked);
                } else {
                    const dir = ballXZ.sub(playerXZ).normalize();
                    playerPos.x += dir.x * CONFIG.jogSpeed * delta;
                    playerPos.z += dir.z * CONFIG.jogSpeed * delta;

                    // 限於球場內部邊界
                    playerPos.x = Math.max(-CONFIG.courtWidth/2 + 0.5, Math.min(CONFIG.courtWidth/2 - 0.5, playerPos.x));
                    playerPos.z = Math.max(-CONFIG.courtLength/2 + 0.5, Math.min(CONFIG.courtLength/2 - 0.5, playerPos.z));
                }
            }
        }

        function pickupBall(ballMesh) {
            gameState.isHoldingBall = true;
            
            const idx = ballsArray.indexOf(ballMesh);
            if (idx > -1) ballsArray.splice(idx, 1);
            scene.remove(ballMesh);

            heldBallDisplayMesh.visible = true;
            crosshair.classList.add('holding');
            statusMsg.textContent = "🎯 已持球！向上甩動手機或按 [空白鍵] 投籃";
        }

        // --- 拋物線投籃與僅針對空中球體的磁力吸引 ---
        function shootBall(speedForce) {
            gameState.isHoldingBall = false;
            gameState.isBallInFlight = true;
            targetApproachBall = null;
            heldBallDisplayMesh.visible = false;
            crosshair.classList.remove('holding');
            crosshair.classList.remove('approaching');

            gameState.ballsLeft--;
            updateHUD();

            const ballGeo = new THREE.SphereGeometry(0.22, 32, 32);
            const ballMat = createBasketballMaterial();
            activeBallMesh = new THREE.Mesh(ballGeo, ballMat);
            activeBallMesh.castShadow = true;
            
            const spawnPos = camera.position.clone();
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            spawnPos.add(forward.clone().multiplyScalar(0.6));
            spawnPos.y -= 0.2;
            activeBallMesh.position.copy(spawnPos);
            scene.add(activeBallMesh);

            // 計算三分線距離 (5m)
            const distToRim = new THREE.Vector2(spawnPos.x, spawnPos.z).distanceTo(new THREE.Vector2(0, CONFIG.rimZ));
            const is3Point = distToRim > CONFIG.threePointRadius;

            const velocity = forward.clone().multiplyScalar(speedForce * 0.7);
            velocity.y += Math.max(4.0, speedForce * 0.45);

            activeBallPhysics = {
                vel: velocity,
                active: true,
                is3Point: is3Point,
                hasScored: false
            };

            statusMsg.textContent = is3Point ? "🔥 三分球出手！" : "🏀 兩分球出手！";
        }

        function updatePhysics(delta) {
            if (!activeBallPhysics.active || !activeBallMesh) return;

            const pos = activeBallMesh.position;
            const vel = activeBallPhysics.vel;

            // 重力加速度
            vel.y -= 9.8 * delta;

            // ⭐ 磁吸引力僅作用於投出的球（完全不干涉視角） ⭐
            const targetRimPos = new THREE.Vector3(0, CONFIG.rimHeight, CONFIG.rimZ - 0.23);
            const distToRim = pos.distanceTo(targetRimPos);

            if (distToRim < 3.8 && pos.z < 0) {
                const attractDir = targetRimPos.clone().sub(pos).normalize();
                const forceMagnitude = Math.max(0, (3.8 - distToRim) * 2.2);
                vel.add(attractDir.multiplyScalar(forceMagnitude * delta));
            }

            pos.add(vel.clone().multiplyScalar(delta));
            activeBallMesh.rotation.x += 3.5 * delta;

            // 籃板碰撞
            const boardZ = -CONFIG.courtLength / 2 - 0.025;
            if (Math.abs(pos.z - boardZ) < 0.25 && pos.y > 2.2 && pos.y < 3.2 && Math.abs(pos.x) < 0.9) {
                vel.z = Math.abs(vel.z) * 0.65;
                vel.x *= 0.8;
                pos.z = boardZ + 0.26;
            }

            // 進球判斷
            if (!activeBallPhysics.hasScored) {
                const rimCenter = new THREE.Vector3(0, CONFIG.rimHeight, CONFIG.rimZ - 0.23);
                const horizDist = new THREE.Vector2(pos.x - rimCenter.x, pos.z - rimCenter.z).length();

                if (horizDist < 0.35 && Math.abs(pos.y - rimCenter.y) < 0.25 && vel.y < 0) {
                    activeBallPhysics.hasScored = true;
                    const pts = activeBallPhysics.is3Point ? 3 : 2;
                    gameState.score += pts;
                    updateHUD();

                    triggerRimFlash();
                    statusMsg.textContent = `🎉 空心進球！ +${pts} 分！`;
                }
            }

            // 落地即消失並結束本次投球
            if (pos.y <= 0.22) {
                pos.y = 0.22;
                destroyActiveBall();
            }
        }

        // 金色籃框發光效果
        function triggerRimFlash() {
            frontRimLight.intensity = 4.0;
            setTimeout(() => {
                frontRimLight.intensity = 0;
            }, 400);
        }

        function destroyActiveBall() {
            activeBallPhysics.active = false;
            if (activeBallMesh) {
                scene.remove(activeBallMesh);
                activeBallMesh = null;
            }
            gameState.isBallInFlight = false;

            if (gameState.ballsLeft <= 0) {
                endGame();
            } else {
                statusMsg.textContent = "請滑動畫面或移動視角，將瞄準圈對準地上的籃球";
            }
        }

        // --- 鏡頭與玩家位置更新 ---
        function updateCamera() {
            if (gameState.isBallInFlight && activeBallMesh) {
                // 球飛行時鏡頭平滑跟隨球體
                const ballPos = activeBallMesh.position.clone();
                const targetCamPos = ballPos.clone().add(new THREE.Vector3(0, 0.8, 1.8));
                camera.position.lerp(targetCamPos, 0.12);
                camera.lookAt(ballPos);
            } else {
                // 平常視角跟隨玩家位置，方向由 cameraEuler (無限制) 決定
                const headPos = playerPos.clone();
                headPos.y = 1.6;
                camera.position.lerp(headPos, 0.1);

                camera.quaternion.setFromEuler(cameraEuler);

                // 若手中持球，將半透明球體固定在鏡頭前方自轉
                if (gameState.isHoldingBall && heldBallDisplayMesh) {
                    const heldPos = camera.position.clone();
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    heldPos.add(forward.multiplyScalar(0.65));
                    heldPos.y -= 0.22;
                    heldBallDisplayMesh.position.copy(heldPos);
                    heldBallDisplayMesh.rotation.y += 0.02;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let lastFrameTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            if (gameState.isGameActive) {
                updateBallApproach(delta);
                updatePhysics(delta);
            }

            updateCamera();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
