<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>ipad平板投籃遊戲 - 一甲國小練習生</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Target Reticle Overlay */
    #reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reticle-circle {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(239, 68, 68, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6), inset 0 0 8px rgba(239, 68, 68, 0.4);
      transition: all 0.2s ease-out;
    }

    .reticle-circle.active {
      width: 58px;
      height: 58px;
      border-color: #22c55e;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.9), inset 0 0 12px rgba(34, 197, 94, 0.6);
      animation: reticlePulse 0.8s infinite alternate ease-in-out;
    }

    .reticle-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    @keyframes reticlePulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.08); }
    }

    /* Golden Score Flash Light Effect */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,215,0,0.45) 0%, rgba(255,215,0,0) 75%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease-in-out;
      z-index: 15;
    }

    /* UI Glassmorphism Panel */
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="bg-black text-white relative">

  <!-- WebGL 3D Container -->
  <div id="webgl-container"></div>

  <!-- Reticle -->
  <div id="reticle-container">
    <div id="reticle" class="reticle-circle"></div>
    <div class="reticle-dot"></div>

  <!-- Score Flash Light Overlay -->

  <!-- Top HUD Bar -->
  <div id="hud-bar" class="hidden absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">

    <div class="glass-panel px-4 py-2 rounded-2xl flex items-center space-x-4">

        <div id="hud-name" class="font-bold text-base text-cyan-300">一甲國小練習生</div>
      </div>

        <div class="text-xs text-slate-400">總得分</div>

      </div>
    </div>

    <!-- Right: Count & Timer -->
    <div class="glass-panel px-4 py-2 rounded-2xl flex items-center space-x-4">
      <div class="text-right">
        <div class="text-xs text-slate-400">剩餘籃球</div>

  <!-- Start Modal -->
  <div id="start-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
    <div class="glass-panel max-w-md w-full p-6 rounded-3xl text-center shadow-2xl space-y-6">

        🏀
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-wide text-white">ipad平板投籃遊戲</h1>
        <p class="text-xs text-slate-400 mt-1">全程籃框引力導向 • 深藍球場 • 全視角體感操控</p>
      </div>

      <div class="space-y-2 text-left">
        <label for="player-name-input" class="text-xs font-semibold text-slate-300 block">學生姓名</label>

      <div class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl text-left space-y-1.5 border border-slate-800">
        <p>📱 <span class="text-amber-400 font-bold">iPad 操作：</span>瞄準籃球自動靠近撿球，抬起 iPad 向上快速仰甩投籃。</p>
        <p>💻 <span class="text-cyan-400 font-bold">電腦操作：</span>滑鼠拖曳轉動視角，按 <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-600 font-mono text-white">Spacebar</kbd> 投籃。</p>
        <p class="text-emerald-400 text-center font-bold pt-1">✨ 已啟用「全程籃框磁吸引力」，輕鬆命中得分！</p>
      </div>

      <button id="btn-start" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-orange-500/40 active:scale-95 transition-all">
        點擊開始遊戲 (啟用陀螺儀)
      </button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
    <div class="glass-panel max-w-md w-full p-8 rounded-3xl text-center shadow-2xl space-y-6 border border-yellow-500/30">
      <div class="w-20 h-20 bg-yellow-500/20 rounded-full mx-auto flex items-center justify-center text-4xl border border-yellow-500/40 shadow-inner">
        🏆
      </div>
      <div>
        <h2 class="text-3xl font-black text-white">練習結束！</h2>
        <p class="text-sm text-slate-400 mt-1">精采的投籃表現！</p>
      </div>

      <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400">學生選手</span>
          <span id="end-player-name" class="font-bold text-cyan-300">一甲國小練習生</span>
        </div>
        <div class="h-px bg-slate-800"></div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400 text-sm">最終累積得分</span>
          <span id="end-player-score" class="font-black text-3xl text-yellow-400">0 分</span>
        </div>
      </div>

      <button id="btn-restart" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-cyan-500/40 active:scale-95 transition-all">
        重新開始遊戲
      </button>
    </div>
  </div>

  <script>
    /**
     * Web Audio Sound Synthesizer
     */
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playBounce() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
      }
      playSwish() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
        filter.Q.setValueAtTime(2.5, this.ctx.currentTime);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }
      playScoreChime() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.06);
          osc.stop(this.ctx.currentTime + idx * 0.06 + 0.3);
        });
      }
      playShot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
    }

    const sounds = new SoundEffects();

    /**
     * Game Settings & State
     */
    const CONFIG = {
      courtWidth: 10,       // 10m
      courtLength: 12,      // 12m
      rimHeight: 3.05,      // 3.05m
      rimRadius: 0.38,      // Enlarged rim for easier scoring
      rimTargetZ: -5.3,     // Target hoop Z
      threePointRadius: 5.0,// 5m Three-point arc
      ballRadius: 0.12,
      maxBalls: 30,
      totalTime: 180,       // 3 minutes (180s)
      jogSpeed: 4.8,        // Jogging pickup speed (m/s)
      shootPitchThreshold: 2.0 // Angular velocity threshold
    };

    let gameState = {
      playerName: "一甲國小練習生",
      score: 0,
      ballsLeft: CONFIG.maxBalls,
      timeRemaining: CONFIG.totalTime,
      isPlaying: false,
      isHoldingBall: false,
      isBallInAir: false,
      currentHeldBallIndex: -1,
      timerInterval: null
    };

    // Controls Data
    let gyroData = { alpha: 0, beta: 0, gamma: 0, prevBeta: 0, betaVel: 0 };
    let cameraRotation = { yaw: 0, pitch: 0 };

    // Three.js Globals
    let container, scene, camera, renderer, clock;
    let ballsArr = [];
    let activeFlyingBall = null;
    let mainHoopMesh, mainBackboardBox;
    let Raycaster, centerVector;
    let heldBallMesh = null;

    let cameraMode = 'PLAYER'; // 'PLAYER' | 'FOLLOW_BALL'
    let playerCamPos = new THREE.Vector3(0, 1.65, 4.0);

    /**
     * Procedural Basketball Texture Canvas
     */
    function createBasketballTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#db6c23';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 3500; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.12)';
        ctx.fillRect(x, y, 2, 2);
      }

      ctx.strokeStyle = '#181818';
      ctx.lineWidth = 6;

      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width * 0.25, canvas.height / 2, 82, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width * 0.75, canvas.height / 2, 82, Math.PI / 2, -Math.PI / 2);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    /**
     * Initialize Three.js 3D World
     */
    function init3DScene() {
      container = document.getElementById('webgl-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000); // Black Sky
      scene.fog = new THREE.FogExp2(0x000000, 0.015);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.copy(playerCamPos);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      clock = new THREE.Clock();
      Raycaster = new THREE.Raycaster();
      centerVector = new THREE.Vector2(0, 0);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      const mainSpot = new THREE.SpotLight(0xfff5ea, 1.4);
      mainSpot.position.set(0, 12, 2);
      mainSpot.angle = Math.PI / 3;
      mainSpot.penumbra = 0.5;
      mainSpot.castShadow = true;
      mainSpot.shadow.mapSize.width = 1024;
      mainSpot.shadow.mapSize.height = 1024;
      scene.add(mainSpot);

      const light1 = new THREE.PointLight(0x38bdf8, 0.8, 20);
      light1.position.set(-6, 8, -4);
      scene.add(light1);

      const light2 = new THREE.PointLight(0xf59e0b, 0.8, 20);
      light2.position.set(6, 8, -4);
      scene.add(light2);

      // Field & Hoops
      buildCourtEnvironment();
      buildHoop(new THREE.Vector3(0, 0, CONFIG.rimTargetZ), false); // North Hoop
      buildHoop(new THREE.Vector3(0, 0, 5.8), true);              // South Hoop

      // Objects
      spawnBasketballs();
      createHeldBallMesh();

      window.addEventListener('resize', onWindowResize);
      setupControls();
    }

    /**
     * 10m x 12m Deep Blue Court & Markings
     */
    function buildCourtEnvironment() {
      // Grass (Dark Green)
      const grassGeo = new THREE.PlaneGeometry(80, 80);
      const grassMat = new THREE.MeshStandardMaterial({ color: 0x052e16, roughness: 0.95 });
      const grassMesh = new THREE.Mesh(grassGeo, grassMat);
      grassMesh.rotation.x = -Math.PI / 2;
      grassMesh.position.y = -0.01;
      grassMesh.receiveShadow = true;
      scene.add(grassMesh);

      // Deep Blue Court
      const courtGeo = new THREE.PlaneGeometry(CONFIG.courtWidth, CONFIG.courtLength);
      const courtMat = new THREE.MeshStandardMaterial({
        color: 0x1e3a8a,
        roughness: 0.35,
        metalness: 0.1
      });
      const courtMesh = new THREE.Mesh(courtGeo, courtMat);
      courtMesh.rotation.x = -Math.PI / 2;
      courtMesh.position.set(0, 0, 0);
      courtMesh.receiveShadow = true;
      scene.add(courtMesh);

      // Canvas Texture Overlay for Court Markings
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1228;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12;

      // Outer Border
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      // Center Line & Circle
      ctx.beginPath();
      ctx.moveTo(20, canvas.height / 2);
      ctx.lineTo(canvas.width - 20, canvas.height / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 100, 0, Math.PI * 2);
      ctx.stroke();

      // Key & 5m 3-Point Arcs
      const drawHalfLines = (isNorth) => {
        const keyW = (3.6 / CONFIG.courtWidth) * canvas.width;
        const keyH = (4.0 / CONFIG.courtLength) * canvas.height;
        ctx.strokeRect((canvas.width - keyW) / 2, isNorth ? 20 : canvas.height - 20 - keyH, keyW, keyH);

        const basketY = isNorth ? 20 + (0.7 / CONFIG.courtLength) * canvas.height : canvas.height - 20 - (0.7 / CONFIG.courtLength) * canvas.height;
        const radius3P = (CONFIG.threePointRadius / CONFIG.courtWidth) * canvas.width;

        ctx.beginPath();
        ctx.arc(canvas.width / 2, basketY, radius3P, isNorth ? 0 : Math.PI, isNorth ? Math.PI : Math.PI * 2, false);
        ctx.stroke();
      };

      drawHalfLines(true);
      drawHalfLines(false);

      const linesTexture = new THREE.CanvasTexture(canvas);
      const linesGeo = new THREE.PlaneGeometry(CONFIG.courtWidth, CONFIG.courtLength);
      const linesMat = new THREE.MeshBasicMaterial({ map: linesTexture, transparent: true, depthWrite: false });
      const linesMesh = new THREE.Mesh(linesGeo, linesMat);
      linesMesh.rotation.x = -Math.PI / 2;
      linesMesh.position.set(0, 0.005, 0);
      scene.add(linesMesh);
    }

    /**
     * Build Basketball Hoop Structure
     */
    function buildHoop(position, isRotated) {
      const hoopGroup = new THREE.Group();
      hoopGroup.position.copy(position);
      if (isRotated) hoopGroup.rotation.y = Math.PI;

      // Pole Support
      const postMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7, roughness: 0.3 });
      const postMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 3.8, 16), postMat);
      postMesh.position.set(0, 1.9, -0.6);
      postMesh.castShadow = true;
      hoopGroup.add(postMesh);

      const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), postMat);
      armMesh.position.set(0, 3.1, -0.2);
      hoopGroup.add(armMesh);

      // Backboard
      const bbGroup = new THREE.Group();
      bbGroup.position.set(0, 3.3, 0);

      const bbBoardMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.7,
        opacity: 0.95,
        transparent: true,
        roughness: 0.1,
        ior: 1.5
      });
      const bbBoard = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.05, 0.05), bbBoardMat);
      bbBoard.castShadow = true;
      bbGroup.add(bbBoard);

      if (!isRotated) {
        mainBackboardBox = new THREE.Box3();
        mainBackboardBox.setFromObject(bbBoard);
      }

      // Red Outer Frame & Inner Square
      const redFrameMat = new THREE.MeshBasicMaterial({ color: 0xd97706 });
      const bbFrame = new THREE.Mesh(new THREE.BoxGeometry(1.84, 1.09, 0.02), redFrameMat);
      bbFrame.position.z = -0.02;
      bbGroup.add(bbFrame);

      const innerRectGeo = new THREE.BoxGeometry(0.59, 0.45, 0.06);
      const innerRectMat = new THREE.MeshBasicMaterial({ color: 0xd97706, wireframe: true });
      const innerRect = new THREE.Mesh(innerRectGeo, innerRectMat);
      innerRect.position.set(0, -0.2, 0.01);
      bbGroup.add(innerRect);

      // Golden Flash Overlay Mesh
      const flashMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0 });
      const flashBoard = new THREE.Mesh(new THREE.BoxGeometry(1.82, 1.07, 0.07), flashMat);
      bbGroup.add(flashBoard);

      if (!isRotated) {
        mainHoopMesh = flashBoard;
      }

      hoopGroup.add(bbGroup);

      // Rim Ring (Height 3.05m)
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xea580c, metalness: 0.5, roughness: 0.2 });
      const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(CONFIG.rimRadius, 0.025, 16, 32), rimMat);
      rimMesh.rotation.x = Math.PI / 2;
      rimMesh.position.set(0, CONFIG.rimHeight, 0.35);
      rimMesh.castShadow = true;
      hoopGroup.add(rimMesh);

      // White Net
      const netGeo = new THREE.ConeGeometry(CONFIG.rimRadius, 0.45, 12, 4, true);
      const netMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc, wireframe: true, transparent: true, opacity: 0.75 });
      const netMesh = new THREE.Mesh(netGeo, netMat);
      netMesh.position.set(0, CONFIG.rimHeight - 0.22, 0.35);
      hoopGroup.add(netMesh);

      scene.add(hoopGroup);
    }

    /**
     * Spawn 30 Basketballs Randomly in 8m Half-Court Bounds
     */
    function spawnBasketballs() {
      const ballTexture = createBasketballTexture();
      const ballGeo = new THREE.SphereGeometry(CONFIG.ballRadius, 32, 32);

      for (let i = 0; i < CONFIG.maxBalls; i++) {
        const ballMat = new THREE.MeshStandardMaterial({
          map: ballTexture,
          roughness: 0.45,
          metalness: 0.05
        });

        const ballMesh = new THREE.Mesh(ballGeo, ballMat);

        const rx = (Math.random() - 0.5) * 8.4;
        const rz = (Math.random() - 0.5) * 8.0 - 0.5;

        ballMesh.position.set(rx, CONFIG.ballRadius, rz);
        ballMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        ballMesh.castShadow = true;
        ballMesh.receiveShadow = true;

        scene.add(ballMesh);
        ballsArr.push({
          mesh: ballMesh,
          isPickedUp: false,
          isDestroyed: false,
          velocity: new THREE.Vector3()
        });
      }
    }

    /**
     * Camera Held Ball (50% Semi-Transparent)
     */
    function createHeldBallMesh() {
      const ballTexture = createBasketballTexture();
      const ballGeo = new THREE.SphereGeometry(CONFIG.ballRadius, 32, 32);
      const heldMat = new THREE.MeshStandardMaterial({
        map: ballTexture,
        transparent: true,
        opacity: 0.55,
        roughness: 0.3
      });

      heldBallMesh = new THREE.Mesh(ballGeo, heldMat);
      heldBallMesh.visible = false;
      scene.add(heldBallMesh);
    }

    /**
     * Controls Architecture (Gyroscope + PC Mouse/Keyboard)
     */
    function setupControls() {
      // Gyroscope Handler
      window.addEventListener('deviceorientation', (e) => {
        if (!gameState.isPlaying) return;

        if (e.beta !== null) {
          let currentBeta = e.beta;
          gyroData.betaVel = currentBeta - gyroData.prevBeta;
          gyroData.prevBeta = currentBeta;

          cameraRotation.pitch = THREE.MathUtils.degToRad(currentBeta - 45);
          cameraRotation.yaw = THREE.MathUtils.degToRad(-e.alpha || -e.gamma || 0);

          // iPad Rapid Upward Gesture Trigger
          if (gameState.isHoldingBall && gyroData.betaVel > CONFIG.shootPitchThreshold * 14) {
            shootBall();
          }
        }
      });

      // Mouse Look Handler
      let isMouseDown = false;
      let prevMousePos = { x: 0, y: 0 };

      window.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        isMouseDown = true;
        prevMousePos = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown || !gameState.isPlaying) return;
        const deltaX = e.clientX - prevMousePos.x;
        const deltaY = e.clientY - prevMousePos.y;
        prevMousePos = { x: e.clientX, y: e.clientY };

        cameraRotation.yaw -= deltaX * 0.0035;
        cameraRotation.pitch -= deltaY * 0.0035;

        cameraRotation.pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraRotation.pitch));
      });

      window.addEventListener('mouseup', () => { isMouseDown = false; });

      // PC Keyboard Spacebar Trigger
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && gameState.isPlaying && gameState.isHoldingBall) {
          shootBall();
        }
      });
    }

    /**
     * Start Game Process
     */
    function startGame() {
      sounds.init();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }

      const inputName = document.getElementById('player-name-input').value.trim();
      gameState.playerName = inputName || "一甲國小練習生";
      document.getElementById('hud-name').innerText = gameState.playerName;

      gameState.score = 0;
      gameState.ballsLeft = CONFIG.maxBalls;
      gameState.timeRemaining = CONFIG.totalTime;
      gameState.isPlaying = true;
      gameState.isHoldingBall = false;
      gameState.isBallInAir = false;

      document.getElementById('hud-score').innerText = '0';
      document.getElementById('hud-balls').innerText = `${CONFIG.maxBalls} / ${CONFIG.maxBalls}`;
      document.getElementById('start-modal').classList.add('hidden');
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('hud-bar').classList.remove('hidden');

      clearInterval(gameState.timerInterval);
      gameState.timerInterval = setInterval(updateTimer, 1000);
      updateTimerDisplay();
    }

    function updateTimer() {
      if (!gameState.isPlaying) return;
      gameState.timeRemaining--;
      updateTimerDisplay();

      if (gameState.timeRemaining <= 0) {
        endGame();
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(gameState.timeRemaining / 60);
      const secs = gameState.timeRemaining % 60;
      document.getElementById('hud-timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    /**
     * Auto Jog Pickup Mechanism
     */
    function processBallPickupLogic(delta) {
      if (gameState.isHoldingBall || gameState.isBallInAir || cameraMode !== 'PLAYER') return;

      Raycaster.setFromCamera(centerVector, camera);

      let targetBallToPickup = null;
      let closestDistance = Infinity;

      for (let i = 0; i < ballsArr.length; i++) {
        const ball = ballsArr[i];
        if (ball.isPickedUp || ball.isDestroyed) continue;

        const intersects = Raycaster.intersectObject(ball.mesh);
        if (intersects.length > 0) {
          const dist = camera.position.distanceTo(ball.mesh.position);
          if (dist < closestDistance) {
            closestDistance = dist;
            targetBallToPickup = { ball: ball, index: i, distance: dist };
          }
        }
      }

      const reticleEl = document.getElementById('reticle');
      const hintEl = document.getElementById('hud-hint');

      if (targetBallToPickup) {
        reticleEl.classList.add('active');
        hintEl.innerText = "正在靠近撿球...";

        const dir = new THREE.Vector3().subVectors(targetBallToPickup.ball.mesh.position, camera.position);
        dir.y = 0;
        const moveDist = CONFIG.jogSpeed * delta;

        if (dir.length() > 0.85) {
          dir.normalize();
          playerCamPos.addScaledVector(dir, moveDist);
        } else {
          pickupBall(targetBallToPickup.index);
        }
      } else {
        reticleEl.classList.remove('active');
        hintEl.innerText = gameState.isHoldingBall ? "尋找籃框，向上甩動投籃" : "將紅圈對準地面籃球";
      }
    }

    function pickupBall(index) {
      gameState.isHoldingBall = true;
      gameState.currentHeldBallIndex = index;
      ballsArr[index].isPickedUp = true;
      ballsArr[index].mesh.visible = false;

      heldBallMesh.visible = true;
      sounds.playBounce();

      document.getElementById('hud-hint').innerText = "瞄準籃框！向上仰角甩動投籃";
    }

    /**
     * Shoot Ball & Trigger Full-Flight Magnetic Guidance
     */
    function shootBall() {
      if (!gameState.isHoldingBall || gameState.isBallInAir) return;

      gameState.isHoldingBall = false;
      gameState.isBallInAir = true;
      gameState.ballsLeft--;
      document.getElementById('hud-balls').innerText = `${gameState.ballsLeft} / ${CONFIG.maxBalls}`;
      heldBallMesh.visible = false;

      // Calculate initial velocity vector towards camera direction
      const forwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();

      const launchSpeed = 10.2;
      const initialVelocity = forwardDir.clone().multiplyScalar(launchSpeed);
      initialVelocity.y += 4.2; // Parabolic upward lift

      const ballObj = ballsArr[gameState.currentHeldBallIndex];
      ballObj.mesh.position.copy(camera.position).add(forwardDir.clone().multiplyScalar(0.4));
      ballObj.mesh.visible = true;
      ballObj.velocity.copy(initialVelocity);

      // Save initial shot distance to calculate +2 or +3 points
      const hoopRimCenter = new THREE.Vector3(0, CONFIG.rimHeight, CONFIG.rimTargetZ + 0.35);
      const shotDist = camera.position.distanceTo(hoopRimCenter);
      ballObj.shotPoints = shotDist >= CONFIG.threePointRadius ? 3 : 2;
      ballObj.hasScored = false;

      activeFlyingBall = ballObj;
      sounds.playShot();

      // Switch to Follow Camera Mode
      cameraMode = 'FOLLOW_BALL';
    }

    /**
     * Physics Engine: Full-Flight Magnetic Guidance & Collisions
     */
    function updatePhysics(delta) {
      if (!activeFlyingBall || !gameState.isBallInAir) return;

      const ball = activeFlyingBall;
      const pos = ball.mesh.position;
      const vel = ball.velocity;

      // Gravity Acceleration
      vel.y -= 9.81 * delta;

      // Ball Spin Effect
      ball.mesh.rotation.x += 4.5 * delta;

      // --- FULL-FLIGHT MAGNETIC GUIDANCE (Active from launch moment) ---
      const hoopCenter = new THREE.Vector3(0, CONFIG.rimHeight + 0.1, CONFIG.rimTargetZ + 0.35);
      
      // Calculate homing vector towards rim center
      const homingDir = new THREE.Vector3().subVectors(hoopCenter, pos);
      const distanceToHoop = homingDir.length();
      homingDir.normalize();

      // Stronger attraction force as the ball nears the basket
      let attractionStrength = 3.5;
      if (distanceToHoop < 2.5) {
        attractionStrength = 6.5; // High pull near hoop
      }

      // Smoothly steer velocity towards hoop target (magnetic homing effect)
      vel.x += homingDir.x * attractionStrength * delta;
      vel.z += homingDir.z * attractionStrength * delta;
      
      // Gentle height guidance when close to rim
      if (distanceToHoop < 1.8 && pos.y < CONFIG.rimHeight + 0.6 && pos.y > CONFIG.rimHeight - 0.2) {
        vel.y += (hoopCenter.y - pos.y) * 4.0 * delta;
      }

      // --- BACKBOARD & POST COLLISION REFLECTION ---
      if (pos.z <= CONFIG.rimTargetZ + 0.1 && pos.z >= CONFIG.rimTargetZ - 0.25) {
        if (Math.abs(pos.x) <= 0.95 && pos.y >= 2.75 && pos.y <= 3.9) {
          // Rebound Reflection (Bouncing Elasticity ~0.7)
          vel.z = Math.abs(vel.z) * 0.7;
          
          // Rebound trajectory auto-corrected towards hoop center
          vel.x = (0 - pos.x) * 2.5;
          pos.z = CONFIG.rimTargetZ + 0.12;
          sounds.playBounce();
        }
      }

      // Position Update
      pos.addScaledVector(vel, delta);

      // --- IN-GOAL SCORE DETECTOR ---
      if (!ball.hasScored && pos.y <= CONFIG.rimHeight + 0.05 && pos.y >= CONFIG.rimHeight - 0.35) {
        const horizDist = Math.hypot(pos.x - hoopCenter.x, pos.z - hoopCenter.z);
        if (horizDist < CONFIG.rimRadius * 1.15) {
          ball.hasScored = true;
          registerScore(ball.shotPoints);
        }
      }

      // --- GROUND LANDING DETECTOR ---
      if (pos.y <= CONFIG.ballRadius) {
        pos.y = CONFIG.ballRadius;
        sounds.playBounce();

        // Destroy ball instance after landing
        ball.isDestroyed = true;
        ball.mesh.visible = false;
        activeFlyingBall = null;
        gameState.isBallInAir = false;

        // Reset back to player view smoothly
        setTimeout(() => {
          cameraMode = 'PLAYER';
        }, 250);

        if (gameState.ballsLeft <= 0) {
          setTimeout(endGame, 1000);
        }
      }

      // --- DYNAMIC FOLLOW CAMERA ---
      if (cameraMode === 'FOLLOW_BALL' && activeFlyingBall) {
        const followPos = pos.clone().add(new THREE.Vector3(0, 0.35, 1.7)); // Horizontal follow behind ball
        camera.position.lerp(followPos, delta * 8.5);
        camera.lookAt(pos);
      }
    }

    /**
     * Score Handling & Flash FX
     */
    function registerScore(points) {
      gameState.score += points;
      document.getElementById('hud-score').innerText = gameState.score;

      sounds.playSwish();
      sounds.playScoreChime();

      // Score Toast Popup
      const toast = document.getElementById('score-toast');
      const pointText = points === 3 ? "+3 分! 大特寫遠投三分球!" : "+2 分! 精準擦板進球!";
      toast.innerText = pointText;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 1400);

      // Backboard Golden Flash Effect
      if (mainHoopMesh) {
        mainHoopMesh.material.opacity = 0.95;
        let flashOpacity = 0.95;
        const flashInterval = setInterval(() => {
          flashOpacity -= 0.12;
          if (flashOpacity <= 0) {
            mainHoopMesh.material.opacity = 0;
            clearInterval(flashInterval);
          } else {
            mainHoopMesh.material.opacity = flashOpacity;
          }
        }, 35);
      }

      const flashOverlay = document.getElementById('flash-overlay');
      flashOverlay.style.opacity = '1';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 350);
    }

    /**
     * Game Over Modal
     */
    function endGame() {
      gameState.isPlaying = false;
      clearInterval(gameState.timerInterval);

      document.getElementById('end-player-name').innerText = gameState.playerName;
      document.getElementById('end-player-score').innerText = `${gameState.score} 分`;
      document.getElementById('gameover-modal').classList.remove('hidden');
      document.getElementById('hud-bar').classList.add('hidden');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /**
     * Animation Loop
     */
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (gameState.isPlaying) {
        if (cameraMode === 'PLAYER') {
          camera.position.copy(playerCamPos);

          const euler = new THREE.Euler(cameraRotation.pitch, cameraRotation.yaw, 0, 'YXZ');
          camera.quaternion.setFromEuler(euler);

          if (gameState.isHoldingBall && heldBallMesh) {
            const forward = new THREE.Vector3(0, -0.24, -0.55).applyQuaternion(camera.quaternion);
            heldBallMesh.position.copy(camera.position).add(forward);
            heldBallMesh.rotation.y += 1.5 * delta;
          }

          processBallPickupLogic(delta);
        }

        updatePhysics(delta);
      }

      renderer.render(scene, camera);
    }

    window.onload = function() {
      init3DScene();
      animate();

      document.getElementById('btn-start').addEventListener('click', startGame);
      document.getElementById('btn-restart').addEventListener('click', () => {
        ballsArr.forEach(b => scene.remove(b.mesh));
        ballsArr = [];
        spawnBasketballs();
        playerCamPos.set(0, 1.65, 4.0);
        cameraRotation = { yaw: 0, pitch: 0 };
        startGame();
      });
    };
  </script>
</body>
</html>
