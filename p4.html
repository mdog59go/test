<body class="text-white select-none">

    <!-- Start Screen (Requires interaction for permissions) -->
    <div id="start-screen" class="absolute inset-0 bg-black/85 z-20 flex flex-col items-center justify-center pointer-events-auto text-center p-6">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-yellow-400 drop-shadow-lg">一甲國小<br>平板投籃練習</h1>
        <p class="text-lg md:text-xl mb-8 max-w-md mx-auto leading-relaxed">
            操作說明：<br>
            1. 雙手平拿平板。<br>
            2. 將畫面中央紅圈對準地上的籃球 2 秒來拾取。<br>
            3. 轉動身體尋找籃框。<br>
            4. 快速將平板往<span class="text-green-400 font-bold">前上方推</span>將球投出！<br><br>
            <span class="text-sm text-gray-400">(若無感測器，可用滑鼠/觸控拖曳視角，長按左鍵蓄力發射)</span>
        </p>
        <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full text-2xl shadow-[0_0_15px_rgba(37,99,235,0.7)] transition-transform transform hover:scale-105 active:scale-95">
            開始遊戲 / 允許感測器
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden absolute inset-0 bg-black/85 z-20 flex-col items-center justify-center pointer-events-auto text-center p-6">
        <h2 class="text-5xl font-bold mb-4 text-white">時間到！</h2>
        <p class="text-3xl mb-8">你的得分: <span id="final-score" class="text-yellow-400 font-bold text-5xl">0</span></p>
        <button id="restart-btn" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">
            再玩一次
        </button>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Top HUD -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-start">
            <div class="bg-black/50 p-3 rounded-xl border border-white/20 backdrop-blur-sm">
                <div class="text-sm text-gray-300">一甲國小平板投籃練習</div>
                <div class="text-2xl font-bold text-yellow-400">得分: <span id="score-display">0</span></div>
            </div>
            <div class="bg-black/50 p-3 rounded-xl border border-white/20 backdrop-blur-sm text-center min-w-[100px]">
                <div class="text-sm text-gray-300">剩餘時間</div>
                <div id="time-display" class="text-3xl font-bold text-white">30</div>
            </div>
        </div>

        <!-- Center Reticle -->
        <div class="reticle" id="reticle" style="border-color: rgba(255, 0, 0, 0.7);">
            <div class="reticle-center"></div>
        </div>
        
        <!-- SVG Progress Ring for picking up ball -->
        <svg class="progress-ring" width="60" height="60">
            <circle id="pickup-progress" cx="30" cy="30" r="28" style="stroke-dashoffset: 176;"></circle>
        </svg>

        <!-- Message Prompt -->
        <div id="message-prompt" class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-bold text-center text-white text-glow transition-opacity duration-300 opacity-0" style="opacity: 1; color: white; transform: translate(-50%, -50%) scale(1);">尋找地上的籃球</div>

        <!-- Desktop Fallback Power Meter -->
        <div id="power-meter-container">
            <div id="power-meter-fill"></div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="game-canvas" width="1094" height="454" style="width: 1094px; height: 454px;"></canvas>

    <script>
        // --- Game State & Variables ---
        let scene, camera, renderer;
        let hoopGroup, backboard, rim, ground;
        let ball, ballBody; // ballBody holds physics data
        let score = 0;
        let timeLeft = 30;
        let gameTimerId = null;
        
        // Game States: 'START', 'SEEKING_BALL', 'PICKING_UP', 'HOLDING_BALL', 'IN_AIR', 'GAME_OVER'
        let gameState = 'START'; 

        // Aiming / Picking up mechanics
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0); // Center for raycasting
        let aimTime = 0;
        const AIM_REQUIRED_TIME = 2.0; // 2 seconds to pick up
        let lastFrameTime = performance.now();

        // Physics variables
        const gravity = -15; // Custom gravity
        let ballVelocity = new THREE.Vector3();
        let isScoredThisThrow = false;

        // Sensor / Control variables
        let deviceControlsEnabled = false;
        let initialDeviceEuler = new THREE.Euler();
        let isCalibrated = false;
        // Fallback controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let isChargingThrow = false;
        let chargePower = 0;

        // UI Elements
        const uiScore = document.getElementById('score-display');
        const uiTime = document.getElementById('time-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const reticle = document.getElementById('reticle');
        const pickupProgress = document.getElementById('pickup-progress');
        const messagePrompt = document.getElementById('message-prompt');
        const powerMeterContainer = document.getElementById('power-meter-container');
        const powerMeterFill = document.getElementById('power-meter-fill');

        // --- Procedural Texture Generators ---

        function createBasketballTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Base orange color
            ctx.fillStyle = '#C85A17';
            ctx.fillRect(0, 0, 512, 512);
            
            // Add some noise for leather texture
            for(let i=0; i<10000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }

            // Black lines
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#222';
            ctx.lineCap = 'round';

            // Horizontal & Vertical equator lines
            ctx.beginPath(); ctx.moveTo(0, 256); ctx.lineTo(512, 256); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 512); ctx.stroke();

            // U-shaped side curves (approximation for sphere mapping)
            ctx.beginPath();
            ctx.arc(100, 256, 200, -Math.PI/2.2, Math.PI/2.2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(412, 256, 200, Math.PI - Math.PI/2.2, Math.PI + Math.PI/2.2, true);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 4;
            return texture;
        }

        function createBackboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // White background
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, 512, 256);

            ctx.lineWidth = 12;
            ctx.strokeStyle = '#FF0000'; // Red lines

            // Outer border
            ctx.strokeRect(6, 6, 500, 244);

            // Inner target square (bottom center)
            const sqWidth = 160;
            const sqHeight = 100;
            ctx.strokeRect((512 - sqWidth)/2, 256 - sqHeight - 20, sqWidth, sqHeight);

            return new THREE.CanvasTexture(canvas);
        }

        function createCourtTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Deep green grass/court base
            ctx.fillStyle = '#1B4D3E'; 
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.lineWidth = 8;
            ctx.strokeStyle = '#FFFFFF'; // White lines

            // Center is where hoop is (assume y=0 is backboard plane)
            // Draw 3-point line arc. Let hoop be near top edge.
            const hoopCenterX = 512;
            const hoopCenterY = 150; // Position of hoop relative to texture

            ctx.beginPath();
            // Draw arc for 3 point line
            ctx.arc(hoopCenterX, hoopCenterY, 600, 0, Math.PI);
            ctx.stroke();

            // Paint area (key)
            ctx.strokeRect(hoopCenterX - 150, hoopCenterY, 300, 400);
            
            // Free throw half circle
            ctx.beginPath();
            ctx.arc(hoopCenterX, hoopCenterY + 400, 150, 0, Math.PI);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- STREAMING_CHUNK:Building the 3D Scene ---

        function initThreeJS() {
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            scene = new THREE.Scene();
            // Black sky as requested
            scene.background = new THREE.Color(0x0a0a0a); 
            // Fog to fade out distant ground
            scene.fog = new THREE.Fog(0x0a0a0a, 20, 60);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.7, 10); // Standard eye height, starting 10m from hoop

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            scene.add(dirLight);

            createEnvironment();
            createBall();

            // Handle resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Start render loop
            requestAnimationFrame(animate);
        }

        function createEnvironment() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ 
                map: createCourtTexture(),
                roughness: 0.8
            });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Hoop Assembly
            hoopGroup = new THREE.Group();
            
            // 1. Pole
            const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.5, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, 1.75, -0.5); // Set back slightly
            pole.castShadow = true;
            hoopGroup.add(pole);

            // 2. Backboard
            const boardGeo = new THREE.BoxGeometry(1.8, 1.2, 0.05); // Standard-ish proportions
            const boardMat = new THREE.MeshStandardMaterial({ 
                map: createBackboardTexture(),
                roughness: 0.5
            });
            backboard = new THREE.Mesh(boardGeo, boardMat);
            backboard.position.set(0, 3.05, 0); // Bottom of backboard is higher than rim
            backboard.castShadow = true;
            hoopGroup.add(backboard);

            // 3. Rim
            const rimGeo = new THREE.TorusGeometry(0.225, 0.015, 16, 32); // 45cm diameter approx
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.2 });
            rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(0, 3.05, 0.25); // Extend from backboard
            rim.castShadow = true;
            hoopGroup.add(rim);

            // Place hoop group in world
            hoopGroup.position.set(0, 0, -5); // Position 5 units in front of origin
            scene.add(hoopGroup);
        }

        function createBall() {
            const ballRadius = 0.12; // Typical basketball size
            const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ 
                map: createBasketballTexture(),
                roughness: 0.6,
                metalness: 0.1
            });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.castShadow = true;
            
            // Physics properties
            ballBody = {
                radius: ballRadius,
                velocity: new THREE.Vector3(0,0,0),
                bounciness: 0.7
            };

            scene.add(ball);
            resetBallToGround();
        }

        function resetBallToGround() {
            // Place ball somewhere randomly on the floor within player's reach
            const angle = (Math.random() - 0.5) * Math.PI; // -90 to 90 deg relative to start
            const distance = 2 + Math.random() * 3; // 2 to 5 meters away
            
            // Position relative to player start (0,0,10)
            ball.position.set(
                Math.sin(angle) * distance,
                ballBody.radius, // Rest on ground
                10 - Math.cos(angle) * distance
            );
            
            ballBody.velocity.set(0,0,0);
            gameState = 'SEEKING_BALL';
            isScoredThisThrow = false;
            
            showMessage("尋找地上的籃球");
            reticle.style.borderColor = 'rgba(255, 0, 0, 0.7)';
            pickupProgress.style.strokeDashoffset = 176;
        }

        // --- STREAMING_CHUNK:Device Sensors & Controls Logic ---

        function setupControls() {
            // Desktop fallback: Mouse look
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            
            // Touch fallback for look around if device orientation fails/declined
            document.addEventListener('touchstart', onTouchStart, {passive: false});
            document.addEventListener('touchmove', onTouchMove, {passive: false});
            document.addEventListener('touchend', onPointerUp);
        }

        function requestPermissions() {
            // For iOS 13+ device orientation/motion
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            window.addEventListener('devicemotion', handleMotion);
                            deviceControlsEnabled = true;
                            startMatch();
                        } else {
                            alert("需允許感測器才能使用體感操作，將切換為滑鼠/觸控模式。");
                            startMatch();
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        startMatch(); // 確保即便拒絕或發生錯誤，遊戲仍能以滑鼠/觸控模式開始
                    });
            } else {
                // Non-iOS or older devices
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                deviceControlsEnabled = true;
                startMatch();
            }
        }

        // Simplified DeviceOrientation to look around. 
        // Mapping phone orientation to camera looking in space can be complex depending on how tablet is held.
        // Assuming user holds tablet landscape like a window.
        function handleOrientation(event) {
            if (!event.alpha || !event.beta || !event.gamma) return;
            if (gameState === 'START' || gameState === 'GAME_OVER') return;

            // Convert to radians
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0; // Z
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;   // X'
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0; // Y''
            
            // Screen orientation handling (Landscape typically 90 or -90)
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            
            // A basic mapping for holding tablet vertically or landscape in front of face
            // This is a simplified approach. Full robust device orientation controls are mathematically dense.
            // For this game, we mainly need the user to be able to scan left/right and up/down.
            
            // If device controls are active, we override camera rotation
            // We use a quaternion approach to avoid gimbal lock
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(- Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // - PI/2 around x

            euler.set(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
            camera.quaternion.multiply(q1);
            camera.quaternion.multiply(q0.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient));

            // Invert the camera's Z direction if needed based on testing, usually looking "through" the screen is correct.
        }

        // Motion detection for throwing
        let lastMotionTime = 0;
        let accelerationHistory = [];
        
        function handleMotion(event) {
            if (gameState !== 'HOLDING_BALL') return;
            
            const acc = event.acceleration; // Acceleration EXCLUDING gravity
            if (!acc || acc.z === null) return; // Fallback if hardware doesn't support clean acceleration

            const now = performance.now();
            if (now - lastMotionTime < 50) return; // Sample at ~20Hz
            lastMotionTime = now;

            // When holding tablet landscape in front, pushing forward is usually negative Z or positive Z depending on OS.
            // Pushing upward is Y.
            // Let's take the magnitude of the forward/upward vector relative to device.
            // For simplicity and broad compatibility, we check for a sudden spike in overall magnitude
            // or specifically the axis perpendicular to the screen (Z).
            
            const forceZ = Math.abs(acc.z);
            const forceY = Math.abs(acc.y);
            
            // Combine them to detect a "push forward and up" motion
            const pushMagnitude = Math.sqrt(forceZ*forceZ + forceY*forceY);

            accelerationHistory.push(pushMagnitude);
            if(accelerationHistory.length > 5) accelerationHistory.shift();

            // Detect peak
            const avgAcc = accelerationHistory.reduce((a,b)=>a+b, 0) / accelerationHistory.length;
            
            // Threshold for throw. Adjust based on real device feel.
            const THRESHOLD = 12.0; 
            
            if (pushMagnitude > THRESHOLD && pushMagnitude > avgAcc * 1.5) {
                // Motion detected! Calculate force based on magnitude, cap it.
                const throwForce = Math.min(pushMagnitude * 0.8, 25); 
                executeThrow(throwForce);
                accelerationHistory = []; // Reset
            }
        }

        // --- Desktop/Touch Fallback Controls ---
        function onPointerDown(e) {
            if (gameState === 'START' || gameState === 'GAME_OVER') return;
            
            if (gameState === 'HOLDING_BALL') {
                // Start charging throw
                isChargingThrow = true;
                chargePower = 0;
                powerMeterContainer.style.display = 'block';
                powerMeterFill.style.width = '0%';
            } else {
                // Drag to look around
                isDragging = true;
                previousMousePosition.x = e.clientX || e.touches[0].clientX;
                previousMousePosition.y = e.clientY || e.touches[0].clientY;
            }
        }

        function onPointerMove(e) {
            if (isDragging && !deviceControlsEnabled) {
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;

                // Rotate camera based on mouse drag. Note: Euler order YXZ is important.
                camera.rotation.order = 'YXZ';
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                
                // Clamp looking up/down
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));

                previousMousePosition = { x: clientX, y: clientY };
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            if (isChargingThrow) {
                isChargingThrow = false;
                powerMeterContainer.style.display = 'none';
                
                // Convert charge 0-100 to throw force (~8 to 22)
                const minForce = 8;
                const maxForce = 22;
                const force = minForce + (chargePower / 100) * (maxForce - minForce);
                executeThrow(force);
            }
        }

        function onTouchStart(e) {
            // Only use touch look if device controls didn't engage
            if (!deviceControlsEnabled && gameState !== 'HOLDING_BALL') {
                onPointerDown(e);
            } else if (gameState === 'HOLDING_BALL') {
                // Allow touch-and-hold to charge shot on mobile if sensors fail
                onPointerDown(e);
            }
        }
        function onTouchMove(e) {
            if (!deviceControlsEnabled) {
                e.preventDefault(); // Prevent scrolling
                onPointerMove(e);
            }
        }


        // --- STREAMING_CHUNK:Game Logic & Physics ---

        function startMatch() {
            startScreen.classList.add('hidden');
            startScreen.classList.remove('flex');
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            score = 0;
            timeLeft = 30;
            uiScore.innerText = score;
            uiTime.innerText = timeLeft;
            resetBallToGround();
            
            // Initial camera reset for fallback
            if(!deviceControlsEnabled) {
                 camera.rotation.set(0,0,0);
            }

            if (gameTimerId) clearInterval(gameTimerId);
            gameTimerId = setInterval(() => {
                timeLeft--;
                uiTime.innerText = timeLeft;
                if (timeLeft <= 0) {
                    endMatch();
                }
            }, 1000);
            
            lastFrameTime = performance.now();
        }

        function endMatch() {
            clearInterval(gameTimerId);
            gameState = 'GAME_OVER';
            finalScoreDisplay.innerText = score;
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            showMessage(""); // clear messages
        }

        function updateGameLogic(dt) {
            if (gameState === 'START' || gameState === 'GAME_OVER') return;

            // 1. Raycasting for Aiming
            if (gameState === 'SEEKING_BALL' || gameState === 'PICKING_UP') {
                raycaster.setFromCamera(screenCenter, camera);
                const intersects = raycaster.intersectObject(ball);

                if (intersects.length > 0) {
                    // Looking at ball
                    if (gameState === 'SEEKING_BALL') {
                        gameState = 'PICKING_UP';
                        reticle.style.borderColor = 'rgba(0, 255, 0, 0.8)';
                        aimTime = 0;
                    }
                    
                    aimTime += dt;
                    // Update UI ring (dashoffset 176 to 0)
                    const progress = Math.min(aimTime / AIM_REQUIRED_TIME, 1);
                    pickupProgress.style.strokeDashoffset = 176 - (progress * 176);

                    if (aimTime >= AIM_REQUIRED_TIME) {
                        pickUpBall();
                    }
                } else {
                    // Looked away
                    if (gameState === 'PICKING_UP') {
                        gameState = 'SEEKING_BALL';
                        reticle.style.borderColor = 'rgba(255, 0, 0, 0.7)';
                        pickupProgress.style.strokeDashoffset = 176;
                        aimTime = 0;
                    }
                }
            }

            // 2. Holding Ball Logic
            if (gameState === 'HOLDING_BALL') {
                // Place ball directly in front of camera, aligned with reticle
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                // Position ball slightly lower than center and close to camera
                const holdPos = camera.position.clone().add(forward.multiplyScalar(0.8));
                holdPos.y -= 0.2; 
                ball.position.copy(holdPos);
                
                // Spin ball slowly while holding
                ball.rotation.y += 1 * dt;
                ball.rotation.x += 0.5 * dt;

                // Desktop fallback charge logic
                if (isChargingThrow) {
                    chargePower += 100 * dt; // Max charge in 1 second
                    if (chargePower > 100) {
                        chargePower = 100; // Bounce back effect could be added, but capping is fine
                        isChargingThrow = false; // Auto release at max? Or wait. Let's wait.
                    }
                    powerMeterFill.style.width = chargePower + '%';
                    
                    // Shake ball slightly while charging
                    ball.position.x += (Math.random()-0.5)*0.02 * (chargePower/100);
                    ball.position.y += (Math.random()-0.5)*0.02 * (chargePower/100);
                }
            }

            // 3. In-Air Physics
            if (gameState === 'IN_AIR') {
                // Apply Gravity
                ballBody.velocity.y += gravity * dt;

                // Update Position
                const moveVec = ballBody.velocity.clone().multiplyScalar(dt);
                ball.position.add(moveVec);
                
                // Add some spin based on velocity
                ball.rotation.x -= ballBody.velocity.z * dt * 0.5;
                ball.rotation.y += ballBody.velocity.x * dt * 0.5;

                checkCollisions();
            }
        }

        function pickUpBall() {
            gameState = 'HOLDING_BALL';
            pickupProgress.style.strokeDashoffset = 176; // Reset ring
            reticle.style.borderColor = 'rgba(0, 255, 255, 0.5)'; // Change reticle color
            showMessage(deviceControlsEnabled ? "快速往前方推投出!" : "長按左鍵/螢幕蓄力發射!");
            
            // Add a slight visual pop when picked up
            ball.scale.set(1.2, 1.2, 1.2);
            setTimeout(() => ball.scale.set(1,1,1), 150);
        }

        function executeThrow(forceMagnitude) {
            gameState = 'IN_AIR';
            showMessage("");
            reticle.style.borderColor = 'rgba(255, 0, 0, 0.3)';

            // Get camera look direction
            const shootDir = new THREE.Vector3(0, 0, -1);
            shootDir.applyQuaternion(camera.quaternion);
            
            // Add an upward arc relative to looking angle
            // If looking straight, shoot up a bit. If looking way up, shoot more straight.
            const upwardArc = 0.6; 
            shootDir.y += upwardArc;
            shootDir.normalize();

            // Set initial velocity
            ballBody.velocity.copy(shootDir).multiplyScalar(forceMagnitude);
        }

        // --- STREAMING_CHUNK:Collisions & Rendering ---

        function checkCollisions() {
            // Ground Collision
            if (ball.position.y - ballBody.radius <= 0) {
                ball.position.y = ballBody.radius;
                ballBody.velocity.y *= -ballBody.bounciness;
                
                // Add friction
                ballBody.velocity.x *= 0.8;
                ballBody.velocity.z *= 0.8;

                // If moving very slowly, stop and reset
                if (ballBody.velocity.lengthSq() < 1) {
                     setTimeout(resetBallToGround, 500); // Wait half a sec before reset
                     gameState = 'WAITING_RESET'; // Temp state to stop physics update
                }
            }

            // Simple Backboard Collision (treat as AABB or Plane)
            // Backboard is at z=-5, width 1.8, height 1.2, y=3.05
            const boardZ = hoopGroup.position.z + backboard.position.z; // -5 + 0 = -5
            const boardY = backboard.position.y; // 3.05
            
            if (ballBody.velocity.z < 0 && // Moving towards board
                ball.position.z - ballBody.radius < boardZ + 0.05 && 
                ball.position.z + ballBody.radius > boardZ - 0.05 &&
                Math.abs(ball.position.x) < 0.9 && // Within width
                ball.position.y > boardY - 0.6 && ball.position.y < boardY + 0.6) // Within height
            {
                // Hit backboard! Bounce back.
                ball.position.z = boardZ + 0.05 + ballBody.radius;
                ballBody.velocity.z *= -0.6; // Loss of energy on board
            }

            // Scoring Logic (Passing through rim downwards)
            // Rim center is at (0, 3.05, 0.25) relative to hoopGroup (which is at z=-5)
            // World Rim Center: (0, 3.05, -4.75)
            const rimCenterWorld = new THREE.Vector3(0, 3.05, -4.75);
            
            // Check if ball is moving downwards, is roughly at rim height, and within rim radius
            if (ballBody.velocity.y < 0 && !isScoredThisThrow) {
                if (ball.position.y < 3.1 && ball.position.y > 2.8) {
                    const distToCenterSq = 
                        Math.pow(ball.position.x - rimCenterWorld.x, 2) + 
                        Math.pow(ball.position.z - rimCenterWorld.z, 2);
                    
                    // Rim radius is 0.225. Ball radius 0.12. Tolerance for swish.
                    if (distToCenterSq < Math.pow(0.225, 2)) {
                        handleScore();
                    }
                }
            }
            
            // Basic rim bounce (Very simplified. Real torus collision is math heavy)
            // If near rim height, but outside inner radius, inside outer radius -> bounce up
             if (ball.position.y < 3.2 && ball.position.y > 2.9 && !isScoredThisThrow) {
                 const distToCenter = Math.sqrt(
                        Math.pow(ball.position.x - rimCenterWorld.x, 2) + 
                        Math.pow(ball.position.z - rimCenterWorld.z, 2));
                 
                 // Between inner lip and outer edge of rim tube
                 if (distToCenter > 0.15 && distToCenter < 0.3) {
                     ballBody.velocity.y = Math.abs(ballBody.velocity.y) * 0.5; // Bounce up
                     // Deflect away from center
                     const deflectDir = new THREE.Vector3(ball.position.x, 0, ball.position.z - rimCenterWorld.z).normalize();
                     ballBody.velocity.x += deflectDir.x * 2;
                     ballBody.velocity.z += deflectDir.z * 2;
                 }
             }
        }

        function handleScore() {
            isScoredThisThrow = true;
            score += 1;
            uiScore.innerText = score;
            
            // Visual feedback
            showMessage("得分！", true);
            
            // Slight camera shake or flash could go here
            document.body.style.backgroundColor = "rgba(0, 255, 0, 0.2)";
            setTimeout(() => { document.body.style.backgroundColor = "#000"; }, 100);
        }

        function showMessage(text, flash = false) {
            messagePrompt.innerText = text;
            messagePrompt.style.opacity = text ? "1" : "0";
            if (flash) {
                messagePrompt.style.color = "#4ade80"; // Tailwind green-400
                messagePrompt.style.transform = "translate(-50%, -50%) scale(1.2)";
                setTimeout(() => {
                    messagePrompt.style.color = "white";
                    messagePrompt.style.transform = "translate(-50%, -50%) scale(1)";
                    if(gameState !== 'HOLDING_BALL') messagePrompt.style.opacity = "0";
                }, 1000);
            } else {
                messagePrompt.style.color = "white";
                messagePrompt.style.transform = "translate(-50%, -50%) scale(1)";
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            // Calculate delta time in seconds, cap at 0.1 to avoid huge jumps if tab is inactive
            const dt = Math.min((now - lastFrameTime) / 1000, 0.1); 
            lastFrameTime = now;

            updateGameLogic(dt);

            renderer.render(scene, camera);
        }

        // --- Initialization ---
        document.getElementById('start-btn').addEventListener('click', requestPermissions);
        document.getElementById('restart-btn').addEventListener('click', startMatch);
        
        // Prevent right click menu on canvas
        document.addEventListener('contextmenu', event => event.preventDefault());

        initThreeJS();
        setupControls();

    </script>


</body></html>
